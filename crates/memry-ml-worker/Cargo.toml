[package]
name = "memry-ml-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The out-of-process worker of MemryNote (pdfium, Tesseract, ONNX Runtime, whisper.cpp) and its supervisor. Never depends on tauri."
autobins = false

# The lib (frame codec, ops, supervisor) has no native dependency: memry-desktop links it with
# `default-features = false`. pdfium and Tesseract are C++ and read untrusted PDFs and images, so
# they run only in the `memry-ml-worker` process (#3542, R1 and R2), where a crash or a hang kills
# the child, not the app.
[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
memry-ml = { path = "../memry-ml", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[features]
default = ["native"]
# The worker binary: pdfium (`pdf`), bound at run time from the directory its `--pdfium-dir`
# names; Tesseract (`ocr`), built by build.rs from the sources `scripts/fetch-tesseract-sources.mjs`
# pins; and memry-ml (`embed`), which links ONNX Runtime statically (crates/AGENTS.md, ONNX
# Runtime), so building it needs `ORT_LIB_LOCATION` on every target but macOS arm64. A build
# without `embed` answers every embedding op with a failure: the dev loop builds one when ONNX
# Runtime is not at hand (apps/desktop-tauri/scripts/dev-worker.mjs), and one without `ocr`, which
# fails every OCR op, when cmake is not. whisper.cpp (`transcribe`) lives in memry-ml, so it needs
# ONNX Runtime and cmake both, and libclang for its bindgen; without it every transcription op
# fails. Releases build `native`.
native = ["pdf", "ocr", "embed", "transcribe"]
pdf = ["dep:pdfium-render", "dep:image"]
ocr = ["dep:image"]
embed = ["dep:memry-ml"]
transcribe = ["dep:memry-ml", "memry-ml/whisper"]

# The sidecar the app spawns (`memry_desktop::services::file_text::WorkerHandle`).
[[bin]]
name = "memry-ml-worker"
path = "src/main.rs"
required-features = ["pdf"]
test = false
doc = false

# Test-only stand-in with the same frames: hangs, crashes or answers an oversized frame on demand,
# so the supervisor's kill, restart and cap paths run without pdfium. Never bundled.
[[bin]]
name = "memry-ml-worker-stub"
path = "src/bin/stub.rs"
test = false
doc = false

[[test]]
name = "frame"
path = "tests/frame.rs"

[[test]]
name = "supervisor"
path = "tests/supervisor.rs"

[[test]]
name = "embed_worker"
path = "tests/embed_worker.rs"

[[test]]
name = "pdf"
path = "tests/pdf.rs"
required-features = ["pdf", "ocr"]

[[test]]
name = "embed"
path = "tests/embed.rs"
required-features = ["native"]

[[test]]
name = "embed_audio"
path = "tests/embed_audio.rs"
required-features = ["native"]

[[test]]
name = "transcribe"
path = "tests/transcribe.rs"
required-features = ["native"]

[[test]]
name = "transcribe_worker"
path = "tests/transcribe_worker.rs"

[[test]]
name = "ocr_timeout"
path = "tests/ocr_timeout.rs"

[[test]]
name = "ocr"
path = "tests/ocr.rs"
required-features = ["pdf", "ocr"]

[build-dependencies]
static_vcruntime = "3.0.0"
cmake = "0.1.58"

[dev-dependencies]
flate2 = { workspace = true }
memry-test-kit = { path = "../memry-test-kit" }
proptest = "1"
serde_json = { workspace = true }
tempfile = "3"
