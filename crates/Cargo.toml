[workspace]
resolver = "3"
members = [
    "memry-core",
    "memry-cli",
    "memry-desktop",
    "memry-ml",
    "memry-test-kit",
    "uniffi-bindgen-swift",
    "../apps/desktop-tauri/src-tauri",
]
# cargo-fuzz targets: nightly only, built on their own (`memry-core/fuzz`).
exclude = ["memry-core/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

# Every version the plan's Technical Context pins lives here, so a member crate
# never carries a second opinion about a shared dependency. `uniffi` is `=` because
# bindgen and runtime metadata versions must agree exactly (research R1).
[workspace.dependencies]
uniffi = "=0.32.1"
yrs = "0.27.4"
libsodium-sys-stable = "1.24.0"
zeroize = "1.8"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "trace", "limits"] }
# The vec0 virtual table of index.db (`memry-core` feature `vec`). Compiled from C
# against its own vendored `sqlite3.h` with `SQLITE_CORE`; only its SQLite symbols
# resolve to the bundled engine above. Registered with `sqlite3_auto_extension`.
sqlite-vec = "0.1.9"
ciborium = "0.2.2"
# Stock zlib, not the default `miniz_oxide` and not `zlib-rs`. Chapter 04 §4.1
# pins the frame's bytes to `pako.deflate`, and pako is a port of stock zlib.
# `miniz_oxide` and `zlib-rs` (a zlib-ng port) both choose a different deflate
# strategy at level 6 and produce a longer, non-identical stream for the same
# input, which fails the committed compression vectors.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1.92"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
# Only for `contentHash`, chapter 05 §5.9 A: a digest over a canonical JSON
# blob, not a protocol secret. libsodium carries a SHA-256 too, but every call
# into it goes through `crypto::sodium` by design and this is not one of that
# module's protocol primitives.
sha2 = "0.11"
time = "0.3"
# `name_key` composes to NFC before folding (chapter 12 §12.3), as desktop's
# `String.prototype.normalize` does.
unicode-normalization = "0.1.25"
# ONNX Runtime 1.31.0 for `memry-ml`, linked statically with the CPU execution provider only.
# Linking is per target (crates/AGENTS.md, ONNX Runtime); `memry-ml` adds the target features.
# `=` because each ort-sys release pins one ONNX Runtime version and its prebuilt archives.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "api-31"] }
# The EmbeddingGemma 2 tokenizer (`tokenizer.json`, BPE with byte fallback).
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# Decoders of the formats a vault image note can hold (packages/shared file-types.ts, minus SVG),
# pure Rust (Kaan, 2026-11-13): JPEG is zune-jpeg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pinned with `vpk` (same version): the pack format and the client must agree.
velopack = "=1.2.161"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# The image decoders and memry-ml's preprocessing work per pixel: unoptimised, the pixel-tensors
# vectors take minutes in the dev profile tests use. Integer and IEEE float results do not depend
# on the optimisation level.
[profile.dev.package.memry-ml]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

# WebView2 runs every init script in every frame, so an HTML embed got Tauri's IPC globals on
# Windows (#4150). This fork is wry 0.57.1 plus one commit that starts each main-frame-only script
# with a check that stops it outside the main frame.
# Upstream: https://github.com/tauri-apps/wry/pull/1929. Remove when wry ships it.
[patch.crates-io]
wry = { git = "https://github.com/memrynote/wry", rev = "f73aedfa757b988436a4efffff37b5c0be2259e1" }
# Tauri clones and drops tao's `EventLoopWindowTarget` on worker threads, and on Windows upstream
# tao counts the event loop runner it holds with a non-atomic `Rc`: lost updates freed the runner
# under the running loop and the app died with 0xC0000005 (#3967). This fork is tao 0.37.2 plus
# one commit that makes the count an `Arc`; tao-macros comes from the same tree so only one copy
# builds. `memry-tauri`'s `tests/event_loop_runner.rs` is red without it.
# Upstream: https://github.com/tauri-apps/tauri/issues/15408. Remove when tao ships it.
tao = { git = "https://github.com/memrynote/tao", rev = "317b55792617af0cb7a4aab908c04df0008040b1" }
tao-macros = { git = "https://github.com/memrynote/tao", rev = "317b55792617af0cb7a4aab908c04df0008040b1" }
