[workspace]
resolver = "3"
members = ["memry-core", "memry-cli", "uniffi-bindgen-swift"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"

# Every version the plan's Technical Context pins lives here, so a member crate
# never carries a second opinion about a shared dependency. `uniffi` is `=` because
# bindgen and runtime metadata versions must agree exactly (research R1).
[workspace.dependencies]
uniffi = "=0.32.1"
yrs = "0.27.4"
libsodium-sys-stable = "1.24.0"
zeroize = "1.8"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "trace", "limits"] }
ciborium = "0.2.2"
# Stock zlib, not the default `miniz_oxide` and not `zlib-rs`. Chapter 04 §4.1
# pins the frame's bytes to `pako.deflate`, and pako is a port of stock zlib.
# `miniz_oxide` and `zlib-rs` (a zlib-ng port) both choose a different deflate
# strategy at level 6 and produce a longer, non-identical stream for the same
# input, which fails the committed compression vectors.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1.92"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
time = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
