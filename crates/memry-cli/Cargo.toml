[package]
name = "memry-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "memry"
path = "src/main.rs"

[dependencies]
memry-core = { path = "../memry-core", features = ["native-transport"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream"] }
tokio-tungstenite = "0.30.0"
rustls = { version = "0.23", features = ["ring"] }
tokio = { workspace = true }
