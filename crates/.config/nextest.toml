# nextest runs every test in its own process, so the turn lock in `keyring_live.rs` (a process-wide
# mutex) does not keep two live keychain tests apart there. Credential Manager loses deletes when
# writers overlap, across processes too (#3716), so the live keychain binaries run one test at a
# time under nextest as well.
[test-groups]
live-keychain = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(keyring_live) | binary(electron_secrets_live)'
test-group = 'live-keychain'

# A hung test is killed after 5 minutes instead of running into the job's 65-minute limit. Tests
# that fail by hanging (a gate that never opens) then fail in minutes. The slowest test of a full
# run takes 157 s (markdown_depth on windows-2022, 29 Oct), so those two files get 15 minutes.
# markdown_depth is a module of memry-core's `integration` binary; markdown_proptest has its own.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(/^markdown_depth::/) | binary(markdown_proptest)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The live OS secret steps of rust-ci.yml (#3907). It keeps the default profile's limits and test
# group, reports every test, and runs the rest after one fails or hangs. The steps add
# --no-capture, which nextest has no setting for, to print each test's START line.
[profile.live]
status-level = "all"
final-status-level = "all"
fail-fast = false
