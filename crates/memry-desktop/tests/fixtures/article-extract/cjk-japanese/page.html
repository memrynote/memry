<article><h1>小さなツールが勝つ理由</h1>
<p>数年ごとに、新しいプラットフォームが机の上の十個のツールを一つに置き換えると約束します。それが実現することはほとんどありません。長く残るのは、一つのことをうまくこなすツールです。</p>
<p>パイプで二つのプログラムをつなぐ方が、千の設定画面よりも価値があります。「小さい」ことは、約束が少ないということです。</p>
<ruby>漢<rp>(</rp><rt>かん</rt><rp>)</rp></ruby>字 と全角スペース　と半角ｶﾅ。
</article></body></html>
