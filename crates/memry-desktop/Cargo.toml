[package]
name = "memry-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Desktop services of MemryNote. Never depends on tauri."
autotests = false

[dependencies]
# The markdown converter is a desktop-only feature of the core; iOS keeps it off.
memry-core = { path = "../memry-core", default-features = false, features = ["markdown"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
tracing-appender = "0.2.5"
sha2 = { workspace = true }
# `e2e::debug` runs read-only statements on a pooled reader of the core databases.
rusqlite = { workspace = true }
hex = { workspace = true }
# `rustls-no-provider` takes the process default crypto provider (`main` installs `ring`) and
# verifies certificates through rustls-platform-verifier. No `rustls` feature, so no second
# crypto provider.
# `Type` for ArticleCapture, pinned with the Tauri crate (tauri-specta rc.26 needs this exact version).
regex = "1"
url = "2"
percent-encoding = "2"
# Content types of served attachments (the `mime-types` table of the Electron app).
mime_guess = "2"
# The note fold's sentences and words (`Intl.Segmenter` in Electron), UAX #29.
unicode-segmentation = "1.13.3"
# The note fold formats inline dates in the local time zone, as `Intl.DateTimeFormat` does;
# already built for `trash`.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# `String.prototype.normalize("NFKC")` of the MathJax glyph text in `elements/math`.
unicode-normalization = "0.1.25"
# Turndown parses its input with domino, a spec-conformant HTML parser: the one place html5ever
# is used. Everything else parses with the htmlparser2 port.
html5ever = "0.40.1"
markup5ever = "0.40.0"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
# The large-file viewer's scans (`large_file/`): newlines with memchr, an ASCII case-folding
# literal search with aho-corasick.
memchr = "2.8"
aho-corasick = "1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream", "system-proxy"] }

# The OS credential stores behind `seams::secure_store`: keyring-core 1.x with the platform store
# crates. `keyring` 4.x builds one process-wide store in a `LazyLock`, so a Secret Service that
# starts after the app would stay unreachable; here a store is built again after any failure.
keyring-core = "1.0.1"

# `seams::reachability`: OS network events (macOS SCDynamicStore, Windows NotifyIpInterfaceChange,
# Linux netlink) on the Tokio runtime. No polling.
if-watch = { version = "3.2.2", features = ["tokio"] }

# The sync seams (`seams/tls`, `seams/transport`): one rustls stack, `ring` only.
# `rustls-platform-verifier` checks the chain against the OS trust store; `PinningVerifier` wraps it.
# The pins match only a path `rustls-webpki` (rustls's own verifier) built and verified against the
# OS roots `rustls-native-certs` loads: CA constraints, key usage, path length, validity and the
# signature algorithms rustls accepts (no SHA-1, RSA of 2048 bits at least).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std", "alloc"] }
rustls-native-certs = "0.8.4"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# `Sink` and `Stream` for the socket halves.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-trait = { workspace = true }

# Electron profile readers (read-only import of the previous app's data).
base64 = { workspace = true }
zeroize = { workspace = true }
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
aes-gcm = "0.11.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
hmac = "0.13.0"
md-5 = "0.11"
rusty-leveldb = "4.0.2"
snap = "1.1.2"
tempfile = "3"
uuid = { workspace = true }
# The shutdown sequence and the flush table are async and tauri-free.
tokio = { workspace = true, features = ["time", "sync", "net", "fs", "io-util"] }
# The loopback media server (`shell/loopback.rs`): HTTP/1 on 127.0.0.1, streamed bodies.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7.19", features = ["io"] }
icu_plurals = "2.4.0"
icu_locale = "2.4.0"
icu_decimal = "2.4.0"
notify = "8.2.1"
# Deleted notes' files go to the OS trash, not an unlink (`vault::trash`).
trash = "5.2.9"
# Custom icons (`notes::icons`): raster uploads are decoded and re-encoded as PNG. Only the four
# input formats of `CUSTOM_ICON_INPUT_EXTENSIONS` are compiled in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Copies a replaced file's extended attributes (Finder tags, quarantine) onto its successor.
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# async-io, not tokio: the keyring worker is a plain thread with no Tokio reactor, and this is
# the runtime the Step 06 `secret-service` readers above already use.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_SystemInformation"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[features]
# CI-only tests against the live OS secret store: tests/electron_secrets_live.rs.
live-os-secrets = []
# `KeyringStore::new` returns an in-memory store while `MEMRY_E2E=1`, so a headless CI box with no
# keyring never hangs. Never part of a release build (the e2e feature of memry-tauri).
e2e = []
# The test hooks of the note services (`NotesService::move_checked`, the `fail_next_*_feed`): the
# crate's own tests turn it on (the dev-dependency on itself below); no app build does.
test-hooks = []

[dev-dependencies]
memry-desktop = { path = ".", features = ["test-hooks"] }
proptest = "1"
memry-test-kit = { path = "../memry-test-kit" }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# `examples/cert_check.rs` prints the subject and validity of each presented certificate.
x509-parser = "0.18.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
flate2 = { workspace = true }
# The write-back tests author another device's edit the way the core's tests do.
yrs = { workspace = true }
# `journal_folder_held` counts the database steps a pass over the held days takes (`hooks`).
rusqlite = { workspace = true, features = ["hooks"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `shell/tray_host.rs` tests the real zbus over a socket pair, which is the `p2p` feature.
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io", "p2p"] }

[build-dependencies]
serde_json.workspace = true

# Integration tests: one binary for every file that runs in a shared process

# (tests/integration.rs), and a target of its own for each file that needs one.

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "activity_log_memory"
path = "tests/activity_log_memory.rs"

[[test]]
name = "custom_icons_memory"
path = "tests/custom_icons_memory.rs"

[[test]]
name = "electron_secrets_live"
path = "tests/electron_secrets_live.rs"

[[test]]
name = "electron_secrets_locked"
path = "tests/electron_secrets_locked.rs"

[[test]]
name = "extract_bench"
path = "tests/extract_bench.rs"

[[test]]
name = "keyring_live"
path = "tests/keyring_live.rs"

[[test]]
name = "large_file_memory"
path = "tests/large_file_memory.rs"

[[test]]
name = "logging"
path = "tests/logging.rs"

[[test]]
name = "note_file_memory"
path = "tests/note_file_memory.rs"

[[test]]
name = "obsidian_copy"
path = "tests/obsidian_copy.rs"

[[test]]
name = "properties_file_memory"
path = "tests/properties_file_memory.rs"

[[test]]
name = "reachability_live"
path = "tests/reachability_live.rs"

[[test]]
name = "redact_vectors"
path = "tests/redact_vectors.rs"

[[test]]
name = "sanitize_svg_memory"
path = "tests/sanitize_svg_memory.rs"

[[test]]
name = "telemetry_vectors"
path = "tests/telemetry_vectors.rs"

[[test]]
name = "watch_perf"
path = "tests/watch_perf.rs"

[[test]]
name = "writeback_crash"
path = "tests/writeback_crash.rs"
