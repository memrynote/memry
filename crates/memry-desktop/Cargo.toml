[package]
name = "memry-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Desktop services of MemryNote. Never depends on tauri."

[dependencies]
# The markdown converter is a desktop-only feature of the core; iOS keeps it off.
memry-core = { path = "../memry-core", default-features = false, features = ["markdown"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
tracing-appender = "0.2.5"
sha2 = { workspace = true }
# `e2e::debug` runs read-only statements on a pooled reader of the core databases.
rusqlite = { workspace = true }
hex = { workspace = true }
# `rustls-no-provider` takes the process default crypto provider (`main` installs `ring`) and
# verifies certificates through rustls-platform-verifier. No `rustls` feature, so no second
# provider and no aws-lc-rs.
# `Type` for ArticleCapture, pinned with the Tauri crate (tauri-specta rc.26 needs this exact version).
regex = "1"
url = "2"
# `String.prototype.normalize("NFKC")` of the MathJax glyph text in `elements/math`.
unicode-normalization = "0.1.25"
# Turndown parses its input with domino, a spec-conformant HTML parser: the one place html5ever
# is used. Everything else parses with the htmlparser2 port.
html5ever = "0.40.1"
markup5ever = "0.40.0"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream", "system-proxy"] }

# The OS credential stores behind `seams::secure_store`: keyring-core 1.x with the platform store
# crates. `keyring` 4.x builds one process-wide store in a `LazyLock`, so a Secret Service that
# starts after the app would stay unreachable; here a store is built again after any failure.
keyring-core = "1.0.1"

# The sync seams (`seams/tls`, `seams/transport`): one rustls stack, `ring` only, no aws-lc-rs.
# `rustls-platform-verifier` checks the chain against the OS trust store; `PinningVerifier` wraps it.
# `x509-parser` (`verify`, which is ring) reads the SPKI of the presented chain and checks its links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
x509-parser = { version = "0.18.1", features = ["verify"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# `Sink` and `Stream` for the socket halves.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-trait = { workspace = true }

# Electron profile readers (read-only import of the previous app's data).
base64 = { workspace = true }
zeroize = { workspace = true }
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
aes-gcm = "0.11.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
hmac = "0.13.0"
md-5 = "0.11"
rusty-leveldb = "4.0.2"
snap = "1.1.2"
tempfile = "3"
uuid = { workspace = true }
# The shutdown sequence and the flush table are async and tauri-free.
tokio = { workspace = true, features = ["time", "sync"] }
icu_plurals = "2.4.0"
icu_locale = "2.4.0"
icu_decimal = "2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Copies a replaced file's extended attributes (Finder tags, quarantine) onto its successor.
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# async-io, not tokio: the keyring worker is a plain thread with no Tokio reactor, and this is
# the runtime the Step 06 `secret-service` readers above already use.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_SystemInformation"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[features]
# CI-only tests against the live OS secret store: tests/electron_secrets_live.rs.
live-os-secrets = []
# `KeyringStore::new` returns an in-memory store while `MEMRY_E2E=1`, so a headless CI box with no
# keyring never hangs. Never part of a release build (the e2e feature of memry-tauri).
e2e = []

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
flate2 = { workspace = true }

[build-dependencies]
serde_json.workspace = true
