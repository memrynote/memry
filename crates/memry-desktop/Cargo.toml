[package]
name = "memry-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Desktop services of MemryNote. Never depends on tauri."
autotests = false

[dependencies]
# The markdown converter is a desktop-only feature of the core; iOS keeps it off.
memry-core = { path = "../memry-core", default-features = false, features = ["markdown", "vec"] }
# The PDF worker's frames and supervisor only: the pdfium side is the sidecar binary, never linked.
memry-ml-worker = { path = "../memry-ml-worker", default-features = false }
serde = { workspace = true }
# `float_roundtrip`: Readwise payload numbers (`location`, `published_date`) parse correctly
# rounded, as `JSON.parse` does; the default parser can land one ULP off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
# Device name and OS version for registration (Step 19); both already in the lockfile.
gethostname = "1.1.0"
os_info = { version = "3.15.0", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
tracing-appender = "0.2.5"
sha2 = { workspace = true }
# The platform data folder of `paths::default_data_dir`: the crate and version Tauri's path
# resolver uses, so the command line and the app agree on the app data folder.
dirs = "7.0.0"
# `e2e::debug` runs read-only statements on a pooled reader of the core databases.
rusqlite = { workspace = true }
hex = { workspace = true }
# `rustls-no-provider` takes the process default crypto provider (`main` installs `ring`) and
# verifies certificates through rustls-platform-verifier. No `rustls` feature, so no second
# crypto provider.
# `Type` for ArticleCapture, pinned with the Tauri crate (tauri-specta rc.26 needs this exact version).
regex = "1"
url = "2"
percent-encoding = "2"
# Content types of served attachments (the `mime-types` table of the Electron app).
mime_guess = "2"
# The note fold's sentences and words (`Intl.Segmenter` in Electron), UAX #29.
unicode-segmentation = "1.13.3"
# The note fold formats inline dates in the local time zone, as `Intl.DateTimeFormat` does;
# already built for `trash`.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# The IANA zones Readwise highlight dates are written in (`readwise::text::format_day`), as
# Electron's `Intl.DateTimeFormat` reads them.
chrono-tz = "0.10.4"
# The device zone's IANA name for the sandbox's calendar events (`sandbox::device_zone_name`);
# chrono's `clock` feature already builds it, so the lockfile gains no crate.
iana-time-zone = "0.1.65"
# `String.prototype.normalize("NFKC")` of the MathJax glyph text in `elements/math`.
unicode-normalization = "0.1.25"
# Spec-conformant HTML parsing where Electron uses one: Turndown's domino and the HTML block text
# reader's jsdom (`services/file_text/html`). Everything else parses with the htmlparser2 port.
html5ever = "0.40.1"
markup5ever = "0.40.0"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
# The large-file viewer's scans (`large_file/`): newlines with memchr, an ASCII case-folding
# literal search with aho-corasick.
memchr = "2.8"
aho-corasick = "1.1"
# The Inbox's page fetches (`services/web_fetch`) only: BoringSSL with Chrome's TLS and HTTP/2
# fingerprint, which Cloudflare-style bot walls let through (Electron used `net.fetch` for this).
# Every other HTTP client stays on reqwest and `ring` rustls.
wreq = { version = "0.16.3", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "brotli", "deflate", "zstd", "system-proxy", "stream"] }
wreq-util = { version = "0.2.1", default-features = false, features = ["emulation"] }
webpki-root-certs = "1.0.7"
encoding_rs = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream", "system-proxy"] }

# The OS credential stores behind `seams::secure_store`: keyring-core 1.x with the platform store
# crates. `keyring` 4.x builds one process-wide store in a `LazyLock`, so a Secret Service that
# starts after the app would stay unreachable; here a store is built again after any failure.
keyring-core = "1.0.1"

# `seams::reachability`: OS network events (macOS SCDynamicStore, Windows NotifyIpInterfaceChange,
# Linux netlink) on the Tokio runtime. No polling.
if-watch = { version = "3.2.2", features = ["tokio"] }

# The sync seams (`seams/tls`, `seams/transport`): one rustls stack, `ring` only.
# `rustls-platform-verifier` checks the chain against the OS trust store; `PinningVerifier` wraps it.
# The pins match only a path `rustls-webpki` (rustls's own verifier) built and verified against the
# OS roots `rustls-native-certs` loads: CA constraints, key usage, path length, validity and the
# signature algorithms rustls accepts (no SHA-1, RSA of 2048 bits at least).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std", "alloc"] }
rustls-native-certs = "0.8.4"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# `Sink` and `Stream` for the socket halves.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-trait = { workspace = true }

# Electron profile readers (read-only import of the previous app's data).
base64 = { workspace = true }
zeroize = { workspace = true }
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
aes-gcm = "0.11.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
hmac = "0.13.0"
md-5 = "0.11"
rusty-leveldb = "4.0.2"
snap = "1.1.2"
tempfile = "3"
uuid = { workspace = true }
# The shutdown sequence and the flush table are async and tauri-free.
tokio = { workspace = true, features = ["time", "sync", "net", "fs", "io-util"] }
# The loopback media server (`shell/loopback.rs`): HTTP/1 on 127.0.0.1, streamed bodies.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# The capture server's own serve loop (`services/capture/mod.rs`): header and request timeouts
# and a connection cap, which `axum::serve` lacks. Already in the lockfile through axum.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7.19", features = ["io"] }
# The sign-in loopback compares `state` in constant time; already in the lockfile.
subtle = "2.6.1"
icu_plurals = "2.4.0"
icu_locale = "2.4.0"
icu_decimal = "2.4.0"
notify = "8.2.1"
# Deleted notes' files go to the OS trash, not an unlink (`vault::trash`).
trash = "5.2.9"
# Custom icons (`notes::icons`): raster uploads are decoded and re-encoded as PNG. Only the four
# input formats of `CUSTOM_ICON_INPUT_EXTENSIONS` are compiled in.
image = { workspace = true }
# The bounded decode of untrusted images (`services::image_processing`); never `memry-ml`, which
# links ONNX Runtime.
memry-media = { path = "../memry-media" }
# The OCR language packs are gzip; native Tesseract reads them unpacked (`services::ocr_languages`).
flate2 = { workspace = true }
# Note export (Step 34, #3551): markdown rendered as `marked` renders it, without the CLI and highlighting defaults.
comrak = { version = "=0.57.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Copies a replaced file's extended attributes (Finder tags, quarantine) onto its successor.
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# async-io, not tokio: the keyring worker is a plain thread with no Tokio reactor, and this is
# the runtime the Step 06 `secret-service` readers above already use.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_SystemInformation"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[features]
# CI-only tests against the live OS secret store: tests/electron_secrets_live.rs.
live-os-secrets = []
# `KeyringStore::new` returns an in-memory store while `MEMRY_E2E=1`, so a headless CI box with no
# keyring never hangs. Never part of a release build (the e2e feature of memry-tauri).
e2e = []
# The test hooks of the note services (`NotesService::move_checked`, the `fail_next_*_feed`): the
# crate's own tests turn it on (the dev-dependency on itself below); no app build does.
test-hooks = []
# Tests against the real sync server on miniflare: tests/sync_harness.rs. Needs node and
# `pnpm install` (tests/sync-harness).
harness = []

[dev-dependencies]
memry-desktop = { path = ".", features = ["test-hooks"] }
proptest = "1"
memry-test-kit = { path = "../memry-test-kit" }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# `examples/cert_check.rs` prints the subject and validity of each presented certificate.
x509-parser = "0.18.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The write-back tests author another device's edit the way the core's tests do.
yrs = { workspace = true }
# `journal_folder_held` counts the database steps a pass over the held days takes (`hooks`).
rusqlite = { workspace = true, features = ["hooks"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `shell/tray_host.rs` tests the real zbus over a socket pair, which is the `p2p` feature.
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io", "p2p"] }

[build-dependencies]
serde_json.workspace = true

# The stub worker of `memry-ml-worker` (its `src/bin/stub.rs`), built here so the integration
# tests drive `embedding::worker::WorkerModel` over a real child process: Cargo hands a test the
# path of its own package's binaries only. Test builds only (`test-hooks`); never bundled.
[[bin]]
name = "memry-desktop-worker-stub"
path = "../memry-ml-worker/src/bin/stub.rs"
required-features = ["test-hooks"]
test = false
doc = false

# Integration tests: one binary for every file that runs in a shared process

# (tests/integration.rs), and a target of its own for each file that needs one.

