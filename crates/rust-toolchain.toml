# Pins local builds to the version rust-ci.yml uses, so "works on my machine"
# and "green in CI" mean the same thing. Entering crates/ is enough; no
# `rustup default` and no effect on other projects on this machine.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
