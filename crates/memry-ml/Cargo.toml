[package]
name = "memry-ml"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native ML of MemryNote: EmbeddingGemma 2 on an in-process ONNX Runtime. Never depends on tauri."

[dependencies]
ort = { workspace = true }
tokenizers = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The bounded decode of untrusted images (`image_prep::prepare`).
memry-media = { path = "../memry-media" }

# ONNX Runtime 1.31.0 is linked statically (crates/AGENTS.md, ONNX Runtime). Apple Silicon links
# ort-sys's prebuilt archive, downloaded at build time. pyke builds the Apple Silicon archive with
# CoreML, so the dist only matches with the `coreml` feature; the provider
# is linked and never registered. Every other target links the CPU-only archive of
# `build-ort-static.yml` through `ORT_LIB_LOCATION` and downloads nothing.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { workspace = true, features = ["download-binaries", "tls-rustls", "coreml"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# whisper.cpp for voice transcription (`whisper`, #3541), with Metal on macOS. Its build reads the
# `GGML_*` and `CMAKE_*` entries of `crates/.cargo/config.toml`. Windows ARM64 has none yet:
# ggml's ARM CPU code needs clang, and the MSVC build there refuses it (crates/AGENTS.md).
whisper-rs = { version = "=0.16.0", optional = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", all(windows, target_arch = "aarch64"))))'.dependencies]
whisper-rs = { version = "=0.16.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[features]
# Speech to text on whisper.cpp (`WhisperEngine`), for the worker's transcription ops.
whisper = ["dep:whisper-rs"]

# The static VC runtime of the Windows archives (build.rs); the version tauri-build uses.
[build-dependencies]
static_vcruntime = "3.0.0"

[dev-dependencies]
# `tests/common/image.rs` reads an input's profile to class its divergence.
image = { workspace = true }
base64 = { workspace = true }
memry-test-kit = { path = "../memry-test-kit" }
proptest = "1"
serde_json = { workspace = true }
tempfile = "3"
