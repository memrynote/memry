[package]
name = "memry-ml"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native ML of MemryNote: EmbeddingGemma 2 on an in-process ONNX Runtime. Never depends on tauri."

[dependencies]
ort = { workspace = true }
tokenizers = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# Decoders of the formats a vault image note can hold (packages/shared file-types.ts, minus SVG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# sharp's JPEG decoder (mozjpeg's libjpeg-turbo, islow IDCT, fancy upsampling) and colour
# management (Little CMS 2.19), so decoded pixels equal Electron's bit for bit. Both build their
# C with `cc`; mozjpeg without SIMD needs no nasm, and its scalar output equals the SIMD paths.
mozjpeg = { version = "0.10", default-features = false }
lcms2 = "6"
moxcms = "0.8" # WIP: to_srgb still on moxcms; replace with lcms2 (handoff)

# ONNX Runtime 1.31.0 is linked statically (crates/AGENTS.md, ONNX Runtime). Apple Silicon links
# ort-sys's prebuilt archive, downloaded at build time. pyke builds the Apple Silicon archive with
# CoreML, so the dist only matches with the `coreml` feature; the provider
# is linked and never registered. Every other target links the CPU-only archive of
# `build-ort-static.yml` through `ORT_LIB_LOCATION` and downloads nothing.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { workspace = true, features = ["download-binaries", "tls-rustls", "coreml"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

# The static VC runtime of the Windows archives (build.rs); the version tauri-build uses.
[build-dependencies]
static_vcruntime = "3.0.0"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
