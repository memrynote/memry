[package]
name = "memry-ml"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native ML of MemryNote: EmbeddingGemma 2 on an in-process ONNX Runtime. Never depends on tauri."

[dependencies]
ort = { workspace = true }
tokenizers = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
# Colour management in pure Rust (Kaan, 2026-11-13): sharp converts with Little CMS, so a
# profile-tagged image can differ by a level per channel (test-vectors README, pixel tensors).
moxcms = "0.8"
# zlib inflate in pure Rust (the `png` crate's own): bounds an `iCCP` profile before decoding.
fdeflate = "0.3"
# The JPEG decoder `image` runs: its header reader sizes a progressive frame before decoding.
zune-jpeg = "0.5"

# ONNX Runtime 1.31.0 is linked statically (crates/AGENTS.md, ONNX Runtime). Apple Silicon links
# ort-sys's prebuilt archive, downloaded at build time. pyke builds the Apple Silicon archive with
# CoreML, so the dist only matches with the `coreml` feature; the provider
# is linked and never registered. Every other target links the CPU-only archive of
# `build-ort-static.yml` through `ORT_LIB_LOCATION` and downloads nothing.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { workspace = true, features = ["download-binaries", "tls-rustls", "coreml"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

# The static VC runtime of the Windows archives (build.rs); the version tauri-build uses.
[build-dependencies]
static_vcruntime = "3.0.0"

[dev-dependencies]
base64 = { workspace = true }
memry-test-kit = { path = "../memry-test-kit" }
proptest = "1"
serde_json = { workspace = true }
tempfile = "3"
