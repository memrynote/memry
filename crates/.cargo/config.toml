# ONNX Runtime for memry-ml (crates/AGENTS.md, ONNX Runtime).
#
# macOS arm64 needs nothing: ort-sys downloads its prebuilt static archive at build time. macOS
# x64, Windows x64 and ARM64 and Linux x64 and arm64 link the CPU-only archive of
# .github/workflows/build-ort-static.yml. Fetch it, check its sha256 against the pin below (the
# same pins as .github/actions/ort-static) and export ORT_LIB_LOCATION before building:
#
#   gh release download ort-static-1.31.0-r2 --repo memrynote/memry --pattern 'ort-static-1.31.0-r2-<triple>.tar.zst'
#   cmake -E sha256sum ort-static-1.31.0-r2-<triple>.tar.zst
#   mkdir ort-static && (cd ort-static && cmake -E tar xf ../ort-static-1.31.0-r2-<triple>.tar.zst)
#   export ORT_LIB_LOCATION="$PWD/ort-static"
#
#   x86_64-apple-darwin       4fb1160c4677ece8934f54069cdbfe5cad70a621d4cd12f8d92ab47bf37514ca
#   x86_64-pc-windows-msvc    5febd3aca7ed519549fda1c907cd522f9d435c84888e5b55622e14bb97aeb899
#   aarch64-pc-windows-msvc   887e613bf0ae6ceb9b01c84f8369828e01e57239d8a4d73c15df5895fc9c0b09
#   x86_64-unknown-linux-gnu  bb24e11f9372555b94b60de271de156fd28eba3406aed3fa3364bbbb35f5dc05
#   aarch64-unknown-linux-gnu 808acbc9938a54af1c16a221395297cd8c099a39ffdc49286d054dc2c5d90f82
#                             (release ort-static-1.31.0-r3, not r2: replace r2 with r3 in the commands)
#
# ORT_LIB_LOCATION stays an environment variable, not an [env] entry: an entry here would also
# apply on the targets that link the prebuilt archive, and ort-sys would look for libraries there.

# Developer tasks (`crates/xtask`): `cargo xtask seed bench`.
[alias]
xtask = "run -p xtask --"

# whisper.cpp for memry-ml's `whisper` feature (crates/AGENTS.md, whisper.cpp). whisper-rs-sys
# passes every `GGML_*` and `CMAKE_*` variable to its cmake build, and nothing else reads them.
# - `GGML_NATIVE` off: ggml's default is `-march=native`, which builds for the build machine's CPU
#   and dies on an older one. Off, x86 builds for SSE4.2, AVX, AVX2, BMI2, FMA and F16C
#   (`WhisperEngine::load` refuses a CPU without them); ARM for the target's base.
# - The static VC runtime, which the worker links (`static_vcruntime` in its build.rs), as the
#   Tesseract build there sets it. The two variables do nothing outside MSVC.
# whisper-rs-sys generates its bindings with bindgen, which needs libclang. Its bundled bindings
# are no way around that: they hold Linux x86_64 layouts and fail to compile for Windows MSVC.
# A build run from outside `crates/` misses this file and has to set the same variables.
[env]
GGML_NATIVE = "OFF"
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

# Test scratch directories land in `crates/.tmp`, so the ones tests leak (`tempfile` `.keep()`,
# miniflare) stay out of the system temp dir and leave with the worktree.
# - `crates/.tmp` is committed (only its `.gitignore`, which ignores everything else), so it exists
#   in every checkout before the first build script runs. Cargo applies `[env]` to build scripts
#   too (libsodium's configure uses TMPDIR) and `tempfile` does not create a missing parent.
# - `relative` resolves against this file's parent, `crates/`, whatever `CARGO_TARGET_DIR` is.
# - `cargo clean` and `rm -rf` of a target dir do not clear it. Removing the worktree does, or
#   `find crates/.tmp -mindepth 1 -not -name .gitignore -delete`.
# - `force`: macOS already sets TMPDIR. Windows ignores it (std reads TMP/TEMP) and keeps its temp
#   dir.
TMPDIR = { value = ".tmp", relative = true, force = true }
