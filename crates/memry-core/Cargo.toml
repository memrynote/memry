[package]
name = "memry-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "memry_core"
# staticlib for the iOS XCFramework, cdylib for host-side binding tests,
# lib so `memry-cli` and the integration tests can depend on it normally.
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = []
# Pulls in a real HTTP/WebSocket transport implementation. The iOS shell never
# enables it: on device the transport is a foreign trait the Swift side fills in
# (Constitution I, no Rust networking on device).
native-transport = []
# The markdown converter (`src/markdown`), the Rust port of the Electron one.
# Desktop turns it on; the iOS build keeps it off and links none of it.
markdown = ["dep:html5ever", "dep:markup5ever", "dep:regex", "dep:url", "dep:uuid"]

[dependencies]
# Library mode: the proc-macro attributes are the only interface. `tokio` lets
# UniFFI export async functions driven by the core's runtime.
uniffi = { workspace = true, features = ["tokio"] }
# The CRDT tier. v1 update codec only: it is the Yjs reference format and the
# only one the protocol speaks (research R2, chapter 07). `sync` is what makes
# `Subscription` `Send + Sync`, which a registry shared across the runtime's
# threads needs; `Doc` is `Send + Sync` either way.
yrs = { workspace = true, features = ["sync"] }
libsodium-sys-stable = { workspace = true }
zeroize = { workspace = true }
bip39 = { workspace = true }
ciborium = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# `contentHash` only, chapter 05 §5.9 A.
sha2 = { workspace = true }
async-trait = { workspace = true }
# Storage. `bundled` pins the engine across simulator, device and CLI and
# compiles FTS5 in; there is no separate `fts5` feature flag (research R4).
rusqlite = { workspace = true }
# `spawn_blocking`: every statement runs on the blocking pool, so the connection
# mutex is never held across an await (research R4).
tokio = { workspace = true }
unicode-normalization = { workspace = true }
# The markdown converter's HTML5 tokenizer and tree builder (`src/markdown`).
# The TypeScript path parses HTML with jsdom, which uses parse5; both are
# WHATWG parsers and produce the same tree for the same fragment.
# Block ids of a seeded document (`crypto.randomUUID()` in the TypeScript).
uuid = { workspace = true, optional = true }
html5ever = { version = "0.40", optional = true }
markup5ever = { version = "0.40", optional = true }
# The TypeScript regular expressions that need no look-around or backreference
# (those become hand-written scanners). JS semantics differ from Rust's: use
# ASCII classes (`(?-u:\\w)`) where the JS pattern is ASCII, and spell JS `\\s`
# out.
regex = { version = "1.13", optional = true }
# WHATWG URL parsing for `shared::youtube` (JS `new URL`): hostnames go through IDNA
# and percent-decoding there, which a hand-written parser would only approximate.
url = { version = "2.5", optional = true }

[dev-dependencies]
dryoc = "1.0.0"
# `test-util` only: the auth tier's own backoff ladder sleeps on tokio's
# timer, and a paused clock is what keeps asserting it from costing seven
# real seconds.
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
insta = "1"
# The vector harness reads the committed JSON directly; an integration test
# links against the library, not against the library's dependency graph.
# `float_roundtrip`: the default float parser can land one ULP off, which a
# vector holding a computed f64 (column widths) would report as a divergence.
serde_json = { workspace = true, features = ["float_roundtrip"] }
ciborium = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
