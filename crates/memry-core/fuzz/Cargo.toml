[package]
name = "memry-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.5", features = ["derive"] }
memry-core = { path = "..", features = ["markdown"] }
serde_json = "1"

# Not a member of the memry workspace: the targets build with nightly only
# (`cargo +nightly fuzz run`), the workspace pins stable.
[workspace]

[[bin]]
name = "convert_roundtrip"
path = "fuzz_targets/convert_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontmatter_split"
path = "fuzz_targets/frontmatter_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replace_body"
path = "fuzz_targets/replace_body.rs"
test = false
doc = false
bench = false
