packages:
  - apps/*
  - packages/*
  - tests/*
  - '!spikes/**'

# Moved from .npmrc (pnpm 11 only reads auth/registry settings from .npmrc)
shamefullyHoist: true

# Replaces onlyBuiltDependencies (removed in pnpm 11)
allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: true
  sharp: true
  classic-level: true
  keytar: true
  core-js: false
  electron-winstaller: false
  msw: false
  onnxruntime-node: false
  protobufjs: false
  re2: false
  workerd: false
  spawn-sync: false
  unrs-resolver: true
  react-native-libsodium: set this to true or false

# Moved from package.json "pnpm.overrides" (no longer read by pnpm 11)
overrides:
  tar: '>=7.5.21'
  rollup: '>=4.59.0'
  hono: '>=4.13.5'
  # @modelcontextprotocol/sdk >=1.30 accepts '^1.19.9 || ^2.0.5';
  # 1.x has no patch.
  '@hono/node-server': '>=2.0.5 <3'
  esbuild: '>=0.28.1'
  express-rate-limit: '>=8.2.2'
  # Electron 43 (ABI 148) ABI detection: @electron/rebuild's transitive node-abi
  # is otherwise capped at 4.26.0 by minimumReleaseAge, and 4.26.0 predates
  # Electron 43 ("Could not detect abi for version 43.1.1"). Pin the version
  # that
  # maps Electron 43 (also age-excluded below).
  node-abi: '4.33.0'
  'minimatch@<4': 3.1.5
  'minimatch@>=5 <6': 5.1.9
  'minimatch@>=9 <10': 9.0.9
  'minimatch@>=10': 10.2.5
  undici: '>=7.29.0 <8'
  flatted: '>=3.4.2'
  lodash: '>=4.18.1'
  path-to-regexp: '>=8.4.2'
  picomatch: '>=4.0.4'
  vite: ^7.3.6
  markdown-it: '>=14.2.0'
  # BlockNote 0.54 pulls @tiptap/pm 3.31.3 (prosemirror-model 1.25.11,
  # prosemirror-view 1.42.4) while prosemirror-state 1.4.4 — a direct dep of
  # @memry/editor-web — keeps 1.25.4/1.41.6 alive. Two copies of
  # prosemirror-model make structurally identical Node/Fragment/Mark types
  # mutually unassignable, which is 41 of the 48 typecheck errors on the bump
  # and nothing to do with any real API change. One copy each.
  prosemirror-model: '1.25.11'
  prosemirror-view: '1.42.4'
  prosemirror-transform: '1.12.1'
  qs: '>=6.16.0'
  protobufjs: '>=7.6.5 <8'
  serialize-javascript: 7.0.5
  '@xmldom/xmldom': 0.8.15
  # Dependabot security alerts — pinned patched transitive versions
  shell-quote: '>=1.8.4'
  # Stay on the 5.x line: markdown-it 14 declares linkify-it ^5.0.0.
  linkify-it: '>=5.0.2 <6'
  dompurify: '>=3.4.13'
  form-data: '>=4.0.6'
  fast-uri: '>=3.1.6 <4'
  ip-address: '>=10.3.1'
  smol-toml: '>=1.7.1'
  srvx: '>=0.11.13'
  tmp: '>=0.2.6'
  ws: '>=8.21.0'
  '@babel/core': '>=7.29.6 <8'
  '@opentelemetry/core': '>=2.8.0 <3'
  '@tootallnate/once': '>=2.0.1 <3'
  adm-zip: '>=0.6.1'
  axios: '>=1.18.0 <2'
  builder-util-runtime: '>=9.7.0 <10'
  lodash-es: '>=4.18.0 <5'
  postcss: '>=8.5.18 <9'
  re2: '>=1.25.2 <2'
  # @huggingface/transformers and miniflare otherwise pin the vulnerable 0.34.5.
  sharp: '>=0.35.0 <0.36'
  # Scoped: only bump the vulnerable major line, leave other majors untouched
  'ajv@>=8.0.0 <8.18.0': '8.18.0'
  'body-parser@>=2.0.0 <2.3.0': '2.3.0'
  'brace-expansion@<1.1.16': '1.1.18'
  'brace-expansion@>=2.0.0 <2.1.3': '2.1.4'
  'brace-expansion@>=5.0.0 <5.0.9': '5.0.12'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  # nanoid 4.x has no patched release; the advisory's fix ships in 5.0.9.
  'nanoid@>=3.0.0 <3.3.18': '3.3.19'
  'nanoid@>=4.0.0 <5.0.9': '5.1.16'
  'uuid@<11.1.1': '11.1.1'
  'react-router@>=7.0.0 <7.18.0': '7.18.0'
  browserslist: '>=4.28.7 <5'
  baseline-browser-mapping: '>=2.11.0 <3'
  socket.io-parser: '>=4.2.7 <5'
  '@ai-sdk/provider-utils@>=4.0.0 <4.0.33': '4.0.54'
  mermaid: '>=11.16.1 <12'
  'postcss-selector-parser@>=7.0.0 <7.1.3': '7.1.6'
  '@humanfs/node': '>=0.16.8 <0.17'
  # Only reached through expo/metro, which drizzle-orm's optional expo-sqlite
  # peer drags into apps/cli; never loaded at runtime. No 1.x patch exists.
  'image-size@<2.0.3': '2.0.4'
  'decode-uri-component@<0.4.3': '0.5.0'

minimumReleaseAgeExclude:
  - defuddle@0.19.0
  - '@electron/rebuild@4.2.0'
  - node-abi@4.33.0
  - expo-image-picker@57.0.14
