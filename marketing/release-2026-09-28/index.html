    <script>
      const T = window.TL,
        FPS = T.fps,

      const BR = '#ff671a'
      const DARK = [13, 12, 11],
        PAPER = [244, 242, 238],
        INKD = [243, 239, 232],
        INKL = [28, 27, 25]
      const THEME = Object.fromEntries(window.THEMES.map((x) => [x.id, x]))
      const MENU = window.THEMES.map((x) => x.id) // the submenu lists them in this order
      const NS = 'http://www.w3.org/2000/svg'
      const q = new URLSearchParams(location.search)

      // =====================================================================
      // math
      // =====================================================================
      const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x)
      const lerp = (a, b, u) => a + (b - a) * u
      const inv = (t, a, b) => clamp((t - a) / (b - a))
      const oExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x))
      const iExpo = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10))
      const ioExpo = (x) =>
        x <= 0
          ? 0
          : x >= 1
            ? 1
            : x < 0.5
              ? Math.pow(2, 20 * x - 10) / 2
              : (2 - Math.pow(2, -20 * x + 10)) / 2
      const oCub = (x) => 1 - Math.pow(1 - x, 3)
      const iCub = (x) => x * x * x
      const ioCub = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
      const oQuint = (x) => 1 - Math.pow(1 - x, 5)
      const ioQuint = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2)
      const ioSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2
      const oBack = (x, s = 1.70158) =>
        x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)
      const smooth = (x) => x * x * (3 - 2 * x)
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
      const mixc = (a, b, u) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * u)
      const rgb = (c) => `rgb(${c.map((v) => Math.round(v)).join(',')})`
      const rgba = (c, a) => `rgba(${c.map((v) => Math.round(v)).join(',')},${(+a).toFixed(3)})`
      const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
      function rng(seed) {
        return () => {
          seed |= 0
          seed = (seed + 0x6d2b79f5) | 0
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      }
      function hash(a, b, c = 0) {
        let h =
          Math.imul((a + 0x9e3779b9) | 0, 0x85ebca6b) ^
          Math.imul((b + 0x7f4a7c15) | 0, 0xc2b2ae35) ^
          Math.imul((c + 0x165667b1) | 0, 0x27d4eb2f)
        h ^= h >>> 15
        h = Math.imul(h, 0x2c1b3c6d)
        h ^= h >>> 12
        return h >>> 0
      }

      // =====================================================================
      // dom helpers
      // =====================================================================
      const $ = (id) => document.getElementById(id)
      function el(tag, cls, parent, html) {
        const e = document.createElement(tag)
        if (cls) e.className = cls
        if (html != null) e.innerHTML = html
        if (parent) parent.appendChild(e)
        return e
      }
      function svg(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag)
        for (const k in attrs) e.setAttribute(k, attrs[k])
        if (parent) parent.appendChild(e)
        return e
      }
      // style writes go through a cache: render() touches hundreds of properties per frame
      function css(e, k, v) {
        const c = e._c || (e._c = {})
        if (c[k] !== v) {
          c[k] = v
          e.style[k] = v
        }
      }
      const show = (e, on) => css(e, 'display', on ? '' : 'none')
      const box = (e, x, y, w, h) => {
        e.style.left = x + 'px'
        e.style.top = y + 'px'
        if (w != null) e.style.width = w + 'px'
        if (h != null) e.style.height = h + 'px'
        return e
      }
      // masked words. "*x*" => emphasis (italic brand). returns the inner spans
      function words(parent, text) {
        const out = []
        text.split(' ').forEach((w, k, all) => {
          const m = el('span', 'm', parent)
          const em = w.startsWith('*')
          out.push(el(em ? 'em' : 'span', 'i', m, w.replace(/\*/g, '')))
          if (k < all.length - 1) parent.appendChild(document.createTextNode(' '))
        })
        return out
      }
      const rise = (e, x, y = 0) =>
        css(e, 'transform', `translateY(${((1 - x) * 112 - y * 112).toFixed(2)}%)`)

      // =====================================================================
      // camera: a pose puts native point (px,py) of a window at stage point (qx,qy)
      // =====================================================================
      const P = (px, py, qx, qy, s, rx = 0, ry = 0, rz = 0, z = 0, o = 1) => ({
        px,
        py,
        qx,
        qy,
        s,
        rx,
        ry,
        rz,
        z,
        o
      })
      function mixPose(a, b, u) {
        const r = {}
        for (const k in a) r[k] = a[k] + (b[k] - a[k]) * u
        return r
      }
      const tweak = (p, d) => Object.assign({}, p, d)
      function track(keys, t) {
        if (t <= keys[0][0]) return keys[0][1]
        for (let i = 1; i < keys.length; i++) {
          if (t <= keys[i][0]) {
            const [t0, p0] = keys[i - 1],
              [t1, p1, ez] = keys[i]
            return mixPose(p0, p1, (ez || ioCub)(inv(t, t0, t1)))
          }
        }
        return keys[keys.length - 1][1]
      }
      function place(e, p) {
        css(e, 'transformOrigin', `${p.px.toFixed(2)}px ${p.py.toFixed(2)}px`)
        css(
          e,
          'transform',
          `translate3d(${(p.qx - p.px).toFixed(2)}px,${(p.qy - p.py).toFixed(2)}px,${p.z.toFixed(2)}px) rotateX(${p.rx.toFixed(3)}deg) rotateY(${p.ry.toFixed(3)}deg) rotateZ(${p.rz.toFixed(3)}deg) scale(${p.s.toFixed(4)})`
        )
        css(e, 'opacity', String(+clamp(p.o).toFixed(3)))
      }

      // =====================================================================

      const SHOTS = {
        agent: [1176, 944],

        calendars: [1876, 1074],

            await im.decode()

            c.width = im.width
            c.height = im.height

      const patch = (parent, x, y, w, h, color) => {

      // =====================================================================

      function makeHead(o) {
        const root = el('div', 'hd' + (o.center ? ' center' : ''), $('type'))

        root.style.left = (o.center ? 0 : o.x) + 'px'
        root.style.top = o.y + 'px'

        if (o.label) {

        hh.style.fontSize = (o.size || 100) + 'px'
        h.h = hh
        o.lines.forEach((ln) => h.words.push(...words(el('span', 'ln', hh), ln)))

      }
      // a: in, b: out, o.sub: when the sub line lands, o.at: explicit word times
      function renderHead(h, t, a, b, o = {}) {
        const on = t >= a - 0.02 && t < b + 0.7
        show(h.root, on)
        if (!on) return
        if (h.labelIn)
          rise(h.labelIn, oExpo(inv(t, a - 0.05, a + 0.55)), iExpo(inv(t, b, b + 0.35)))
        h.words.forEach((w, k) => {
          const ta = o.at ? o.at[k] : a + 0.05 + k * (o.st || 0.075)
          const tb = b + k * 0.035
          rise(w, oExpo(inv(t, ta, ta + 0.75)), iExpo(inv(t, tb, tb + 0.4)))

          css(h.sub, 'opacity', (x * (1 - y)).toFixed(3))
          css(h.sub, 'transform', `translateY(${((1 - x) * 16 - y * 10).toFixed(2)}px)`)

      // decode: characters resolve left to right out of mono noise
      const GLYPHS = 'abcdefghijklmnopqrstuvwxyz0123456789#@!/.:+'
      function decode(e, text, t, a, b, frame, seed) {
        const n = text.length
        let s = ''
        for (let k = 0; k < n; k++) {
          const c = text[k]
          const tk = a + ((b - a) * k) / n
          if (t >= tk || c === ' ') s += c
          else if (t >= tk - 0.16) s += GLYPHS[hash(frame >> 1, k, seed) % GLYPHS.length]
          else s += '\u00a0'

        if (e._txt !== s) {

          e.textContent = s

      // =====================================================================
      // OPEN: "33" rolls in as two reels; the digits are windows onto the release
      // =====================================================================
      const OP = {}
      // the reels count up to counts.features (two digits): the tens reel turns once, the units reel twice
      const DIGITS = [Math.floor(T.counts.features / 10) % 10, T.counts.features % 10]
      const upTo = (d) => Array.from({ length: d + 1 }, (_, k) => k)
      const REEL = [
        [...upTo(9), ...upTo(DIGITS[0])],
        [...upTo(9), ...upTo(9), ...upTo(DIGITS[1])]

      // what each digit shows through its strokes: [shot, native x, native y at the cell center, scale]
      const FILLS = [
        [
          ['rail-graph', 930, 560, 1.0],
          ['timeline', 1010, 360, 0.95],
          ['agent', 430, 520, 1.05],
          ['themes', 1400, 560, 1.05],
          ['rail-calendar', 900, 420, 1.0],
          ['timeline', 1250, 850, 1.0]

        [
          ['blocks', 760, 835, 1.05],
          ['rail-tasks', 760, 380, 1.1],
          ['calendars', 1070, 640, 1.0],
          ['rail-journal', 800, 300, 1.05],
          ['themes', 1200, 330, 1.1],

      function buildOpen() {
        const root = $('open')
        const FS = 720
        const mc = document.createElement('canvas').getContext('2d')
        mc.font = `700 ${FS}px "DM Sans"`

        for (let d = 0; d < 10; d++) adv = Math.max(adv, mc.measureText(String(d)).width)
        const m3 = mc.measureText('3')
        const asc = m3.actualBoundingBoxAscent,

        const cw = Math.ceil(adv) + 30,

        OP.subText = `+ ${T.counts.improvements} improvements  \u00b7  ${T.counts.fixes} fixes`
        OP.sub.textContent = OP.subText
        const capW = Math.max(capH.offsetWidth, OP.sub.offsetWidth)
        const total = cw * 2 - kern + 70 + capW
        const x0 = Math.round((W - total) / 2),
          y0 = Math.round(H / 2 - ch / 2 + 10)
        OP.cells = [x0, x0 + cw - kern].map((x) => [x, y0])
        OP.cw = cw
        OP.ch = ch
        OP.base = base
        OP.pitch = ch
        cap.style.left = x0 + cw * 2 - kern + 70 + 'px'
        cap.style.top = Math.round(H / 2 - cap.offsetHeight / 2 + 4) + 'px'
        OP.cap = cap
        const defs = $('defs')
        OP.reels = OP.cells.map(([x, y], r) => {
          const cell = box(el('div', '', root), x, y, cw, ch)

          fill.style.clipPath = `url(#reel${r})`

            im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0'

            'svg',
            { width: cw, height: ch, style: 'position:absolute;left:0;top:0;overflow:visible' },

              'font-size': FS

          })

            'font-family': 'DM Sans',
            'font-weight': 700,
            'font-size': FS

        const c = document.createElement('canvas')
        c.width = cw
        c.height = ch
        const g2 = c.getContext('2d', { willReadFrequently: true })
        g2.font = `700 ${FS}px "DM Sans"`
        g2.textAlign = 'center'
        g2.fillText(String(DIGITS[0]), cw / 2, base)
        const d = g2.getImageData(0, 0, cw, ch).data
        const ins = (x, y) => x >= 0 && y >= 0 && x < cw && y < ch && d[(y * cw + x) * 4 + 3] > 128
        let best = [cw / 2, ch / 2, 0]
        for (let y = Math.floor(ch * 0.45); y < ch; y += 5)

            let r = 1
            outer: for (; r < 160; r += 2)
              for (let a = 0; a < 16; a++) {
                const ang = (a / 16) * Math.PI * 2
                if (!ins(Math.round(x + Math.cos(ang) * r), Math.round(y + Math.sin(ang) * r)))
                  break outer
              }
            if (r > best[2]) best = [x, y, r]
          }
        OP.focus = [x0 + best[0], y0 + best[1]]
        // the thought dot and the label
        OP.dot = el('div', 'dotc', root)
        OP.label = el('div', 'mono', root)
        OP.label.style.cssText =
          'position:absolute;left:0;top:0;font-size:22px;letter-spacing:.16em;white-space:nowrap;color:rgba(243,239,232,.72)'
        OP.labelText = `memrynote \u00b7 release ${T.version}`
        OP.label.textContent = OP.labelText
        OP.labelW = OP.label.offsetWidth
        OP.label.textContent = ''
      }
      function reelIdx(r, t) {
        const [a, b] = T.open.reels
        const n = REEL[r].length - 1
        const u = inv(t, a + r * 0.04, b)
        let idx = n * (1 - Math.pow(1 - u, 3.2))
        if (t > b) idx = n + 0.06 * Math.sin((t - b) * 34) * Math.exp(-(t - b) * 9)
        return idx
      }
      function renderOpen(t, frame) {
        const O = T.open
        const on = t < O.dive[1] + 0.02
        show($('open'), on)
        if (!on) return
        // dot + label: the dot lands, the label decodes out of it, both move up out of the way
        const up = ioCub(inv(t, 0.82, 1.2))
        const lx = lerp(W / 2 - (OP.labelW + 34) / 2, OP.cells[0][0] + 26, up)
        const ly = lerp(H / 2, OP.cells[0][1] - 18, up)
        const dotIn = oBack(inv(t, O.dot, O.dot + 0.45), 2.2)
        const labOut = iCub(inv(t, O.textOut, O.textOut + 0.3))
        const dr = 13 * dotIn * lerp(1, 0.72, up) * (1 - labOut)
        const dx = lerp(W / 2, lx + dr, ioCub(inv(t, O.label[0] - 0.08, O.label[0] + 0.3)))
        css(OP.dot, 'transform', `translate(${(dx - dr).toFixed(2)}px,${(ly - dr).toFixed(2)}px)`)
        css(OP.dot, 'width', (2 * dr).toFixed(2) + 'px')
        css(OP.dot, 'height', (2 * dr).toFixed(2) + 'px')
        decode(OP.label, OP.labelText, t, O.label[0], O.label[1], frame, 3)
        css(
          OP.label,
          'transform',
          `translate(${(lx + 34 * lerp(1, 0.8, up)).toFixed(2)}px,${(ly - 15).toFixed(2)}px) scale(${lerp(1, 0.86, up).toFixed(4)})`
        )
        css(OP.label, 'transformOrigin', '0 50%')
        css(OP.label, 'opacity', (1 - labOut).toFixed(3))
        // reels
        const [ra] = O.reels
        const diving = t >= O.dive[0]
        OP.reels.forEach((R, r) => {
          const appear = oExpo(inv(t, ra + r * 0.05, ra + 0.5 + r * 0.05))
          const out1 = r === 1 ? ioCub(inv(t, O.dive[0] - 0.05, O.dive[0] + 0.2)) : 0
          show(R.cell, appear > 0.001 && out1 < 1)
          if (appear <= 0.001) return
          const idx = reelIdx(r, t)
          const tr = `translate(0,${(-idx * OP.pitch).toFixed(2)})`
          R.g.setAttribute('transform', tr)
          R.og.setAttribute('transform', tr)
          css(
            R.cell,
            'transform',
            `translate(${(r === 1 ? out1 * 220 : 0).toFixed(1)}px,${((1 - appear) * 60).toFixed(1)}px)`
          )
          css(R.cell, 'opacity', (appear * (1 - out1)).toFixed(3))
          // fill: which cut is live, with a punch-in on each cut
          let k = -1,
            tk = ra
          O.cuts.forEach((c, i) => {
            if (t >= c) {
              k = i
              tk = c
            }
          })
          const fi = k < 0 ? 0 : k
          const [name, nx, ny, s0] = k < 0 ? FILLS[r][0] : FILLS[r][fi]
          const punch =
            1 +
            (k < 0
              ? 0.06 * (1 - oExpo(inv(t, ra, ra + 1.2)))
              : 0.13 * (1 - oExpo(inv(t, tk, tk + 0.45))))
          const drift = (t - tk) * 14 * (r ? -1 : 1)
          const s = s0 * punch
          R.imgs.forEach((im, i) => {
            const live = i === fi && !(diving && r === 0)
            show(im, live)
            if (live)
              css(
                im,
                'transform',
                `translate(${(OP.cw / 2 - nx * s + drift).toFixed(2)}px,${(OP.ch / 2 - ny * s).toFixed(2)}px) scale(${s.toFixed(4)})`
              )

          // outline: faint at rest, flashes brand orange as the reels lock
          const lock = Math.exp(-Math.max(0, t - O.reels[1]) * 5) * (t >= O.reels[1] ? 1 : 0)

        })

        OP.capWords.forEach((w, k) =>
          rise(
            w,
            oExpo(inv(t, O.caption + k * 0.09, O.caption + k * 0.09 + 0.7)),
            iExpo(inv(t, O.textOut + k * 0.03, O.textOut + k * 0.03 + 0.35))

        css(OP.sub, 'opacity', (1 - iCub(inv(t, O.textOut, O.textOut + 0.25))).toFixed(3))

      let maskN = 0

          while (t > x[i + 1]) i++
          const s = (t - x[i]) / h[i],
            s2 = s * s,
            s3 = s2 * s
          return (
            (2 * s3 - 3 * s2 + 1) * y[i] +
            (s3 - 2 * s2 + s) * h[i] * m[i] +
            (-2 * s3 + 3 * s2) * y[i + 1] +
            (s3 - s2) * h[i] * m[i + 1]

        }
      }
      // film time at which the recording reaches `src` (the map only moves forward)

      function buildVault() {

      }
      const chipX = (k) => 122 + 128 * k + 56
      // hung by its left edge: the sidebar, where the switching happens, stays large and in view
      const V_SET = P(0, 457, 800, 548, 1.0, 2, -10)
      function vaultPose(t) {
        const V = T.vaults
        return track(
          [
            [V.in[0], tweak(V_SET, { qx: 2300, ry: -40, z: -300 })],
            [V.in[1], V_SET, oQuint],

      function renderVault(t) {

        // the switcher, big: the open vault lights up, an orange dot follows it

        const cur = VAULT_SEQ[i],

        const aIn = i ? oBack(inv(t, t0, t0 + 0.36), 2.6) : 1,

      const A_SET = P(560, 470, 1300, 552, 0.84, 3, -16)

      // =====================================================================
      // THEMES: the real Appearance screenshot, repainted with each theme's real palette
      // =====================================================================
      const THM = { cache: new Map() }
      function buildThemes() {
        const [w0, h0] = SHOTS.themes
        const cv = el('canvas', 'shot')
        cv.width = w0
        cv.height = h0
        const w = makeWin('wM', 'themes', cv)
        crop(w, 690, 50, 200, 218)
        THM.w = w
        THM.cv = cv
        THM.cx = cv.getContext('2d')
        const s = SRC.themes.getContext('2d', { willReadFrequently: true })
        THM.px = s.getImageData(0, 0, w0, h0)
        THM.head = makeHead({
          x: 132,
          y: 318,
          label: '08 \u2014 Themes',
          lines: ['Make it', '*yours*.'],
          size: 132,
          sub: `${window.THEMES.length} color themes, in light and dark.`
        })
        THM.em = THM.head.words[2]
      }
      // gradient map: the screenshot's own neutral ramp onto the theme's derived tokens (base.css rules)
      function paletteOf(id, mode) {
        const p = THEME[id][mode]
        const bg = hex(p.bg),
          fg = hex(p.fg),
          sf = hex(p.surface),
          ac = hex(p.accent)
        const card = mode === 'dark' ? mixc(bg, fg, 0.06) : mixc(bg, [255, 255, 255], 0.5)
        return { bg, fg, sf, ac, card, border: mixc(bg, fg, 0.12), hover: mixc(sf, fg, 0.1), mode }
      }
      function themed(id, mode) {
        const key = id + '|' + mode
        if (THM.cache.has(key)) return THM.cache.get(key)
        const pal = paletteOf(id, mode)
        // control points on the original luminance: canvas, sidebar, card, borders, text
        const K = [
          [0, mixc(pal.bg, [0, 0, 0], mode === 'dark' ? 0.55 : 0.2)],
          [24, pal.bg],
          [33, pal.sf],
          [36, pal.card],
          [52, pal.border],
          [222, pal.fg],
          [255, mixc(pal.fg, mode === 'dark' ? [255, 255, 255] : [0, 0, 0], 0.2)]
        ]
        const lut = new Float32Array(256 * 3)
        for (let y = 0; y < 256; y++) {
          let i = 0
          while (i < K.length - 2 && y > K[i + 1][0]) i++
          const u = clamp((y - K[i][0]) / (K[i + 1][0] - K[i][0]))
          const c = mixc(K[i][1], K[i + 1][1], u)
          lut[y * 3] = c[0]
          lut[y * 3 + 1] = c[1]
          lut[y * 3 + 2] = c[2]
        }
        const src = THM.px.data
        const out = new ImageData(THM.px.width, THM.px.height)
        const d = out.data
        const yOr = 137
        for (let i = 0; i < src.length; i += 4) {
          const r = src[i],
            g = src[i + 1],
            b = src[i + 2]
          const y = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b)
          let R = lut[y * 3],
            G = lut[y * 3 + 1],
            B = lut[y * 3 + 2]
          const mx = Math.max(r, g, b),
            mn = Math.min(r, g, b)
          const sat = mx ? (mx - mn) / mx : 0
          if (sat > 0.22) {
            // brand-orange pixels become the theme accent; other hues keep their color
            const hue = r === mx ? ((g - b) / (mx - mn + 1e-6)) * 60 : 999
            const w = smooth(clamp((sat - 0.22) / 0.3))
            if (hue >= 8 && hue <= 40) {
              const a = clamp((y - 24) / (yOr - 24))
              R = lerp(R, lerp(pal.bg[0], pal.ac[0], a), w)
              G = lerp(G, lerp(pal.bg[1], pal.ac[1], a), w)
              B = lerp(B, lerp(pal.bg[2], pal.ac[2], a), w)
            } else {
              R = lerp(R, r, w)
              G = lerp(G, g, w)
              B = lerp(B, b, w)
            }
          }
          d[i] = R
          d[i + 1] = G
          d[i + 2] = B
          d[i + 3] = src[i + 3]
        }
        const c = document.createElement('canvas')
        c.width = out.width
        c.height = out.height
        const x = c.getContext('2d')
        x.putImageData(out, 0, 0)
        // the select shows the picked theme, the main menu's check moves off Memrynote
        const btn = lutAt(lut, sample('themes', 1300, 276))
        x.fillStyle = rgb(btn)
        x.fillRect(1262, 274, 88, 21)
        x.fillStyle = rgb(lutAt(lut, sample('themes', 1450, 500)))
        x.fillRect(1324, 312, 22, 20)
        x.fillStyle = rgb(pal.fg)
        x.font = '500 13px system-ui'
        x.textBaseline = 'middle'

      // a soft specular pass across a dark card as it lands
      function glint(e, t, a) {
        const u = inv(t, a, a + 1.1)
        show(e, u > 0 && u < 1)
        if (u > 0 && u < 1) css(e, 'backgroundPosition', `${(100 - ioSine(u) * 100).toFixed(2)}% 0`)
      }

      // =====================================================================
      // main
      // =====================================================================
      let BGX, SCX, GRX
      function render(t, frame = Math.round(t * FPS)) {
        renderCam(t)
        drawBG(t)
        renderOpen(t, frame)
        renderDive(t)
        renderRail(t)
        const wait = renderVault(t)
        renderAgent(t)
        renderHead(AG.head, t, T.agent.head, T.agent.out[0], { sub: T.agent.sub, st: 0.085 })
        renderTimeline(t)
        renderHead(TLN.head, t, T.timeline.head, T.timeline.out[0] - 0.05, { sub: T.timeline.sub })
        renderCalendars(t)
        renderBlocks(t)
        renderTasks(t, frame)
        renderThemes(t)
        renderMore(t)
        renderEnd(t)
        renderWipe(t)
        glint(TLN.glint, t, T.timeline.reveal[1])
        glint(CAL.glint, t, T.calendars.start + 0.05)
        glint(THM.glint, t, T.themes.start + 0.3)
        drawScrim(t)
        renderHUD(t)
        drawGrain(t, frame)
        // a promise while the vault section waits on a recording frame; the renderer awaits it
        return wait
      }
      // fast stretches get more motion-blur samples
      function fastRanges() {
        const R = T.rail,
          V = T.vaults,
          A = T.agent,
          L = T.timeline,
          C = T.calendars,
          B = T.blocks,
          K = T.tasks,
          M = T.themes,
          MO = T.more,
          E = T.end
        return [
          [0.85, 2.15],
          [T.open.dive[0] - 0.1, R.start + 0.1],
          [R.morph[0] - 0.05, R.pull[1] + 0.05],
          ...R.clicks.map((c) => [c - 0.03, c + 0.36]),
          [R.press - 0.03, R.press + 0.4],
          // the retimed recording moves fast almost throughout
          [R.out[0] - 0.05, V.out[1] + 0.1],
          [A.push[0] - 0.04, A.push[1] + 0.05],
          [A.out[0] - 0.05, L.start + 0.3],
          [L.out[0] - 0.05, C.start + 0.15],
          [C.out[0] - 0.06, B.start + 0.12],
          [B.words[1] - 0.17, B.words[1] + 0.05],
          [B.words[2] - 0.17, B.words[2] + 0.05],
          [B.pull[0] - 0.04, B.pull[1] + 0.05],
          [B.dive[0] - 0.05, K.start + 0.05],
          [K.enter - 0.05, K.enter + 0.4],
          [K.out[0] - 0.05, M.start + 0.35],
          [M.out[0] - 0.1, MO.start + 0.7],
          [MO.collapse[0] - 0.05, E.start + 0.15],
          [E.fade[1] - 0.6, E.fade[1] + 0.05]
        ]
      }
      let FAST = []
      window.samplesAt = (t) => (FAST.some(([a, b]) => t >= a && t <= b) ? 16 : 6)

      window.ready = (async () => {
        await Promise.all(
          [
            '700 100px "DM Sans"',
            '600 100px "DM Sans"',
            '500 100px "DM Sans"',
            'italic 600 100px "DM Sans"',
            '400 100px "DM Sans"',
            '500 20px "JetBrains Mono"'
          ].map((f) => document.fonts.load(f))
        )
        await document.fonts.ready
        await loadShots()
        BGX = $('bg').getContext('2d')
        SCX = $('scrim').getContext('2d')
        GRX = $('grain').getContext('2d')
        buildOpen()
        buildRail()
        buildVault()
        FAST = fastRanges()
        buildAgent()
        AG.head = makeHead({
          x: 132,
          y: 318,
          label: '03 \u2014 Agent',
          lines: ['Your agent', '*asks* first.'],
          size: 112,
          sub: 'Every edit lands as a diff in your note.<br>Nothing is saved until you accept.'
        })
        buildTimeline()
        TLN.head = makeHead({
          x: 132,
          y: 772,
          label: '04 \u2014 Timeline',
          lines: ['Plan on a *timeline*.'],
          size: 100,
          sub: 'Tasks, projects and events, laid out as a Gantt chart.'
        })
        buildCalendars()
        buildBlocks()
        buildTasks()
        buildThemes()
        // warm the palette cache so no frame pays for it
        const S = T.themes
        S.dark[2].forEach((id) => themed(id, 'dark'))
        S.light[2].forEach((id) => themed(id, 'light'))
        TLN.glint = el('div', 'glint', TLN.clip)
        CAL.glint = el('div', 'glint', CAL.w.c)
        THM.glint = el('div', 'glint', THM.w.c)
        buildMore()
        buildEnd()
        buildHUD()
        makeGrain()
        window.EVENTS = buildEvents()
        render(0)
        return true
      })()

      // events the score listens to (derived from the same timeline)
      function buildEvents() {
        const ev = []
        const add = (t, kind, extra = {}) => ev.push({ t: +t.toFixed(4), kind, ...extra })
        const O = T.open
        add(O.dot, 'dot')
        for (let k = 0; k < OP.labelText.length; k++)
          if (OP.labelText[k] !== ' ')
            add(O.label[0] + ((O.label[1] - O.label[0]) * k) / OP.labelText.length, 'decode', { k })
        add(O.reels[0], 'reels')
        // a tick every time the units reel passes a digit
        let last = 0
        for (let f = Math.round(O.reels[0] * FPS * 4); f <= O.reels[1] * FPS * 4; f++) {
          const i = Math.floor(reelIdx(1, f / FPS / 4) + 0.5)
          if (i > last) {
            add(f / FPS / 4, 'reelTick', { k: i })
            last = i
          }
        }
        add(O.reels[1], 'lock')
        add(O.caption, 'caption')
        for (let k = 0; k < OP.subText.length; k += 2)
          add(O.sub + (0.45 * k) / OP.subText.length, 'decode', { k: 100 + k })
        O.cuts.forEach((t, k) => k > 0 && add(t, 'cut', { k }))
        add(O.textOut, 'textOut')
        add(O.dive[0], 'dive')
        const R = T.rail
        add(R.start, 'railLand')
        add(R.morph[0], 'navFold')
        RAIL.forEach((_, k) => add(R.morph[0] + 0.03 * k, 'labelOut', { k }))
        add(R.morph[0] + 0.05, 'railSlide')
        RAIL.forEach((_, k) => {
          const f0 = R.morph[0] + 0.12 + 0.0625 * k
          add(f0, 'iconFly', { k })
          add(f0 + 0.42, 'iconLand', { k })
        })
        add(R.morph[0] + 0.3, 'treeUp')
        add(R.morph[1] - 0.08, 'tilePop')
        ;[1, 2].forEach((k) => add(R.morph[1] - 0.08 + 0.06 * k, 'badge', { k }))
        add(R.pull[0], 'pullBack')
        R.clicks.forEach((c, i) => {
          add(c - 0.16, 'tip', { k: 2 + i })
          add(c, 'railClick', { k: 2 + i })
        })
        add(R.cmd, 'cmdDown')
        RAIL.forEach((_, k) => add(R.cmd + 0.035 * k, 'numFlip', { k }))
        add(R.press, 'cmdPress', { k: 1 })
        add(R.release, 'cmdUp')
        add(R.out[0], 'railOut')
        const V = T.vaults
        add(V.in[0], 'vaultIn')
        add(V.lift[0], 'lift')
        add(V.lift[1] - 0.16, 'drop')
        // moments inside the recording: the panel starts paging, the recorder zooms in and out
        ;[
          [0.733, 'vpage'],
          [2.15, 'vpage'],
          [3.3, 'vzoomIn'],
          [4.283, 'vpage'],
          [5.5, 'vzoomOut']
        ].forEach(([s, kind], k) => add(vaultFilmAt(s), kind, { k }))
        V.switches.forEach((tt, k) => add(tt, 'vaultSwitch', { k, v: VAULT_SEQ[k + 1] }))
        V.clicks.forEach((tt, k) => add(tt, 'vaultClick', { k }))
        add(V.out[0], 'vaultOut')
        const A = T.agent
        add(A.start, 'arrive')
        add(A.push[0], 'push')
        A.edits.forEach((t, k) => add(t, k < 2 ? 'substitute' : 'insert', { k }))
        add(A.bar, 'bar')
        add(A.cursor[0], 'cursor')
        add(A.press, 'press')
        add(A.accept, 'accept')
        add(A.out[0], 'exit')
        const L = T.timeline
        add(L.line[0], 'line')
        add(L.pop, 'today')
        add(L.reveal[0], 'reveal')
        TL_ROWS.forEach((_, i) => add(rowStart(i), 'row', { k: i }))
        add(L.out[0], 'swing')
        T.calendars.rows.forEach((t, k) => add(t, 'provider', { k }))
        add(T.calendars.out[0], 'whipUp')
        const B = T.blocks
        B.words.forEach((t, k) => add(t, 'word', { k }))
        add(B.words[1] - 0.12, 'whip')
        add(B.words[2] - 0.12, 'whip')
        BLK.wipes.forEach((o, k) => add(o.a, k < 4 ? 'ink' : 'math', { k }))
        BLK.pops.forEach((o, k) => add(o.a, o.kind === 'pop' ? 'boxPop' : 'arrow', { k }))
        add(B.pull[0], 'pull')
        add(B.head, 'blocksHead')
        add(B.dive[0], 'diveRow')
        const S = T.tasks
        add(S.select, 'select')
        for (let i = 0; i < TK.full.length; i++)
          add(S.type + i * S.step, 'key', { k: i, space: TK.full[i] === ' ' })
        TK.tokens.forEach((k, i) => add(S.type + k.b * S.step, 'ghost', { k: i }))
        add(S.enter, 'enter')
        add(S.enter + 0.12, 'merge')
        add(S.out[0], 'iris')
        add(S.out[0] + (S.out[1] - S.out[0]) * 0.55, 'open')
        const M = T.themes
        M.dark[2].forEach((id, k) => add(M.dark[0] + k * M.dark[1], 'theme', { k, mode: 'dark' }))
        M.light[2].forEach((id, k) =>
          add(M.light[0] + k * M.light[1], 'theme', { k: M.dark[2].length + k, mode: 'light' })
        )
        add(M.light[0], 'lightSwitch')
        add(M.settle, 'settle')
        add(M.out[0], 'themesOut')
        MR.rows.forEach((_, r) => add(T.more.rows[0] + r * 0.07, 'rowIn', { k: r }))
        add(T.more.collapse[0], 'collapse')
        add(T.more.collapse[0] + 0.55, 'dotIn')
        const E = T.end
        add(E.start, 'mark')
        E.syllables.forEach((t, k) => add(t, 'syllable', { k }))
        add(E.tagline, 'tagline')
        add(E.url, 'url')
        add(E.meta, 'meta')
        add(E.fade[0], 'fade')
        return ev.sort((a, b) => a.t - b.t)
      }

      // live preview: ?t=12.3 freezes a frame; otherwise loops in real time
      if (!navigator.webdriver) {
        window.ready.then(() => {
          if (q.get('t') != null) return render(+q.get('t'))
          const t0 = performance.now()
          ;(function loop() {
            render(((performance.now() - t0) / 1000) % DUR)
            requestAnimationFrame(loop)
          })()
        })
      }
      window.render = render
    </script>
  </body>
</html>
