<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url(fonts/dm-sans-opsz-normal.woff2) format('woff2');
        font-weight: 100 1000;
      }
      /* The channel's thumbnail template, "E · Tutorial template" in Paper (file Features, page
         Thumbnail): the words on the left, one crop of the app on the right, one orange mark.
         Change it in Paper first, then here. */
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #f5f5f5;
        font-family: 'DM Sans', system-ui;
        -webkit-font-smoothing: antialiased;
      }
      #logo {
        position: absolute;
        left: 64px;
        top: 58px;
        width: 218px;
        height: 30px;
      }
      /* The words and the card share one center line, 381px down. */
      #headline {
        position: absolute;
        left: 64px;
        top: 381px;
        transform: translateY(-50%);
        font-weight: 700;
        line-height: 0.9067; /* 136px at 150px */
        letter-spacing: -0.045em;
        color: #1d1f22;
        white-space: pre;
      }
      #headline > div {
        display: flex;
        align-items: center;
        gap: 0.1333em;
        width: max-content;
      }
      #headline svg {
        flex-shrink: 0;
        width: 0.6933em;
        height: 0.5067em;
      }
      #headline .mark {
        color: #ff671a;
      }
      #card {
        position: absolute;
        right: 64px;
        top: 381px;
        transform: translateY(-50%);
        box-sizing: border-box;
        border: 1px solid #ebebec;
        border-radius: 24px;
        background-color: #fff;
        background-origin: border-box;
        background-repeat: no-repeat;
        box-shadow:
          0 24px 64px rgba(29, 31, 34, 0.1),
          0 2px 6px rgba(29, 31, 34, 0.05);
      }
    </style>
  </head>
  <body>
    <img id="logo" src="../../../assets/brand/memrynote/logo.svg" />
    <div id="headline"></div>
    <div id="card"></div>
    <script>
      // window.draw(P): P = { text, frame, crop: { x, y, w, h } }, set by thumb.mjs before each
      // screenshot. crop is the shot's center and size in the recorder's CSS px (1600x900 at 2x).
      // Returns { overflow, cover }: why the words do not fit beside the card (or null), and the
      // share of the frame the card covers.
      const SIZE = 150 // px, the template's type size
      const FLOOR = 96 // px; smaller words stop reading at 168 px wide
      const GAP = 56 // px between the words and the card
      const BOX = { w: 500, h: 469 } // the card's largest size
      const ARROW =
        '<svg viewBox="0 0 104 76"><path d="M7 38 H88 M60 11 L90 38 L60 65" fill="none" ' +
        'stroke="#ff671a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

      window.draw = async (P) => {
        // One orange mark: the arrow, or without one the last line's final . ? or !
        const lines = P.text.split('\n')
        const arrow = P.text.includes('→')
        const head = document.getElementById('headline')
        head.innerHTML = lines
          .map((l, i) => {
            if (l.includes('→')) {
              const [a, b] = l.split('→').map((s) => s.trim())
              return `<div>${a ? `<span>${esc(a)}</span>` : ''}${ARROW}${b ? `<span>${esc(b)}</span>` : ''}</div>`
            }
            if (!arrow && i === lines.length - 1)
              return `<div><span>${esc(l.slice(0, -1))}<span class="mark">${esc(l.slice(-1))}</span></span></div>`
            return `<div><span>${esc(l)}</span></div>`
          })
          .join('')
        head.style.fontSize = `${SIZE}px`

        const card = document.getElementById('card')
        const k = Math.min(BOX.w / P.crop.w, BOX.h / P.crop.h) // screen px per recorder CSS px
        card.style.width = `${P.crop.w * k}px`
        card.style.height = `${P.crop.h * k}px`
        card.style.backgroundImage = `url("${P.frame}")`
        card.style.backgroundSize = `${1600 * k}px ${900 * k}px`
        card.style.backgroundPosition = `${-(P.crop.x - P.crop.w / 2) * k}px ${-(P.crop.y - P.crop.h / 2) * k}px`

        await document.fonts.ready
        const img = new Image()
        img.src = P.frame
        await Promise.all([img, ...document.images].map((i) => i.decode()))

        // Shrink the words until the widest line clears the card.
        const room = 1280 - 64 - P.crop.w * k - GAP - 64
        const widest = () =>
          Math.max(...[...head.children].map((d) => d.getBoundingClientRect().width))
        let size = SIZE
        while (widest() > room && size > FLOOR) head.style.fontSize = `${(size -= 2)}px`
        const overflow =
          widest() > room
            ? `needs ${Math.ceil(widest())} px at ${FLOOR} px type, and the space beside the card is ${Math.floor(room)} px`
            : null
        return { overflow, cover: (P.crop.w * k * P.crop.h * k) / (1280 * 720) }
      }
    </script>
  </body>
</html>
