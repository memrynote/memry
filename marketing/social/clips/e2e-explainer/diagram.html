<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- End-to-end encryption as a diagram, at the app window's size (1600x900). Maya types a line
         on her laptop; the laptop seals it with XChaCha20-Poly1305 under a key the server never
         gets; the sealed box crosses to the sync server, which stores it but holds no key; her
         phone, which holds the key, opens it. scenes.mjs drives each beat (e2e.type, seal, send,
         noKey, deliver, unlock) and hands in a real ciphertext of the line. Times are film seconds:
         the page clock runs window.SLOW times slower than real time (see scenes.mjs).
         Icons: lucide 0.562.0 (ISC). -->
    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url(../../../explainer-30s/fonts/dm-sans-opsz-normal.woff2) format('woff2');
        font-weight: 100 1000;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url(../../../explainer-30s/fonts/jetbrains-mono.woff2) format('woff2');
        font-weight: 100 800;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #fbf9f5;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: #2f2d2a;
        -webkit-font-smoothing: antialiased;
      }
      .a {
        position: absolute;
      }
      /* Everything below is laid out in stage px; #stage scales it to fill the frame above the
         caption band (bottom 18%). e2e.focus() gives page px for the camera. */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        transform-origin: 0 0;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .label {
        top: 548px;
        width: 400px;
        text-align: center;
        font-size: 30px;
        font-weight: 600;
        color: #6b6560;
      }
      .ct {
        font-family: 'JetBrains Mono', monospace;
        color: #ff7a33;
        word-break: break-all;
      }

      /* laptop */
      #bezel {
        left: 75px;
        top: 232px;
        width: 450px;
        height: 266px;
        border-radius: 18px 18px 6px 6px;
        background: #2f2d2a;
      }
      #lscreen {
        left: 11px;
        top: 11px;
        width: 428px;
        height: 244px;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }
      .appbar {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 14px;
        background: #f3f1ee;
        border-bottom: 1.5px solid #ece7e0;
      }
      .appbar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d9d4cc;
      }
      .crumb {
        font:
          500 17px 'JetBrains Mono',
          monospace;
        letter-spacing: 0.04em;
        color: #a39e97;
      }
      #lnote {
        position: relative;
        z-index: 1;
        padding: 16px 24px;
      }
      #ltxt {
        margin-top: 8px;
        font-size: 31px;
        line-height: 1.3;
        font-weight: 500;
        word-break: break-word;
      }
      #ltxt .ct {
        font-size: 22px;
        line-height: 1.45;
        font-weight: 400;
      }
      .caret {
        display: inline-block;
        width: 3px;
        height: 32px;
        margin-inline-start: 2px;
        vertical-align: -5px;
        background: #ff671a;
        animation: blink calc(1.1s * var(--slow, 1)) steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      #lseal {
        inset: 0;
        z-index: 0;
        background: #1e1b18;
        opacity: 0;
      }
      #lscreen .appbar {
        position: relative;
        z-index: 1;
      }
      #base {
        left: 35px;
        top: 498px;
        width: 530px;
        height: 22px;
        border-radius: 2px 2px 14px 14px;
        background: #d7cfc3;
      }
      #base::after {
        content: '';
        position: absolute;
        left: 225px;
        top: 0;
        width: 80px;
        height: 7px;
        border-radius: 0 0 7px 7px;
        background: #c4bbae;
      }

      /* server */
      #server {
        left: 690px;

      /* phone */
      #phone {

        background: #2f2d2a;
      }
      #pscreen {
        left: 9px;

        border-radius: 30px;
        overflow: hidden;
        background: #fff;
      }
      #island {
        left: 75px;
        top: 10px;
        width: 62px;
        height: 18px;
        border-radius: 9px;
        background: #2f2d2a;
      }
      #pnote {
        left: 0;
        right: 0;
        top: 48px;
        padding: 0 16px;
      }
      #pnote .crumb {
        font-size: 13px;
      }
      #pdate {
        margin-top: 4px;

      }
      .bone {

        border-radius: 7px;
        background: #f1ede6;
      }
      #ptxt {
        margin-top: 14px;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 500;
        word-break: break-word;
      }
      #ptxt .ct {
        font-size: 15px;
        line-height: 1.45;
        font-weight: 400;
      }

      /* keys */
      .key {
        height: 50px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 20px 0 14px;
        border-radius: 25px;
        background: #ff671a;
        color: #fff;
        font-size: 25px;
        font-weight: 700;
        box-shadow: 0 10px 22px -8px rgba(255, 103, 26, 0.6);
        transform-origin: 50% 50%;
      }
      .key svg {
        width: 27px;
        height: 27px;
      }
      #nokey {
        background: #fff;
        color: #8a8279;
        border: 2.5px solid #e2dad0;
        box-shadow: 0 10px 22px -12px rgba(70, 45, 20, 0.35);
        opacity: 0;
      }
      .tag {
        padding: 7px 15px;
        border-radius: 10px;
        font:
          600 21px 'JetBrains Mono',
          monospace;
        letter-spacing: 0.01em;
        white-space: nowrap;
        opacity: 0;
      }
      #algo {
        left: 86px;
        top: 174px;
        background: #ffe9dc;
        color: #c4561d;
      }
      #stays {
        left: 446px;
        top: 160px;
        padding: 6px 4px;
        color: #c4561d;
      }

      /* the sealed box */
      .box {
        left: 0;
        top: 0;
        width: 150px;
        height: 108px;
        border-radius: 16px;
        background: #1e1b18;
        border: 2px solid #3a352f;
        box-shadow: 0 16px 30px -14px rgba(30, 20, 10, 0.55);
        transform-origin: 75px 54px;
      }
      .box .ct {
        display: block;
        height: 100%;
        overflow: hidden;
        padding: 30px 12px 0;
        font-size: 14px;
        line-height: 1.3;
      }
      .lock {
        position: absolute;
        left: 49px;
        top: -34px;
        width: 52px;
        height: 60px;
        overflow: visible;
      }
      .shackle {
        transform-box: view-box;
        transform-origin: 38px 28px;
      }
      #biglock {
        left: 424px;
        top: 392px;
        width: 52px;
        height: 60px;
        opacity: 0;
        overflow: visible;
      }
      .coin {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ff671a;
        color: #fff;
        box-shadow: 0 8px 18px -6px rgba(255, 103, 26, 0.7);
      }
      .coin svg {
        width: 30px;
        height: 30px;
      }
      #ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #ff671a;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage">

        <div id="pscreen" class="a">

        <rect x="23.6" y="40" width="4.8" height="10" rx="2.4" fill="#1e1b18" />

      <template id="boxT">
        <div class="a box">
          <span class="ct"></span>
          <svg class="lock" viewBox="0 0 52 60">
            <path
              class="shackle"
              d="M14 28 V18 a12 12 0 0 1 24 0 V28"
              fill="none"

    <script>
      window.SLOW = 1
      const $ = (id) => document.getElementById(id)
      const now = () => performance.now() / 1000 / window.SLOW
      const clamp = (k) => Math.min(1, Math.max(0, k))
      const lerp = (a, b, k) => a + (b - a) * k
      const E = {
        linear: (k) => k,
        inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
        out: (k) => 1 - Math.pow(1 - k, 3),
        back: (k) => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2)
      }
      /** Runs fn(easedK, k) every frame for `dur` film seconds; resolves when done. */
      function tween(dur, fn, ease = E.inOut) {
        return new Promise((done) => {
          const t0 = now()
          const tick = () => {
            const k = clamp((now() - t0) / dur)
            fn(ease(k), k)
            if (k < 1) requestAnimationFrame(tick)
            else done()
          }
          tick()
        })
      }
      const wait = (s) => new Promise((r) => setTimeout(r, s * 1000 * window.SLOW))
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
      const noise = (n) => Array.from({ length: n }, () => B64[(Math.random() * 64) | 0]).join('')

      // Left to right, plaintext gives way to ciphertext (or back); the seam flickers.
      function scramble(el, plain, cipher, dur, toCipher) {
        return tween(
          dur,
          (k) => {
            if (toCipher) {
              const n = Math.round(k * cipher.length)
              const seam = k < 1 ? noise(2) : ''
              el.innerHTML = `<span class="ct">${esc(cipher.slice(0, n) + seam)}</span>${esc(plain.slice(n + seam.length))}`
            } else {
              const m = Math.round(k * plain.length)
              const rest = Math.round((1 - k) * cipher.length)
              el.innerHTML = `${esc(plain.slice(0, m))}<span class="ct">${esc(cipher.slice(cipher.length - rest))}</span>`
            }
          },
          E.linear
        )
      }
      function makeBox(cipher) {
        const box = $('boxT').content.firstElementChild.cloneNode(true)
        box.querySelector('.ct').textContent = cipher
        $('stage').append(box)
        return box
      }
      // A box is placed by its centre.
      const place = (box, x, y, s = 1, r = 0) =>
        (box.style.transform = `translate(${x - 75}px,${y - 54}px) rotate(${r}deg) scale(${s})`)
      function pulse(el, dur = 0.6, amount = 0.12) {
        return tween(
          dur,
          (k) => (el.style.transform = `scale(${1 + amount * Math.sin(Math.PI * k)})`),
          E.linear
        )
      }
      function ring(x, y, dur = 0.8) {
        const r = $('ring')
        return tween(
          dur,
          (k) => {
            const d = 40 + 220 * k
            Object.assign(r.style, {
              left: `${x - d / 2}px`,
              top: `${y - d / 2}px`,
              width: `${d}px`,
              height: `${d}px`,
              opacity: 0.7 * (1 - k)
            })
          },
          E.out
        )
      }
      const fade = (el, to, dur = 0.3) => {
        const from = Number(getComputedStyle(el).opacity)
        return tween(dur, (k) => (el.style.opacity = lerp(from, to, k)))
      }
      const pop = (el, dur = 0.35) =>
        tween(
          dur,
          (k, raw) => {
            el.style.opacity = clamp(raw * 2.5)
            el.style.transform = `scale(${lerp(0.5, 1, k)})`
          },
          E.back
        )

      const SLOT = { x: 845, y: 466, s: 0.56 } // the tray's free slot, in stage px
      // Stage px to page px: the content (x 35..1382, y 92..585) scaled 1.12 and centred above the
      // caption band.
      const S = 1.12
      const X = 800 - S * 708.5
      const Y = 372 - S * 338.5
      document.getElementById('stage').style.transform = `translate(${X}px,${Y}px) scale(${S})`
      const FOCUS = { laptop: [300, 368], server: [800, 372], phone: [1225, 310] }
      const LAPTOP = { x: 300, y: 365 }
      const PHONE = { x: 1225, y: 322 }
      let text = ''
      let cipher = ''
      let stored = null

      window.e2e = {
        /** Page px of a station's centre, for the camera. */
        focus: (name) => [X + S * FOCUS[name][0], Y + S * FOCUS[name][1]],
        /** The line Maya types, its ciphertext, and three other sealed items already on the server. */
        init(line, sealed, others) {
          document.documentElement.style.setProperty('--slow', window.SLOW)
          text = line
          cipher = sealed
          others.forEach((c, i) => {
            const b = makeBox(c)
            place(b, 705 + [50, 140, 50][i], 360 + [39, 39, 106][i], SLOT.s)
            b.style.opacity = 0.9
          })
        },
        async type(cps) {
          const out = $('ltyped')
          for (const ch of text) {
            out.textContent += ch
            await wait((1 / cps) * (0.6 + Math.random() * 0.8) + (ch === ' ' ? 0.04 : 0))
          }
        },
        /** The line becomes ciphertext on the laptop and a lock closes on it. */
        async seal() {
          const caret = document.querySelector('.caret')
          caret.style.display = 'none'
          pulse($('lkey'), 0.6, 0.14)
          fade($('lseal'), 0.94, 0.45)
          document.querySelector('#lscreen .appbar').style.opacity = 0.15
          await scramble($('ltyped'), text, cipher, 0.75, true)
          // A big lock drops onto the middle of the screen and its shackle snaps shut.
          const lock = $('biglock')
          const shackle = lock.querySelector('.shackle')
          shackle.style.transform = 'translateY(-12px)'
          await tween(
            0.3,
            (k, raw) => {
              lock.style.transform = `scale(${lerp(2.3, 1.65, k)})`
              lock.style.opacity = clamp(raw * 3)
            },
            E.back
          )
          await tween(
            0.22,
            (k) => (shackle.style.transform = `translateY(${lerp(-12, 0, k)}px)`),
            E.back
          )
          ring(450, 422)
          await wait(0.15)
          await pop($('algo'))
        },
        /** The sealed copy leaves for the server; the laptop keeps the plaintext and the key. */
        async send() {
          const box = makeBox(cipher)
          box.style.opacity = 0
          box.style.zIndex = 5
          place(box, LAPTOP.x, LAPTOP.y, 1.5)
          fade($('stays'), 1, 0.3)
          // The sealed screen turns back into Maya's plaintext note as the box lifts off it.
          const lock = $('biglock')
          await tween(0.4, (k) => {
            box.style.opacity = k
            lock.style.opacity = 1 - k
            $('lseal').style.opacity = 0.94 * (1 - k)
          })
          $('ltyped').textContent = text
          document.querySelector('#lscreen .appbar').style.opacity = 1
          await tween(1.45, (k) => {
            const x = lerp(LAPTOP.x, SLOT.x, k)
            const y = lerp(LAPTOP.y, SLOT.y, k) - 70 * Math.sin(Math.PI * k)
            place(box, x, y, lerp(1.5, SLOT.s, Math.min(1, k * 1.1)))
            $('trailA').style.strokeDashoffset = 141 * (1 - clamp((x - 537) / 141))
          })
          box.style.zIndex = ''
          stored = box
          ring(SLOT.x, SLOT.y, 0.7)
          const led = document.querySelector('.unit i')
          led.style.background = '#ff671a'
          await wait(0.3)
          led.style.background = ''
        },
        /** The server holds the box and has no key for it. */
        async noKey() {
          await pop($('nokey'), 0.4)
          await tween(
            0.7,
            (k) => place(stored, SLOT.x, SLOT.y, SLOT.s, 7 * Math.sin(k * Math.PI * 4) * (1 - k)),
            E.linear
          )
        },
        /** A copy of the stored box goes to the phone. */
        async deliver() {
          const box = makeBox(cipher)
          box.style.zIndex = 5
          box.id = 'pbox'
          place(box, SLOT.x, SLOT.y, SLOT.s)
          fade($('pbones'), 0, 0.5)
          await tween(1.4, (k) => {
            const x = lerp(SLOT.x, PHONE.x, k)
            const y = lerp(SLOT.y, PHONE.y, k) - 80 * Math.sin(Math.PI * k)
            place(box, x, y, lerp(SLOT.s, 1.1, k))
            $('trailB').style.strokeDashoffset = 180 * (1 - clamp((x - 922) / 180))
          })
          ring(PHONE.x, PHONE.y, 0.6)
        },
        /** The phone's key opens the lock, and the line reads as plaintext again. */
        async unlock() {
          const box = $('pbox')
          $('pbones').style.display = 'none' // faded out on delivery; the text takes their place
          // A key leaves the phone's key pill and turns in the box's keyhole (the lock's centre
          // sits 58 px above the box's centre, the keyhole 9 px below the lock's, both scaled).
          const coin = document.createElement('div')
          coin.className = 'a coin'
          coin.innerHTML = $('pkey').querySelector('svg').outerHTML
          coin.style.zIndex = 6
          $('stage').append(coin)
          const from = { x: 1276 + 14 + 13.5, y: 92 + 25 }
          const hole = { x: PHONE.x, y: PHONE.y + (-58 + 9) * 1.1 }
          const at = (x, y, r = 0) =>
            (coin.style.transform = `translate(${x - 27}px,${y - 27}px) rotate(${r}deg)`)
          await tween(0.55, (k) =>
            at(lerp(from.x, hole.x, k), lerp(from.y, hole.y, k) - 30 * Math.sin(Math.PI * k))
          )
          await tween(0.25, (k) => at(hole.x, hole.y, 90 * k), E.out)
          const shackle = box.querySelector('.shackle')
          await tween(
            0.3,
            (k) => (shackle.style.transform = `translateY(${-14 * k}px) rotate(${-28 * k}deg)`),
            E.back
          )
          ring(PHONE.x, PHONE.y - 40, 0.6)
          const out = $('ptxt')
          out.innerHTML = `<span class="ct">${esc(cipher)}</span>`
          fade(coin, 0, 0.3)
          await tween(0.4, (k) => {
            box.style.opacity = 1 - k
            place(box, PHONE.x, PHONE.y, lerp(1.1, 1.3, k))
          })
          box.remove()
          coin.remove()
          await scramble(out, text, cipher, 0.7, false)
        }
      }
    </script>
  </body>
</html>
