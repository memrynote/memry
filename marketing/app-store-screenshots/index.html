<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>memrynote · App Store screenshots</title>
    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url(../explainer-30s/fonts/dm-sans-opsz-normal.woff2) format('woff2');
        font-weight: 100 1000;
        font-style: normal;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url(../explainer-30s/fonts/dm-sans-opsz-italic.woff2) format('woff2');
        font-weight: 100 1000;
        font-style: italic;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url(../explainer-30s/fonts/space-grotesk.woff2) format('woff2');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Crimson Pro';
        src: url(../explainer-30s/fonts/crimson-pro-normal.woff2) format('woff2');
        font-weight: 200 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Crimson Pro';
        src: url(../explainer-30s/fonts/crimson-pro-italic.woff2) format('woff2');
        font-weight: 200 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url(../explainer-30s/fonts/jetbrains-mono.woff2) format('woff2');
        font-weight: 100 800;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        width: 7920px;
        height: 2868px;
        overflow: hidden;
        background: #fbf9f5;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        position: absolute;
        top: 0;
        width: 1320px;
        height: 2868px;
        overflow: visible;
      }
      .bgp {
        position: absolute;
        top: 0;
        height: 2868px;
        width: 1320px;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(31, 41, 55, 0.085) 1.6px, transparent 1.7px);
        background-size: 44px 44px;
        background-position: 22px 22px;
      }
      .dark .dots {
        background-image: radial-gradient(rgba(255, 240, 225, 0.07) 1.6px, transparent 1.7px);
      }
      .warm {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      /* ---------- copy ---------- */
      .copy {
        position: absolute;
        left: 110px;
        top: 170px;
        width: 1100px;
        z-index: 6;
      }
      .lbl {
        font:
          500 34px 'JetBrains Mono',
          monospace;
        letter-spacing: 0.16em;
        color: #e8590c;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .lbl i {
        font-style: normal;
        color: #c9bfb2;
      }
      .h {
        font-weight: 600;
        letter-spacing: -0.043em;
        line-height: 0.97;
        font-size: 150px;
        color: #1f2937;
        margin-top: 34px;
      }
      .h em {
        font-style: italic;
        color: #ff671a;
        letter-spacing: -0.055em;
        padding-inline-end: 0.02em;
      }
      .sub {
        font-size: 48px;
        line-height: 1.28;
        color: #6b6560;
        margin-top: 38px;
        letter-spacing: -0.012em;
        font-weight: 420;
      }
      .dark .h {
        color: #f6f1ea;
      }
      .dark .sub {
        color: #a8a099;
      }
      .dark .lbl {
        color: #ff7a33;
      }
      .dark .lbl i {
        color: #4a433d;
      }
      .stop {
        display: inline-block;
        width: 0.2em;
        height: 0.2em;
        border-radius: 50%;
        background: #ff671a;
        margin-inline-start: 0.03em;
        vertical-align: baseline;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .lockup svg {
        display: block;
      }

      /* ---------- thread ---------- */
      #thread,
      #nodes {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      #thread {
        z-index: 1;
      }
      #nodes {
        z-index: 5;
      }

      /* ---------- phone ---------- */
      .phone {
        position: absolute;
        z-index: 2;
        border-radius: 15.2%/7.2%;
        background: linear-gradient(
          145deg,
          #56534f 0%,
          #2b2927 18%,
          #1b1a19 50%,
          #2e2c2a 82%,
          #5a5752 100%
        );
        box-shadow:
          0 120px 160px -70px rgba(60, 38, 18, 0.55),
          0 40px 70px -30px rgba(60, 38, 18, 0.35),
          inset 0 0 0 2px rgba(255, 255, 255, 0.14),
          inset 0 0 0 5px #0d0c0c;
      }
      .dark .phone {
        box-shadow:
          0 120px 180px -60px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 0 140px -20px rgba(255, 103, 26, 0.22),
          inset 0 0 0 2px rgba(255, 255, 255, 0.16),
          inset 0 0 0 5px #0d0c0c;
      }
      .phone .btn {
        position: absolute;
        width: 7px;
        background: linear-gradient(90deg, #3a3835, #6a6660);
        border-radius: 3px;
      }
      .screen {
        position: absolute;
        width: 440px;
        height: 956px;
        overflow: hidden;
        border-radius: 62px;
        background: #fff;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        color: #1c1b19;
        letter-spacing: -0.01em;
      }
      .screen.dk {
        background: #0f0f0f;
        color: #e9e6e1;
      }
      .island {
        position: absolute;
        left: 157px;
        top: 11px;
        width: 126px;
        height: 37px;
        border-radius: 19px;
        background: #000;
        z-index: 30;
      }
      .sbar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 54px;
        z-index: 29;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 34px 0 52px;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .sbar .r {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dk .sbar {
        color: #fff;
      }

      .nav {
        position: absolute;
        top: 62px;
        left: 16px;
        right: 16px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 20;
      }
      .gb {
        height: 44px;
        min-width: 44px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow:
          0 2px 14px rgba(0, 0, 0, 0.08),
          inset 0 0 0 0.5px rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 0 13px;
        color: #1c1b19;
      }
      .dk .gb {
        background: rgba(40, 40, 40, 0.85);
        color: #edeae6;
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
      }
      .gb svg {
        width: 21px;
        height: 21px;
      }
      .ic {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tabbar {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 24px;
        height: 64px;
        border-radius: 32px;
        background: rgba(250, 250, 249, 0.86);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          inset 0 0 0 0.5px rgba(0, 0, 0, 0.07);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 6px;
        z-index: 25;
        backdrop-filter: blur(12px);
      }
      .dk .tabbar {
        background: rgba(32, 32, 32, 0.9);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
      }
      .tab {
        width: 74px;
        height: 54px;
        border-radius: 27px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 10px;
        font-weight: 600;
        color: #1c1b19;
      }
      .dk .tab {
        color: #e9e6e1;
      }
      .tab svg {
        width: 25px;
        height: 25px;
      }
      .tab.on {
        background: rgba(0, 0, 0, 0.055);
        color: #ea6a12;
      }
      .tab svg [stroke='#fff'] {
        stroke: #fafaf9;
      }
      .dk .tab svg [stroke='#fff'] {
        stroke: #202020;
      }
      .dk .tab.on {
        background: rgba(255, 255, 255, 0.09);
        color: #ff8a3d;
      }

      .ttl {
        font:
          700 33px/1.1 -apple-system,
          system-ui;
        letter-spacing: -0.025em;
      }
      .muted {
        color: #8a857e;
      }
      .dk .muted {
        color: #8c8781;
      }
      .sep {
        height: 0.5px;
        background: #e6e2dc;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
      }
      .rose {
        background: #f9e1e3;
        color: #9b3b47;
      }
      .sky {
        background: #e0ebf4;
        color: #2e5a78;
      }
      .sage {
        background: #e3ece1;
        color: #3e6a4c;
      }
      .lilac {
        background: #ece5f6;
        color: #5b4a8a;
      }
      .peach {
        background: #fde6d7;
        color: #a1461a;
      }
      .ghost {
        color: #b2ada6;
      }

      /* ---------- breakout cards ---------- */
      .cw {
        position: absolute;
        z-index: 4;
      }
      .card {
        position: relative;
        background: #fff;
        border-radius: 20px;
        box-shadow:
          0 60px 90px -40px rgba(70, 45, 20, 0.45),
          0 10px 30px -8px rgba(70, 45, 20, 0.12),
          0 0 0 1.5px rgba(70, 45, 20, 0.07);
        font-family: -apple-system, system-ui, sans-serif;
        color: #1c1b19;
        letter-spacing: -0.01em;
      }
      .dark .card {
        background: #1f1e1c;
        color: #efeae4;
        box-shadow:
          0 60px 90px -40px rgba(0, 0, 0, 0.9),
          0 0 0 1.5px rgba(255, 255, 255, 0.08);
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.28;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bgs"></div>
      <svg id="thread" width="7920" height="2868"></svg>
      <div id="panels"></div>
      <svg id="nodes" width="7920" height="2868"></svg>
      <svg id="grain" width="7920" height="2868">
        <filter id="gn">
          <feTurbulence
            type="fractalNoise"
            baseFrequency=".9"
            numOctaves="2"
            stitchTiles="stitch"
          />
          <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#gn)" />
      </svg>
    </div>
    <script src="icons.js"></script>
    <script src="../explainer-30s/brand.js"></script>
    <script>
      'use strict'
      const PW = 1320,
        PH = 2868,
        BR = '#FF671A'
      const I = (n, s = 20, extra = '') =>
        `<svg class="ic" viewBox="0 0 24 24" style="width:${s}px;height:${s}px;${extra}">${ICONS[n]}</svg>`

      // ---------- shared iOS pieces ----------
      const statusBar = (
        dark
      ) => `<div class="island"></div><div class="sbar"><span>9:41</span><span class="r">
  <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3z"/><path d="M8.5 5.7c1.5 0 2.9.6 4 1.5l1.2-1.2C12.3 4.7 10.5 4 8.5 4S4.7 4.7 3.3 6l1.2 1.2c1.1-.9 2.5-1.5 4-1.5z"/><path d="M8.5 9 11 6.9c-.7-.5-1.6-.9-2.5-.9s-1.8.4-2.5.9z" transform="translate(0 2.6)"/></svg>
  <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.3" y="2.3" width="20.4" height="8.4" rx="2.4" fill="currentColor"/><path d="M26 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
</span></div>`

      const TABICON = {
        notes:
          '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 2h7.2c.5 0 1 .2 1.4.6l4.8 4.8c.4.4.6.9.6 1.4V20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M8.6 12.5h7M8.6 16h7M8.6 9h3.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
        home: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M11.1 2.6a1.4 1.4 0 0 1 1.8 0l8.2 7a1 1 0 0 1-.7 1.8H19v8.3c0 .9-.7 1.6-1.6 1.6h-3.2v-5.6c0-.6-.4-1-1-1h-2.4c-.6 0-1 .4-1 1v5.6H6.6c-.9 0-1.6-.7-1.6-1.6v-8.3H3.6a1 1 0 0 1-.7-1.8z"/></svg>',
        tasks:
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.6 12.2 3 3 5.8-6.2" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        journal:
          '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 5.2c0-.6.4-1.1 1-1.2 3.1-.5 5.9.1 8.2 1.8V21c-2.3-1.6-5-2.1-8.2-1.6a.9.9 0 0 1-1-.9zM22 5.2c0-.6-.4-1.1-1-1.2-3.1-.5-5.9.1-8.2 1.8V21c2.3-1.6 5-2.1 8.2-1.6.5.1 1-.3 1-.9z"/></svg>',
        more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>'
      }
      const tabBar = (on) =>
        `<div class="tabbar">${[
          ['notes', 'Notes'],
          ['home', 'Home'],
          ['tasks', 'Tasks'],
          ['journal', 'Journal'],
          ['more', 'More']
        ]
          .map(
            ([k, l]) =>
              `<div class="tab ${k === on ? 'on' : ''}">${TABICON[k]}<span>${l}</span></div>`
          )
          .join('')}</div>`

      // phone at (x,y) body width w, rotation r deg. content = inner screen html
      function phone(x, y, w, content, { dark = false, rot = 0, id = '' } = {}) {
        const bez = Math.round(w * 0.024),
          sw = w - bez * 2,
          k = sw / 440,
          h = Math.round(956 * k + bez * 2)
        return `<div class="phone" ${id ? `id="${id}"` : ''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
    <div class="btn" style="left:-5px;top:${h * 0.2}px;height:${h * 0.045}px"></div>
    <div class="btn" style="left:-5px;top:${h * 0.28}px;height:${h * 0.075}px"></div>
    <div class="btn" style="left:-5px;top:${h * 0.37}px;height:${h * 0.075}px"></div>
    <div class="btn" style="right:-5px;top:${h * 0.3}px;height:${h * 0.11}px"></div>
    <div class="screen ${dark ? 'dk' : ''}" style="left:${bez}px;top:${bez}px;zoom:${k}">${statusBar(dark)}${content}</div>
  </div>`
      }

      // ---------- illustrations ----------
      const azulejo = (
        id,
        w,
        h,
        r = 12
      ) => `<svg width="${w}" height="${h}" style="display:block;border-radius:${r}px">
  <defs><pattern id="${id}" width="56" height="56" patternUnits="userSpaceOnUse">
    <rect width="56" height="56" fill="#F7F4EC"/>
    <path d="M28 6c4 7 4 15 0 22-4-7-4-15 0-22zM28 50c-4-7-4-15 0-22 4 7 4 15 0 22zM6 28c7-4 15-4 22 0-7 4-15 4-22 0zM50 28c-7 4-15 4-22 0 7-4 15-4 22 0z" fill="#2F5596"/>
    <circle cx="28" cy="28" r="4.5" fill="#E9A23B"/><circle cx="28" cy="28" r="1.8" fill="#F7F4EC"/>
    <path d="M0 0h10q-2 8-10 10zM56 0H46q2 8 10 10zM0 56h10q-2-8-10-10zM56 56H46q2-8 10-10z" fill="#2F5596"/>
    <path d="M13 13l4 4M43 13l-4 4M13 43l4-4M43 43l-4-4" stroke="#6E8FC7" stroke-width="2.4" stroke-linecap="round"/>
    <rect x=".5" y=".5" width="55" height="55" fill="none" stroke="#D9D2C2" stroke-width="1"/>
  </pattern></defs><rect width="100%" height="100%" fill="url(#${id})"/></svg>`

      const sunset = (
        id,
        w,
        h,
        r = 12
      ) => `<svg width="${w}" height="${h}" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" style="display:block;border-radius:${r}px">
  <defs>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E2A5C"/><stop offset=".38" stop-color="#C4506A"/><stop offset=".7" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFC36E"/></linearGradient>
    <radialGradient id="${id}g" cx=".62" cy=".72" r=".45"><stop offset="0" stop-color="#FFE3A3" stop-opacity=".9"/><stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#${id}s)"/><rect width="400" height="240" fill="url(#${id}g)"/>
  <circle cx="248" cy="168" r="26" fill="#FFE8B0"/>
  <path d="M0 176h400v64H0z" fill="#E7824A" opacity=".55"/>
  <path d="M0 190l30-6 20 4 18-10 22 6 16-8 24 10 20-4 26 8 18-12 30 10 26-6 24 8 22-10 26 8 30-4 28 8 30-6v72H0z" fill="#4A2A3F"/>
  <g fill="#3A2033"><rect x="36" y="172" width="18" height="22"/><rect x="58" y="164" width="14" height="30"/><path d="M58 164l7-8 7 8z"/><rect x="92" y="176" width="22" height="20"/><rect x="300" y="170" width="16" height="26"/><rect x="320" y="160" width="12" height="36"/><path d="M320 160l6-10 6 10z"/><rect x="346" y="174" width="24" height="22"/><rect x="150" y="180" width="30" height="16"/><rect x="186" y="170" width="10" height="26"/><path d="M184 170l7-14 7 14z"/></g>
  <g fill="#FFD27A" opacity=".85"><rect x="40" y="178" width="3" height="4"/><rect x="47" y="184" width="3" height="4"/><rect x="96" y="182" width="3" height="4"/><rect x="104" y="186" width="3" height="4"/><rect x="350" y="180" width="3" height="4"/><rect x="360" y="186" width="3" height="4"/><rect x="304" y="176" width="3" height="4"/></g>
  <path d="M0 214l40-4 40 6 50-8 40 6 50-6 40 8 50-6 40 4 50-6v36H0z" fill="#2B1726"/>
  <g transform="translate(212 196)"><rect x="0" y="0" width="54" height="22" rx="4" fill="#F4C430"/><rect x="0" y="14" width="54" height="8" fill="#D9A21E"/><g fill="#5A3A1A" opacity=".75"><rect x="5" y="4" width="8" height="7" rx="1"/><rect x="16" y="4" width="8" height="7" rx="1"/><rect x="27" y="4" width="8" height="7" rx="1"/><rect x="38" y="4" width="8" height="7" rx="1"/></g><path d="M27 0l-6-10M21-10h12" stroke="#2B1726" stroke-width="1.6"/></g>
</svg>`

      const wave = (n, h, color, seed = 3, done = 1) => {
        let s = seed,
          o = ''
        for (let i = 0; i < n; i++) {
          s = (s * 9301 + 49297) % 233280
          const v = 0.25 + 0.75 * Math.abs(Math.sin(i * 0.55 + seed)) * (0.55 + (0.45 * s) / 233280)
          o += `<i style="display:block;width:3px;border-radius:2px;height:${Math.max(3, v * h)}px;background:${color};opacity:${i / n < done ? 1 : 0.28}"></i>`
        }
        return `<div style="display:flex;align-items:center;gap:2.5px;height:${h}px">${o}</div>`
      }

      const markSvg = (size, col = BR) =>
