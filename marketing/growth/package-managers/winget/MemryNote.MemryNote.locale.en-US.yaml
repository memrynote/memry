Description: |-
  MemryNote is a desktop app for notes, tasks, a daily journal and a calendar.
  Your vault is a folder of Markdown files on your own disk, so any editor can open it.
  The app works offline and needs no account.
  Sync between devices is optional and paid, and every change is encrypted on your device before upload.
  The apps are open source under AGPL-3.0.
