# SwiftLint for the iOS shell (spec 002, Constitution II).
# `swiftlint --strict` is a gate: every warning fails the build.

included:
  - Memry
  - MemryTests
  - MemryConformanceTests
  - MemryUITests

excluded:
  - Memry/Generated

opt_in_rules:
  - empty_count
  - force_unwrapping
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo

# `master key` is the protocol's own term, not an incidental one: chapter 01
# §1.1 names it, the Rust seam exports `SecureStoreKey::MasterKey`, and
# `packages/contracts` ships `KEYCHAIN_ENTRIES.MASTER_KEY`. data-model §B
# requires the five entries keep those names "so a future tool can read a
# desktop and a phone with the same vocabulary" — so renaming in Swift alone
# would break a stated cross-platform invariant to satisfy a lint. The rule
# stays on for every other term it covers.
inclusive_language:
  override_allowed_terms:
    - master

# The committed vector fixtures nest `Input` and `Expected` inside their `Case`,
# which mirrors the JSON in `packages/contracts/test-vectors/` one-for-one. That
# shape is the point — it is what makes a fixture readable against the file it
# pins — so the conformance tier gets one extra level rather than a flatter
# model that no longer matches the bytes.
nesting:
  type_level: 2

# The shell logs through OSLog `Logger`, never `print`. This rule makes it
# visible in the editor; there is currently no CI grep backing it up.
# The test targets relax force_unwrapping / force_try through their own nested
# .swiftlint.yml: a nil there fails the test, it does not crash a user's app.
custom_rules:
  no_print:
    name: 'print() is not a logger'
    regex: '(^|[^A-Za-z0-9_.])print\('
    message: 'Use an OSLog Logger for the subsystem, not print().'
    severity: error

  # spec-defect 131. Two suites wrote data-model §B's five production keychain
  # identities at the same time, because Swift Testing runs sibling suites in
  # parallel and `.serialized` orders only a suite's own tests. Neither suite
  # could move off those identities without ceasing to be evidence, so both are
  # now nested inside `RealKeychainSuite` (MemryTests/RealKeychain.swift), whose
  # `.serialized` sub-suites inherit. This rule is what stops a third suite from
  # silently racing them: a test file that drives `SecItem*` for real has to be
  # added here, which means reading why.
  real_keychain_must_be_serialized:
    name: 'the real keychain is one suite at a time'
    regex: '(SecItemAdd|SecItemDelete|SecItemUpdate|SecItemCopyMatching|SystemKeychainItemStore)'
    match_kinds:
      - identifier
    included: '.*Tests/.*\.swift'
    excluded: '.*(KeychainTests|SignOutWipeTests)\.swift'
    message: >
      A test that drives the real keychain must be a @Suite nested inside
      RealKeychainSuite -- read MemryTests/RealKeychain.swift -- and then be
      added to this rule's excluded list.
    severity: error

force_cast:
  severity: error

force_try:
  severity: error

# The plan's per-directory ceilings live in scripts/check-line-ceilings.mjs,
# which is the gate. These warn earlier, in the editor.
file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  excluded:
    - id
    - db
    - to
