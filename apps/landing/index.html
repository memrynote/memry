    <!-- DM Sans is the body face on every page, and the @font-face that declares it
         lives inside the bundled stylesheet — so without this the request cannot start
         until that CSS has parsed. Self-hosted (see src/index.css); the Google Fonts
         stylesheet this replaced was render-blocking and cost ~900ms. JetBrains Mono is
         deliberately not preloaded: it is only used on code and terminal surfaces. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />

    <!-- scripts/prerender.ts drops the first render's image preloads here, ahead of the
         module scripts Vite appends below. -->
    <!--image-preloads-->
    <!--boot-modulepreloads-->
