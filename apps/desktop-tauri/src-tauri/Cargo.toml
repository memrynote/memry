[package]
name = "memry-tauri"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
workspace = "../../../crates"
description = "MemryNote desktop shell on Tauri v2"
default-run = "memry-tauri"

[lib]
name = "memry_tauri"

[[bin]]
name = "memry-tauri"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[features]
# The WDIO driver plugins and the `e2e_*` test commands. Never part of a release build.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio", "dep:arboard"]
# Step 07 (#3524): rehearsal-only Velopack probe. Step 38 (#3555) replaces it with the real updater.
update-probe = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
memry-desktop = { path = "../../../crates/memry-desktop" }
tauri = { version = "2.12", features = ["specta", "devtools", "tray-icon", "image-png"] }
# tauri-specta rc.26 requires exactly these versions.
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
serde = { workspace = true }
serde_json = { workspace = true }
# The OS language of a first launch (`locale::resolve_startup`).
sys-locale = "0.3.2"
uuid = { workspace = true }
# Parses navigation targets for the guard and the permission origins.
url = "2"
# The telemetry flush, marker and heartbeat timers run on Tauri's tokio runtime; `signal` is
# SIGINT and SIGTERM.
tokio = { workspace = true, features = ["time", "signal", "sync"] }
tracing = { workspace = true }
velopack = { workspace = true }
# Native dialogs and "show in folder", reached only through `shell/dialogs.rs` and `vault_reveal`.
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
# The second launch hands its arguments to the deep-link plugin (`deep-link` feature); no
# `semver` feature, so two versions never run side by side.
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-notification = "2.7.0"
# Rust-only use: the page registers no shortcut itself, so no capability grants the plugin.
tauri-plugin-global-shortcut = "2.4.1"
# `fonts.rs`: the installed families. Linux builds need libfontconfig1-dev.
font-kit = "0.14.3"
# The Paste and Match Style menu item reads the clipboard text.
tauri-plugin-clipboard-manager = "2.5.0"
# `ring` only: the shared HTTP client and every later tungstenite client avoid aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Native crashes leave a minidump: the app attaches `crash-handler` and an out-of-process
# `minidumper` server (the same binary run with `--crash-monitor`) writes the file.
crash-handler = "0.8.1"
minidumper = "0.11.0"

tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
arboard = { version = "3.7.0", optional = true, default-features = false }

# Caption hit testing (`windows/win32_caption.rs`) and the WebView2 accelerator keys.
[target.'cfg(windows)'.dependencies]
# Run-key cleanup of the Electron login item (`autostart/`).
winreg = "0.56"
arc-swap = "1.9"
webview2-com = "0.39"
# `guards/gpu.rs` reads `ProcessFailed` through these; same versions as wry.
windows-core = "0.62.2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# macOS registers through `SMAppService` (`autostart/mac.rs`), so the plugin is not linked there.
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
# `power/linux.rs` listens to logind's `PrepareForSleep` and `PrepareForShutdown`. Same build as
# memry-desktop's, so one zbus is compiled.
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# `spell/linux.rs` loads Enchant at run time, so the app starts on machines without it.
libloading = "0.9.0"
# `guards/gpu.rs` reports `web-process-terminated`. Same version as wry. `v2_40` (already on
# through tauri's `linux-body`): `shell/navigation_guard/linux.rs` reads `is_main_frame_main_resource`.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption` by field; 0.21.2 added fields, so it fails
# to compile there. Drop the pin when the plugin moves to `..Default::default()`.
rust-ini = "=0.21.1"

[target.'cfg(target_os = "macos")'.dependencies]
# `shutdown/mac_quit.rs` answers `applicationShouldTerminate:`, which tao does not implement.
# `windows/nav_input.rs` reads the trackpad swipe events.
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSWorkspace", "NSSpellChecker", "block2", "objc2-core-foundation"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSString", "NSRange", "NSArray", "NSURL", "NSURLRequest"] }
# `shell/navigation_guard/macos.rs` decides the main frame from the navigation action's target
# frame. Same version and features as wry's.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKNavigationAction", "WKFrameInfo", "WKNavigationDelegate"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["specta", "test"] }
tempfile = "3"
