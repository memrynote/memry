extends: file:config/electron-builder.local-mac.yml
beforeBuild: ./scripts/before-build-external-node-modules.cjs
npmRebuild: true
dmg:
  size: 3g
# node_modules is packed into app.asar by the base config (natives unpacked via
# asarUnpack), not copied loose here — this is what cuts Squirrel's per-file
# install verification from ~2min to seconds. app-config is inherited from
# local-mac.yml's extraResources.
