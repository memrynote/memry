extends: file:config/electron-builder.local-mac.yml
beforeBuild: ./scripts/before-build-external-node-modules.cjs
npmRebuild: true
dmg:
  size: 3g
extraResources:
  - from: app-config
    to: app-config
  - from: node_modules
    to: node_modules
    filter:
      - '**/*'
      - '.pnpm'
      - '.pnpm/**/*'
      - '.modules.yaml'
      - '!**/*.map'
      - '!**/{coverage,doc,docs,example,examples,test,tests,__tests__}/**'
      # @tabler/icons ships ~11k raw SVG files (a transitive dep of @tabler/icons-react)
      # that is never imported at runtime — @tabler/icons-react bundles its own inline
      # SVGs. It is ~21% of the bundle's file count, and macOS Squirrel code-sign verify
      # time on update is O(sealed file count). Keep @tabler/icons-react; drop the raw pkg.
      - '!**/@tabler/icons/**'
      - '!**/re2/vendor/**'
      - '!electron'
      - '!electron/**/*'
      - '!**/node_modules/electron'
      - '!**/node_modules/electron/**/*'
