appId: com.memrynote.memry
productName: MemryNote
protocols:
  - name: Memry
    schemes:
      - memry
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!coverage/**'
  - '!test-results/**'
  - '!.turbo/**'
  - '!tests/**'
  - '!src/*'
  - '!config/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.env'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!app-config'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.tsbuildinfo'
  # The renderer build emits hidden sourcemaps (electron.vite.config.ts) purely
  # so scripts/upload-sourcemaps.mjs can hand them to PostHog. They must never
  # reach app.asar: they are larger than the bundles themselves and ship our
  # source. The shipped JS carries no sourceMappingURL, so dropping them here
  # leaves nothing dangling.
  - '!out/**/*.map'
  - '!node_modules/**/*.map'
  - '!node_modules/**/{coverage,doc,docs,example,examples,test,tests,__tests__}/**'
asarUnpack:
  - resources/**
afterPack: scripts/prune-packaged-app.mjs
extraResources:
  # ponytail: shipped as app-config (no .env token) so Defender's .env credential
  # scan never locks the source. build-packaged-app.js stages
  # apps/desktop/.env.production -> app-config. Declare app-config ONLY here:
  # configs that `extends` this one must not re-add it, or electron-builder's
  # deepAssign concats the arrays (its Set dedup misses distinct {from,to}
  # objects) and copies app-config twice -> Windows EBUSY during packaging.
  - from: app-config
    to: app-config
win:
  executableName: Memrynote
  artifactName: ${productName}-${version}-win.${ext}
  target:
    - nsis
    - zip
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Assisted installer: users with a full C: drive need to pick another
  # install location. Auto-updates still install silently (/S), and existing
  # one-click installs keep their current location on update.
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  entitlementsInherit: config/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
linux:
  # electron-builder >=26.13 rejects executable names with unsafe path chars;
  # without an override Linux falls back to package.json name (@memry/desktop).
  # userData is unaffected (derives from app.name, not the binary name).
  executableName: memrynote
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
