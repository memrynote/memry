appId: com.memrynote.memry
productName: Memrynote
protocols:
  - name: Memry
    schemes:
      - memry
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!coverage/**'
  - '!test-results/**'
  - '!.turbo/**'
  - '!tests/**'
  - '!src/*'
  - '!config/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.env'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!app-config'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.tsbuildinfo'
  - '!node_modules/**/*.map'
  - '!node_modules/**/{coverage,doc,docs,example,examples,test,tests,__tests__}/**'
  # node_modules is now packed into app.asar; carry over the prune filters the
  # loose-copy config used so build artifacts and unused vendor source stay out
  # of the archive (smaller asar, fewer sealed files).
  - '!node_modules/**/*.{a,o}'
  - '!node_modules/**/re2/vendor/**'
  - '!node_modules/**/build/Release/obj.target/**'
  # Electron is a devDependency and must never be packed into the app; the
  # production deploy tree should not contain it, but guard against leakage.
  - '!node_modules/electron/**'
  - '!node_modules/**/node_modules/electron/**'
asarUnpack:
  - resources/**
  # Native modules load their .node / .dylib by absolute path (dlopen /
  # sqlite loadExtension), which cannot resolve inside the asar archive. Unpack
  # each native package whole so its JS __dirname and its companion binary stay
  # co-located under app.asar.unpacked (a bare '**/*.node' would leave dylibs
  # like libvips / libonnxruntime / vec0.dylib stranded inside the archive).
  - '**/*.node'
  - '**/node_modules/@img/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/keytar/**'
  - '**/node_modules/classic-level/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sqlite-vec*/**'
  - '**/node_modules/re2/**'
afterPack: scripts/prune-packaged-app.mjs
extraResources:
  # ponytail: shipped as app-config (no .env token) so Defender's .env credential
  # scan never locks the source. build-packaged-app.js stages
  # apps/desktop/.env.production -> app-config. Declare app-config ONLY here:
  # configs that `extends` this one must not re-add it, or electron-builder's
  # deepAssign concats the arrays (its Set dedup misses distinct {from,to}
  # objects) and copies app-config twice -> Windows EBUSY during packaging.
  - from: app-config
    to: app-config
win:
  executableName: Memrynote
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  entitlementsInherit: config/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
