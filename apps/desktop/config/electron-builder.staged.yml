extends: file:config/electron-builder.yml
beforeBuild: ./scripts/before-build-external-node-modules.cjs
npmRebuild: true
dmg:
  size: 3g
# app-config is declared once in the base config (config/electron-builder.yml).
# Re-declaring it here survives electron-builder's extends-merge as a DUPLICATE:
# deepAssign concats the extraResources arrays and its `new Set()` dedup compares
# object identity, so two distinct {from,to} objects both remain. electron-builder
# then copies app-config to the same destination twice concurrently — POSIX
# tolerates it, but Windows' file lock throws "EBUSY: resource busy or locked" and
# kills the release. Only add the staged-specific node_modules here.
extraResources:
  - from: node_modules
    to: node_modules
    filter:
      - '**/*'
      - '.pnpm'
      - '.pnpm/**/*'
      - '.modules.yaml'
      - '!**/*.map'
      - '!**/*.a'
      - '!**/*.o'
      - '!**/{coverage,doc,docs,example,examples,test,tests,__tests__}/**'
      # @tabler/icons ships ~11k raw SVG files (a transitive dep of @tabler/icons-react)
      # that is never imported at runtime — @tabler/icons-react bundles its own inline
      # SVGs. Dropping it shrinks the installer and code-sign verify time. Keep -react.
      - '!**/@tabler/icons/**'
      - '!**/re2/vendor/**'
      - '!**/build/Release/obj.target/**'
      - '!electron'
      - '!electron/**/*'
      - '!**/node_modules/electron'
      - '!**/node_modules/electron/**/*'
