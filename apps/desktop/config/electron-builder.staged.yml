extends: file:config/electron-builder.yml
beforeBuild: ./scripts/before-build-external-node-modules.cjs
npmRebuild: true
dmg:
  size: 3g
# node_modules is no longer copied loose as extraResources. The base config packs
# it into app.asar (natives unpacked via asarUnpack) so macOS Squirrel verifies a
# handful of sealed files at install time instead of ~40k loose ones. app-config
# is inherited from the base config's extraResources (declared once there).
