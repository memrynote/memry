# T066 — US2 offline matrix, RECONNECT half.
#
# Runs after the driver has restored the network. Split from the offline half
# on purpose: with the two in one file the network could only be restored after
# the flow exited, so the reconnect assertions ran offline and passed
# vacuously — a false green on the one gate the matrix exists to prove.
#
# The order of assertions below is the whole design:
#   1. the Offline banner is GONE, so the app agrees it is back on the network;
#   2. the driver reads the persisted outbox after this flow and waits for it to
#      reach zero, which says "your edits left this device" without a UI status.
appId: com.memry.mobile
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    notVisible:
      id: 'sync-banner-offline'
    timeout: 30000

# The notes list has no title of its own (board 26 starts at the tree), so the
# screen is identified by the one control only it carries.
- assertVisible: 'New note'

# The note is still here after reconnect, with its offline body intact. Scrolled
# to rather than asserted outright: the list is a tree and an unfoldered note is
# emitted after every folder. Read mode keeps the body in the hierarchy, so
# nothing here has to enter the editor. The driver separately checks the outbox
# depth because sync status is intentionally not rendered in the app.
- scrollUntilVisible:
    element:
      text: '.*Open note offline note ${RUN_ID}.*'
    direction: DOWN
    timeout: 20000
- tapOn: '.*Open note offline note ${RUN_ID}.*'
- assertVisible: '.*offline body ${RUN_ID}.*'
- tapOn:
    id: 'nav-back'
