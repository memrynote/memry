# T066 — US2 offline matrix: airplane-mode edit + create → force-quit →
# relaunch → reconnect → complete sync.
#
# This is the spec's own Independent Test for US2, written so a single run is
# meaningful and 20 runs are conclusive. The driver
# (`scripts/us2-offline-matrix.mjs`) repeats it and is the thing that reports
# 20/20; a hand-run of this file exercises one pass.
#
# The airplane-mode toggle is NOT scripted inside Maestro — neither the iOS
# simulator nor a real device exposes it to the accessibility tree. The driver
# owns it (`xcrun simctl status_bar ... --dataNetwork` plus the app's own dev
# network switch) and hands this flow an already-offline device; `OFFLINE`
# below is therefore an assertion about what the driver set up, not an action.
#
# Prereqs, same as the US1 smoke: a signed-in session and an unlocked vault.
# `-e RUN_ID=<n>` makes each pass write a distinguishable note title, which is
# what lets the reconnect assertion prove THIS run's edit arrived rather than a
# previous one's.
appId: com.memry.mobile
---
- launchApp:
    clearState: false

# -- guard: the flow is only meaningful on an unlocked vault --
- assertVisible: 'Notes'

# -- create a note while offline --
- tapOn: 'New'
- assertVisible:
    id: 'Note content'
# The editor is a WebView: Maestro reaches WKWebView content only through the
# accessibility tree, so the editor exposes `Note content` as a labelled
# textbox and text is entered against that label rather than an `id:` selector.
- tapOn:
    id: 'Note content'
- inputText: 'offline body ${RUN_ID}'

# -- rename it to something this run can recognise later --
- tapOn: 'More'
- tapOn:
    id: 'Note title'
- eraseText
- inputText: 'offline note ${RUN_ID}'
- hideKeyboard
- tapOn: 'Close'

# -- edit an existing note too: create and edit are different code paths --
- back
- assertVisible: 'offline note ${RUN_ID}'
- tapOn:
    below: 'Notes'
    index: 1
- tapOn:
    id: 'Note content'
- inputText: ' edited offline ${RUN_ID}'
- back

# -- force-quit. Everything typed must already be in SQLite: the durability
#    rule commits before acking, and backgrounding flushes the bridge first. --
- stopApp

# -- relaunch offline: the edits must be there with no network at all --
- launchApp:
    clearState: false
- assertVisible: 'offline note ${RUN_ID}'
- tapOn: 'offline note ${RUN_ID}'
- assertVisible:
    id: 'Note content'
- assertVisible: 'offline body ${RUN_ID}'
- back

# -- the driver restores the network here, then the app drains on foreground --
- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Notes'
# Give the foreground drain a bounded window. A fixed sleep would be a flake
# generator; the outbox-depth banner is the real signal, and it is deliberately
# distinct from the pull indicator — a run that waited on "Syncing" would call a
# still-full outbox a success.
- extendedWaitUntil:
    notVisible:
      id: 'Unsynced changes'
    timeout: 60000
- assertVisible: 'offline note ${RUN_ID}'
