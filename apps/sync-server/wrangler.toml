name = "memry-sync-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "development"
MIN_APP_VERSION = "0.1.0"
PADDLE_ENVIRONMENT = "sandbox"

[[d1_databases]]
binding = "DB"
database_name = "memry-sync"
database_id = "TODO-create-d1-database"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "memry-encrypted-blobs-staging"

[durable_objects]
bindings = [
  { name = "USER_SYNC_STATE", class_name = "UserSyncState" },
  { name = "LINKING_SESSION", class_name = "LinkingSession" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncState", "LinkingSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[triggers]
# 6-hourly: the D1/R2 cleanup sweep + pack backfill (services/pack-backfill.ts).
# Daily at 04:00 UTC: GitHub release download counts, one PostHog event per
# asset per day (src/services/release-downloads.ts).
crons = ["0 */6 * * *", "0 4 * * *"]

# Pack compaction (#1839): producers enqueue a nudge after each successful push;
# the consumer compacts small blobs into cursor-range immutable packs.
[[queues.producers]]
binding = "PACK_QUEUE"
queue = "memry-pack-compaction-dev"

[[queues.consumers]]
queue = "memry-pack-compaction-dev"
# One pack build ≈ 265 subrequests (see pack-compaction.ts arithmetic), so a
# single message per invocation keeps the 1000-subrequest budget predictable.
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Inherited by env.staging and env.production (observability is an inheritable key)
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[env.staging]
name = "memry-sync-server-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGIN = "https://staging.memrynote.com"
WEB_OAUTH_REDIRECT_URI = "https://staging.memrynote.com/auth/oauth/callback"
MIN_APP_VERSION = "0.1.0"
PADDLE_ENVIRONMENT = "sandbox"
POSTHOG_HOST = "https://us.i.posthog.com"

[[env.staging.routes]]
pattern = "sync-staging.memrynote.com/*"
zone_name = "memrynote.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "memry-sync-staging"
database_id = "f854636b-118f-492c-9b67-f5fb97b52647"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "memry-encrypted-blobs-staging"

[env.staging.durable_objects]
bindings = [
  { name = "USER_SYNC_STATE", class_name = "UserSyncState" },
  { name = "LINKING_SESSION", class_name = "LinkingSession" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[env.staging.queues.producers]]
binding = "PACK_QUEUE"
queue = "memry-pack-compaction-staging"

[[env.staging.queues.consumers]]
queue = "memry-pack-compaction-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[env.production]
name = "memry-sync-server-production"
[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://memrynote.com"
WEB_OAUTH_REDIRECT_URI = "https://memrynote.com/auth/oauth/callback"
MIN_APP_VERSION = "0.1.0"
PADDLE_ENVIRONMENT = "production"
POSTHOG_HOST = "https://us.i.posthog.com"

[[env.production.routes]]
pattern = "sync.memrynote.com/*"
zone_name = "memrynote.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "memry-sync-production"
database_id = "9025e9bc-5058-4b61-9e0d-bd2f22616dc1"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "memry-encrypted-blobs-production"

[env.production.durable_objects]
bindings = [
  { name = "USER_SYNC_STATE", class_name = "UserSyncState" },
  { name = "LINKING_SESSION", class_name = "LinkingSession" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[env.production.queues.producers]]
binding = "PACK_QUEUE"
queue = "memry-pack-compaction-production"

[[env.production.queues.consumers]]
queue = "memry-pack-compaction-production"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
