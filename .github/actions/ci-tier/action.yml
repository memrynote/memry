name: CI tier
description: >-
  Decide which CI tier a run needs. A pull request whose base is not main is tiered: one into
  feat/tauri-v2, or one stacked on another PR's branch. Every other event (push, workflow_dispatch,
  a PR into main) gets every output true and every OS leg, so those runs behave as they did before
  tiering.

  A tiered PR runs the fast tier unless it carries the `full-ci` label. The path outputs say
  whether the diff can change what a gate protects, and the `rust_*` and `tauri_*` outputs add the
  Windows and Apple Silicon legs the diff can break (see tier.sh). If the file list cannot be read
  the run is full (so is a list of 3000 files, where the API stops); if the patches or the Rust
  sources cannot be read the OS legs fail open (`tests`).

  Two more outputs serve the merge queue (#3517). `electron` says whether the diff touches what
  the Electron Desktop CI heavy jobs protect; it is detected for tiered PRs (even with `full-ci`),
  the merge queue and pushes to feat/tauri-v2, and is true everywhere else. `intel` says whether
  Intel macOS legs run: false on tiered PRs, in the merge queue and on a push to feat/tauri-v2;
  true everywhere else (main, workflow_dispatch), so main keeps them and a dispatch is the way to
  run them for feat/tauri-v2. `macos` says whether Apple Silicon macOS legs run: false only in the
  merge queue, where the macOS runner pool is the bottleneck; PRs with `full-ci` and pushes to
  feat/tauri-v2 still run them.
inputs:
  token:
    description: Token that can read the pull request's files
    required: true
  source:
    description: >-
      Checkout holding the PR's Rust sources (crates/ and apps/desktop-tauri/src-tauri/), whose
      `#[cfg(<os>)] mod` declarations the OS legs read. Empty: the OS legs fail open (`tests`).
    default: ''
  post-merge:
    description: >-
      'true' lets a push to feat/tauri-v2 run only the legs the merge queue skips (`post_merge`) when
      the calling workflow's merge_group run on the same SHA succeeded. Needs `actions: read`.
    default: 'false'
outputs:
  full:
    description: The full matrix runs (push, dispatch, merge queue, `full-ci` label, a PR into main, or an unreadable file list)
    value: ${{ steps.tier.outputs.full }}
  tauri:
    description: The diff can change Tauri app behavior, so the Tauri build and E2E run
    value: ${{ steps.tier.outputs.tauri }}
  swift:
    description: The diff can change the UniFFI surface or the iOS app, so the Swift bindings check runs
    value: ${{ steps.tier.outputs.swift }}
  electron:
    description: The diff can change Electron desktop behavior, so the Electron Desktop CI heavy jobs run
    value: ${{ steps.tier.outputs.electron }}
  intel:
    description: Intel macOS legs run (false on tiered PRs, in the merge queue and on a push to feat/tauri-v2)
    value: ${{ steps.tier.outputs.intel }}
  macos:
    description: Apple Silicon macOS legs run (false in the merge queue only)
    value: ${{ steps.tier.outputs.macos }}
  rust_windows:
    description: Windows x64 Rust legs a fast-tier PR adds (none, checks, tests)
    value: ${{ steps.tier.outputs.rust_windows }}
  rust_macos:
    description: Apple Silicon Rust legs a fast-tier PR adds (none, checks, tests)
    value: ${{ steps.tier.outputs.rust_macos }}
  tauri_windows:
    description: Windows x64 Tauri build legs a fast-tier PR adds (none, checks = debug, tests = debug and e2e)
    value: ${{ steps.tier.outputs.tauri_windows }}
  tauri_macos:
    description: Apple Silicon Tauri build legs a fast-tier PR adds (none, checks = debug, tests = debug and e2e)
    value: ${{ steps.tier.outputs.tauri_macos }}
  rust_linux_arm64:
    description: The Linux arm64 memry-ml-worker leg runs (full tier, the merge queue included, or a fast-tier PR that touches the worker, its native inputs, the vectors and tessdata its tests read, or their CI)
    value: ${{ steps.tier.outputs.rust_linux_arm64 }}
  post_merge:
    description: A push to feat/tauri-v2 whose SHA passed this workflow in the merge queue and changed no cache-key input; only the legs the queue skips run
    value: ${{ steps.tier.outputs.post_merge }}
runs:
  using: composite
  steps:
    - id: tier
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BASE_REF: ${{ github.base_ref }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        SOURCE_ROOT: ${{ inputs.source }}
        POST_MERGE: ${{ inputs.post-merge }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail

        # Changed files, for the path outputs, and a PR's patches, for its OS legs. Other events (main,
        # dispatch, PRs into main) are not path-gated.
        kind=none
        if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" != "main" ]; then kind=pr; fi
        if [ "$EVENT" = "merge_group" ]; then kind=range; from="$MQ_BASE_SHA"; to="$MQ_HEAD_SHA"; fi
        if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/feat/tauri-v2" ]; then kind=range; from="$PUSH_BEFORE"; to="$PUSH_AFTER"; fi

        files=""
        listed=false
        patches="$RUNNER_TEMP/ci-tier-pr-files.jsonl"
        rm -f "$patches"
        if [ "$kind" = pr ]; then
          if gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | {filename, previous_filename, patch, changes}' > "$patches" \
            && files=$(jq -r '.filename' "$patches"); then listed=true; else rm -f "$patches"; fi
        elif [ "$kind" = range ]; then
          if [[ ! "$from" =~ ^0*$ ]] && git fetch --no-tags --depth=1 --filter=blob:none origin "$from" "$to" \
            && files=$(git diff --name-only --no-renames "$from" "$to"); then listed=true; fi
        fi
        if [ "$kind" != none ] && [ "$listed" != true ]; then
          echo "::warning::could not list the changed files; running the path-gated jobs"
        fi

        # A merge-queue merge fast-forwards feat/tauri-v2 to the commit the queue tested, so the push
        # re-tests a SHA this workflow already passed. Anything but a found successful run (a bypass
        # push, an API error) leaves queue_tested false and the push runs every leg.
        queue_tested=false
        if [ "$POST_MERGE" = true ] && [ "$EVENT" = push ] && [ "$REF" = "refs/heads/feat/tauri-v2" ]; then
          workflow_path=${WORKFLOW_REF#"$REPO/"}
          workflow_path=${workflow_path%%@*}
          if found=$(gh api "repos/$REPO/actions/runs?head_sha=$PUSH_AFTER&event=merge_group&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.path == \"$workflow_path\")] | length"); then
            if [ "$found" -gt 0 ]; then queue_tested=true; fi
          else
            echo "::warning::could not look up the merge_group runs of $PUSH_AFTER; running every leg"
          fi
          echo "merge_group success for $workflow_path at $PUSH_AFTER: $queue_tested" >&2
        fi

        printf '%s\n' "$files" | LISTED="$listed" PATCHES="$patches" QUEUE_TESTED="$queue_tested" bash "$GITHUB_ACTION_PATH/tier.sh" >> "$GITHUB_OUTPUT"
