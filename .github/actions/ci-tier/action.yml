name: CI tier
description: >-
  Decide which CI tier a run needs. Only pull requests whose base is feat/tauri-v2 are tiered;
  every other event (push, workflow_dispatch, a PR into main) gets every output true, so those
  runs behave as they did before tiering.

  A tiered PR runs the fast tier unless it carries the `full-ci` label. The path outputs say
  whether the diff can change what a gate protects. If the file list cannot be read, they fail
  open (true).

  Two more outputs serve the merge queue (#3517). `electron` says whether the diff touches what
  the Electron Desktop CI heavy jobs protect; it is detected for PRs into feat/tauri-v2 (even
  with `full-ci`), the merge queue and pushes to feat/tauri-v2, and is true everywhere else.
  `intel` says whether Intel macOS legs run: false on PRs into feat/tauri-v2, in the merge queue
  and on a push to feat/tauri-v2; true everywhere else (main, workflow_dispatch), so main keeps
  them and a dispatch is the way to run them for feat/tauri-v2. `macos` says whether Apple
  Silicon macOS legs run: false only in the merge queue, where the macOS runner pool is the
  bottleneck; PRs with `full-ci` and pushes to feat/tauri-v2 still run them.
inputs:
  token:
    description: Token that can read the pull request's files
    required: true
outputs:
  full:
    description: The full matrix runs (push, dispatch, `full-ci` label, or a PR not into feat/tauri-v2)
    value: ${{ steps.tier.outputs.full }}
  tauri:
    description: The diff can change Tauri app behavior, so the Tauri build and E2E run
    value: ${{ steps.tier.outputs.tauri }}
  swift:
    description: The diff can change the UniFFI surface or the iOS app, so the Swift bindings check runs
    value: ${{ steps.tier.outputs.swift }}
  electron:
    description: The diff can change Electron desktop behavior, so the Electron Desktop CI heavy jobs run
    value: ${{ steps.tier.outputs.electron }}
  intel:
    description: Intel macOS legs run (false on PRs into feat/tauri-v2, in the merge queue and on a push to feat/tauri-v2)
    value: ${{ steps.tier.outputs.intel }}
  macos:
    description: Apple Silicon macOS legs run (false in the merge queue only)
    value: ${{ steps.tier.outputs.macos }}
runs:
  using: composite
  steps:
    - id: tier
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BASE_REF: ${{ github.base_ref }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Changed files, for the path outputs. Other events (main, dispatch, PRs into main) are not path-gated.
        kind=none
        if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "feat/tauri-v2" ]; then kind=pr; fi
        if [ "$EVENT" = "merge_group" ]; then kind=range; from="$MQ_BASE_SHA"; to="$MQ_HEAD_SHA"; fi
        if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/feat/tauri-v2" ]; then kind=range; from="$PUSH_BEFORE"; to="$PUSH_AFTER"; fi

        files=""
        listed=false
        if [ "$kind" = pr ]; then
          if files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then listed=true; fi
        elif [ "$kind" = range ]; then
          if [[ ! "$from" =~ ^0*$ ]] && git fetch --no-tags --depth=1 --filter=blob:none origin "$from" "$to" \
            && files=$(git diff --name-only --no-renames "$from" "$to"); then listed=true; fi
        fi
        if [ "$kind" != none ] && [ "$listed" != true ]; then
          echo "::warning::could not list the changed files; running the path-gated jobs"
        fi

        printf '%s\n' "$files" | LISTED="$listed" bash "$GITHUB_ACTION_PATH/tier.sh" >> "$GITHUB_OUTPUT"
