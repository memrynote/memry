name: Install apt packages
description: apt-get update and install with per-command timeouts and retries, so a stalled or trickling mirror fails within ~10 min instead of running into the job timeout.
inputs:
  packages:
    description: Space-separated apt packages
    required: true
runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # GitHub runners ship Microsoft/Azure apt repos that intermittently 403 or stall.
        sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
        # Healthy mirror: the whole install takes 20-60 s. A mirror that trickles (15 kB/s seen on
        # 27 Oct) never finishes, so each attempt is cut short, keeps the .debs it already fetched
        # and retries. Three attempts stay under ~9.5 min, inside the callers' 10 min step timeout.
        for attempt in 1 2 3; do
          # shellcheck disable=SC2086
          if sudo timeout 60 apt-get "${opts[@]}" update &&
            sudo timeout 120 apt-get "${opts[@]}" install -y $PACKAGES; then
            exit 0
          fi
          echo "apt attempt $attempt failed; retrying in $((attempt * 5))s"
          # A timeout that lands in the unpack phase leaves dpkg half-configured.
          sudo dpkg --configure -a || true
          sleep $((attempt * 5))
        done
        echo "apt failed after 3 attempts" >&2
        exit 1
