name: Install apt packages
description: apt-get update and install with the .debs cached per image and package list, per-command timeouts and a fallback mirror, so a stalled or trickling mirror fails within ~10 min instead of running into the job timeout.
inputs:
  packages:
    description: Space-separated apt packages
    required: true
runs:
  using: composite
  steps:
    - name: Resolve apt .deb cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # A deb set is valid for one image (package versions) and one package list. A restore
        # from an older image still saves the debs apt does not need to fetch again.
        list=$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)
        mkdir -p "$RUNNER_TEMP/apt-debs/partial"
        {
          echo "dir=$RUNNER_TEMP/apt-debs"
          echo "prefix=apt-debs-$ImageOS-$list-"
          echo "key=apt-debs-$ImageOS-$list-$ImageVersion"
        } >> "$GITHUB_OUTPUT"

    - name: Restore apt .debs
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.dir }}/*.deb
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install apt packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEB_DIR: ${{ steps.key.outputs.dir }}
      run: |
        # GitHub runners ship Microsoft/Azure apt repos that intermittently 403 or stall.
        sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60 -o Dir::Cache::archives="$DEB_DIR")
        # A healthy install takes 20-60 s. The runner image's default mirror
        # (azure.archive.ubuntu.com) sometimes stalls on single .debs or serves 60-130 kB/s
        # for a whole job: it never fails outright, so no per-request timeout fires, and the
        # ~57 MB download ran 2-27 min on 27 Oct and 10 Nov. The .debs are cached per image, so
        # most runs download nothing. A cold run downloads in capped attempts (apt keeps the
        # .debs it already fetched) and the retries switch to kernel.org's mirror: on 10 Nov
        # it served all 4 probed .debs (37 MB) in 1-3 s from three runners, while
        # archive.ubuntu.com and us.archive.ubuntu.com timed out or took 24-80 s for the same files.
        # Three attempts take at most ~10 min, inside the callers' 12 min step timeout.
        for attempt in 1 2 3; do
          if [ "$attempt" = 2 ]; then
            echo "switching apt to mirrors.edge.kernel.org"
            sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt#https://mirrors.edge.kernel.org/ubuntu#g; s#https?://azure\.archive\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          fi
          # The first attempt is the fast path; a cold mirror index is bigger to fetch.
          update_cap=45
          [ "$attempt" = 1 ] || update_cap=90
          # shellcheck disable=SC2086
          if sudo timeout "$update_cap" apt-get "${opts[@]}" update &&
            sudo timeout 120 apt-get "${opts[@]}" install -y --download-only $PACKAGES; then
            # Everything is local now, so dpkg is never killed by a download timeout.
            # shellcheck disable=SC2086
            sudo apt-get "${opts[@]}" install -y --no-download $PACKAGES
            exit 0
          fi
          echo "apt attempt $attempt failed"
        done
        echo "apt failed after 3 attempts" >&2
        exit 1

    - name: Save apt .debs
      if: success() && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.key.outputs.dir }}/*.deb
        key: ${{ steps.key.outputs.key }}
