name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: '- No merged pull requests in this release window.'
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Fixes
    labels:
      - bug
      - fix
      - regression
  - title: Maintenance
    labels:
      - chore
      - dependencies
      - maintenance
template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
