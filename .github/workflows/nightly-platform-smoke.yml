# Nightly macOS platform smoke.
#
# These two jobs used to run in desktop-ci.yml on every main push (and
# package-smoke on every PR push — it was missing the main-push guard the
# other e2e jobs had). macOS minutes bill at 10x ubuntu, and together the two
# jobs were ~247 cost-units of a ~590 cost-unit main push, so they now run on
# a nightly schedule instead. Trade-off: a macOS-only regression (including a
# packaged-runtime dependency break) surfaces up to ~24h after merge instead
# of on the PR/main push; the cost of that is one revert, and the on-failure
# job below opens/updates a GitHub issue so a red nightly cannot go unnoticed.
#
# RELEASE RITUAL: releases go out via manual workflow_dispatch of
# publish-release.yml. Since macOS coverage is no longer on every main push,
# dispatch THIS workflow first and see it green before publishing a release.

name: Nightly Platform Smoke

on:
  schedule:
    # 03:17 UTC nightly — off-peak for both US and EU working hours, and off
    # the top of the hour to dodge GitHub's scheduled-run congestion.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-platform-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  HUSKY: 0
  ELECTRON_DISABLE_SANDBOX: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  e2e-smoke-macos:
    name: Electron E2E smoke (macOS)
    # No xvfb: macOS runners have a window server. ensure-native.sh is used
    # directly (it is bash-native and works here — the Windows job in
    # desktop-ci.yml hand-rolls the rebuild + stamp only because
    # ensure-native.sh breaks under MSYS).
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Electron binary
        uses: ./.github/actions/cache-electron-binary

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron smoke tests
        run: |
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec playwright test \
            --config config/playwright.config.ts \
            tests/e2e/startup-recovery.e2e.ts \
            tests/e2e/vault.e2e.ts \
            tests/e2e/notes.e2e.ts \
            tests/e2e/tasks.e2e.ts \
            tests/e2e/file-attachments-viewer.e2e.ts \
            tests/e2e/crdt-preflight-crash.e2e.ts \
            tests/e2e/i18n.e2e.ts

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-macos-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  package-smoke:
    name: Packaged runtime smoke
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Create production runtime environment
        run: printf 'SYNC_SERVER_URL=https://sync.memrynote.com\n' > apps/desktop/.env.production

      - name: Build unpacked macOS app
        run: |
          pnpm --filter @memry/desktop exec electron-vite build
          node apps/desktop/scripts/build-packaged-app.js --dir

      - name: Check packaged runtime dependencies
        run: node apps/desktop/scripts/check-packaged-runtime-deps.js

  report-failure:
    name: Open issue on failure
    # A red nightly must be visible: nobody watches scheduled runs. Opens a
    # tracking issue on failure, or comments on the existing open one instead
    # of piling up a duplicate every night.
    needs: [e2e-smoke-macos, package-smoke]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const titlePrefix = '[nightly-platform-smoke] Nightly macOS smoke failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Nightly Platform Smoke failed on \`${context.ref}\` at ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'macOS coverage no longer runs on every main push, so this failure is the',
              'only signal — investigate before the next release (publish-release.yml).',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              // Dedupe marker is the fixed title prefix (no marker label —
              // the repo has no suitable label and a missing one would 404).
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titlePrefix,
                body,
              });
              core.info(`Opened issue #${created.number}`);
            }
