# iOS CI (spec 002-native-foundation-ios, train A0 + A3 / gate G2b).
#
# This workflow inherits the two gates that used to live only in mobile-ci.yml,
# because both die the day apps/mobile is frozen:
#   - editor asset freshness (the `ipc:check` of the prebuilt WebView bundle)
#   - crypto vector parity (the desktop proof suite the Rust core is measured against)
name: iOS CI

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/swift/**'
      - 'packages/editor-web/**'
      - 'packages/contracts/**'
      - 'packages/editor-schema/**'
      - 'crates/**'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/check-line-ceilings.mjs'
      - '.github/workflows/ios-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - 'packages/swift/**'
      - 'packages/editor-web/**'
      - 'packages/contracts/**'
      - 'packages/editor-schema/**'
      - 'crates/**'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/check-line-ceilings.mjs'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  SKIP_ELECTRON_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1
  SIMULATOR: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  inherited-gates:
    name: Gates inherited from mobile-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the WebView editor bundle
        run: pnpm --filter @memry/editor-web typecheck

      # Inherited gate 1. An edit to packages/editor-web or to the bridge
      # contract that ships without a rebuild leaves the shell talking to
      # yesterday's editor.
      - name: Editor asset freshness (bridge contract drift gate)
        run: pnpm --filter @memry/editor-web editor:check

      # Inherited gate 2. The vectors the Rust core must reproduce byte for byte.
      - name: Crypto parity vectors (desktop proof suite)
        run: pnpm --filter @memry/contracts test -- src/__tests__/crypto-vectors.test.ts

      - name: Architecture boundaries (iOS transport seam)
        run: pnpm check:architecture

      - name: Line ceilings
        run: node scripts/check-line-ceilings.mjs

      # Constitution II: the shell logs through OSLog, the editor guest through
      # the bridge. A stray print()/console.* is a build failure, not a review note.
      - name: No print() in Swift, no console.* in the editor guest
        run: |
          status=0
          if grep -rnE '(^|[^A-Za-z0-9_.])print\(' --include='*.swift' apps/ios \
            | grep -v '^apps/ios/Memry/Generated/'; then
            echo "::error::print() found in Swift. Use an OSLog Logger."
            status=1
          fi
          if grep -rnE '(^|[^A-Za-z0-9_.])console\.' packages/editor-web/src; then
            echo "::error::console.* found in the editor guest. Report through the bridge."
            status=1
          fi
          exit $status

  build-and-test:
    name: Build once, run every test plan
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # The Swift package's binaryTarget cannot resolve without it, so this is a
      # build prerequisite, not an optional step.
      - name: Build the core XCFramework
        run: crates/memry-core/build-xcframework.sh

      # No --config: passing one explicitly makes SwiftLint ignore the nested
      # .swiftlint.yml files that relax the force rules for the test targets.
      - name: SwiftLint
        working-directory: apps/ios
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Editor asset binding is current
        run: |
          if [ -f apps/ios/Memry/Scripts/verify-editor-asset.sh ]; then
            apps/ios/Memry/Scripts/verify-editor-asset.sh
            git diff --exit-code -- apps/ios/Memry/Generated/EditorWebAsset.swift
          else
            echo "verify-editor-asset.sh not present yet (lands with the Swift editor host)."
          fi

      # Compile once, run three plans (research R19). `build-for-testing` still
      # runs per plan because the .xctestrun it emits is plan-specific, but
      # every compile after the first is a cache hit against the same
      # derivedDataPath -- the expensive part happens once.
      - name: Build for testing and run every plan
        working-directory: apps/ios
        run: |
          for plan in Unit Conformance UI; do
            xcodebuild build-for-testing test-without-building \
              -project Memry.xcodeproj \
              -scheme Memry \
              -testPlan "$plan" \
              -destination "$SIMULATOR" \
              -derivedDataPath build \
              -resultBundlePath "build/${plan}.xcresult" \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Upload xcresult bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresults
          path: apps/ios/build/*.xcresult
          retention-days: 7
