# Desktop on Tauri v2 (#3517, Step 02). The Electron app keeps desktop-ci.yml; this workflow
# checks the Tauri app and builds, launches and uploads it on every OS leg.
name: Desktop Tauri CI

on:
  pull_request:
    paths:
      - 'apps/desktop-tauri/**'
      - 'crates/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'oxlint.config.mts'
      - '.github/workflows/desktop-tauri-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libsecret-1-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # apps/extension/tsconfig.json extends a file `wxt prepare` generates, and type-aware lint
      # rejects a project it cannot load. `--ignore-scripts` skipped it at install.
      - name: Lint
        run: |
          pnpm --filter @memry/extension exec wxt prepare
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: IPC bindings are current
        run: pnpm ipc:check

  renderer-tests:
    name: Renderer tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm --filter @memry/desktop-tauri test

      - name: Script tests
        run: pnpm --filter @memry/desktop-tauri test:scripts

  build:
    name: Build ${{ matrix.variant }} (${{ matrix.artifact_os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, e2e]
        include:
          - { os: macos-15, triple: aarch64-apple-darwin, artifact_os: macos-arm64 }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, artifact_os: macos-x64 }
          - { os: windows-2022, triple: x86_64-pc-windows-msvc, artifact_os: windows-x64 }
          - { os: windows-11-arm, triple: aarch64-pc-windows-msvc, artifact_os: windows-arm64 }
          - { os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, artifact_os: linux-x64 }
    env:
      VITE_MEMRY_DEV_API_PROXY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libsecret-1-dev patchelf xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: ${{ matrix.variant }}-${{ matrix.triple }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build (debug)
        if: matrix.variant == 'debug'
        run: pnpm --filter @memry/desktop-tauri exec tauri build --debug --no-bundle --target ${{ matrix.triple }}

      - name: Build (e2e)
        if: matrix.variant == 'e2e'
        env:
          VITE_MEMRY_E2E: '1'
        run: pnpm --filter @memry/desktop-tauri exec tauri build --debug --no-bundle --features e2e --target ${{ matrix.triple }}

      - name: Locate binary
        id: binary
        run: |
          bin="crates/target/${{ matrix.triple }}/debug/memry-tauri"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Launch smoke
        if: matrix.variant == 'debug'
        run: node apps/desktop-tauri/scripts/smoke-launch.mjs "${{ steps.binary.outputs.path }}"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: memry-tauri-${{ matrix.variant }}-${{ matrix.artifact_os }}
          path: ${{ steps.binary.outputs.path }}
          retention-days: 14
