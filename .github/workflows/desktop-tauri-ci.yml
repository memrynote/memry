# Desktop on Tauri v2 (#3517, Step 02). The Electron app keeps desktop-ci.yml; this workflow
# checks the Tauri app and builds, launches and uploads it on every OS leg.
name: Desktop Tauri CI

on:
  pull_request:
    # `labeled` starts the full matrix for a PR into feat/tauri-v2 once `full-ci` is added; every
    # other labeled event skips all jobs, so PRs into main see no change.
    types: [opened, synchronize, reopened, labeled]
  # The full matrix runs on every merge into feat/tauri-v2.
  push:
    branches:
      - feat/tauri-v2
    paths:
      - 'apps/desktop-tauri/**'
      - 'crates/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'oxlint.config.mts'
      - '.github/workflows/desktop-tauri-ci.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per workflow and ref; a PR with `full-ci` and the noop runs keep their own groups. A
  # workflow_dispatch on feat/tauri-v2 gets its own group so a manual Intel run is neither cancelled
  # by a push nor cancels one.
  group: desktop-tauri-ci-${{ github.workflow }}-${{ github.ref }}${{ ((github.event.action == 'labeled' && !(github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) || (github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && format('-noop-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/tauri-v2' && format('-dispatch-{0}', github.run_id) || (github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci') && '-full' || '')) }}
  # A burst of merges into feat/tauri-v2 checks only the newest head: a push there cancels the run
  # of the previous head. main pushes keep running to completion, as before.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  CARGO_TERM_COLOR: always

jobs:
  # Tiering: a PR into feat/tauri-v2 runs the fast tier; `full-ci`, a push to feat/tauri-v2 and
  # workflow_dispatch run everything. Every other trigger gets full = tauri = swift = true.
  plan:
    name: CI tier
    if: (github.event.action != 'labeled' && !(github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) || (github.event.action == 'labeled' && github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.tier.outputs.full }}
      tauri: ${{ steps.tier.outputs.tauri }}
      swift: ${{ steps.tier.outputs.swift }}
      intel: ${{ steps.tier.outputs.intel }}
      macos: ${{ steps.tier.outputs.macos }}
      build_matrix: ${{ steps.matrix.outputs.build }}
      paths: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Decide tier
        id: tier
        uses: ./.github/actions/ci-tier
        with:
          token: ${{ github.token }}

      # Fast tier: linux-x64 only. Full: every platform, minus Apple Silicon in the merge queue
      # (macos=false) and minus Intel unless plan.intel is true (main, dispatch). macos-x64 has no
      # e2e leg: nothing downloads it.
      - name: Build the build matrix
        id: matrix
        env:
          FULL: ${{ steps.tier.outputs.full }}
          MACOS: ${{ steps.tier.outputs.macos }}
          INTEL: ${{ steps.tier.outputs.intel }}
        run: |
          matrix=$(jq -cn --arg full "$FULL" --arg macos "$MACOS" --arg intel "$INTEL" '
            [
              {platform: "macos-arm64", os: "macos-15", triple: "aarch64-apple-darwin", on: ($macos == "true")},
              {platform: "macos-x64", os: "macos-15-intel", triple: "x86_64-apple-darwin", on: ($intel == "true")},
              {platform: "windows-x64", os: "windows-2022", triple: "x86_64-pc-windows-msvc", on: true},
              {platform: "windows-arm64", os: "windows-11-arm", triple: "aarch64-pc-windows-msvc", on: true},
              {platform: "linux-x64", os: "ubuntu-22.04", triple: "x86_64-unknown-linux-gnu", on: true},
              {platform: "linux-arm64", os: "ubuntu-22.04-arm", triple: "aarch64-unknown-linux-gnu", on: true}
            ]
            | map(select(.on and ($full == "true" or .platform == "linux-x64")) | del(.on))
            | {include: [.[] | . as $p | ("debug", "e2e") as $variant | select($p.platform != "macos-x64" or $variant != "e2e") | $p + {variant: $variant}]}')
          echo "build=$matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $matrix"

      # Replaces the `pull_request.paths` filter: a filtered workflow never runs, so its required gate
      # would never report. Pushes keep their own `paths`; every other event outputs true.
      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(apps/desktop-tauri/|crates/|packages/|pnpm-lock\.yaml$|oxlint\.config\.mts$|\.github/workflows/desktop-tauri-ci\.yml$)'

  static:
    name: Static checks
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') && ((github.event.action != 'labeled' && !(github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) || (github.event.action == 'labeled' && github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: &lean-checkout
          # Bounded checkout: one commit, blobless, and without the ~1.6 GB of marketing media that
          # no job reads (the full-tree checkout took 2 to 22 minutes in a busy hour and consumed the
          # job timeout). Text under marketing/ stays, so lint and format still see it. Other media
          # stay: builds need them. `/*` first, then the exclusions.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**/*.gif
            !/marketing/**/*.jpeg
            !/marketing/**/*.jpg
            !/marketing/**/*.mov
            !/marketing/**/*.mp3
            !/marketing/**/*.mp4
            !/marketing/**/*.png
            !/marketing/**/*.wav
            !/marketing/**/*.webm

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux system libraries
        uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libsecret-1-dev libfontconfig1-dev patchelf

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        continue-on-error: true
        with:
          toolchain: '1.98.1'

      # One retry: a stalled rustup download is cut at 5 min and run again.
      - name: Setup Rust (retry)
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          toolchain: '1.98.1'

      # Saves only on push, dispatch and PRs into main. A PR into feat/tauri-v2 and a merge-queue run
      # restore what the push to feat/tauri-v2 saved and write nothing (a save is 2-4 GB per job).
      - name: Cache cargo
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          workspaces: crates
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref != 'feat/tauri-v2') }}

      # A restore cut off at the step timeout can leave half an archive on disk. Start the
      # build cold rather than from files cargo might trust.
      - name: Drop a partial cargo cache
        if: steps.cargo-cache.outcome == 'failure'
        run: rm -rf crates/target "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/index" "$HOME/.cargo/git/db"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # apps/extension/tsconfig.json extends a file `wxt prepare` generates, and type-aware lint
      # rejects a project it cannot load. `--ignore-scripts` skipped it at install.
      - name: Lint
        run: |
          pnpm --filter @memry/extension exec wxt prepare
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: IPC bindings are current
        run: pnpm ipc:check

  renderer-tests:
    name: Renderer tests
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') && ((github.event.action != 'labeled' && !(github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) || (github.event.action == 'labeled' && github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: *lean-checkout

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm --filter @memry/desktop-tauri test

      - name: Script tests
        run: pnpm --filter @memry/desktop-tauri test:scripts

  # Fast tier: linux-x64 only, and only when the diff can change app behavior. Full: every leg the plan
  # job lists (no Apple Silicon in the merge queue, no Intel except on main and dispatch).
  # Entries that name an existing `platform` add their keys to that platform's legs. Each leg
  # builds and then tests on its own runner, so a platform waits only for itself and a macOS
  # platform takes one runner slot per variant: `Build debug` also runs the launch smoke and the
  # no-driver smoke, `Build e2e` also runs the E2E specs. linux-arm64 builds the artifacts the
  # arm64 Ubuntu VM runs (tart; the vm-repro skill downloads its e2e one); it has no smoke or
  # specs. macos-x64 has no e2e leg: nothing downloads it.
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') && (needs.plan.result == 'failure' || needs.plan.outputs.full == 'true' || needs.plan.outputs.tauri == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Built by the plan job (see "Build the build matrix"). The fallback is the fast tier, for a plan
      # job that failed.
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix || '{"include":[{"platform":"linux-x64","os":"ubuntu-22.04","triple":"x86_64-unknown-linux-gnu","variant":"debug"},{"platform":"linux-x64","os":"ubuntu-22.04","triple":"x86_64-unknown-linux-gnu","variant":"e2e"}]}') }}
    env:
      VITE_MEMRY_DEV_API_PROXY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: *lean-checkout

      # Linux linking needs tens of GB; the image ships ~20 GB of toolchains we never use.
      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libsecret-1-dev libfontconfig1-dev patchelf xvfb gnome-keyring dbus-x11 python3-gi

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        continue-on-error: true
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}

      # One retry: a stalled rustup download is cut at 5 min and run again.
      - name: Setup Rust (retry)
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}

      # Saves only on push, dispatch and PRs into main. A PR into feat/tauri-v2 and a merge-queue run
      # restore what the push to feat/tauri-v2 saved and write nothing (a save is 2-4 GB per job).
      - name: Cache cargo
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          workspaces: crates
          key: ${{ matrix.variant }}-${{ matrix.triple }}
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref != 'feat/tauri-v2') }}

      # A restore cut off at the step timeout can leave half an archive on disk. Start the
      # build cold rather than from files cargo might trust.
      - name: Drop a partial cargo cache
        if: steps.cargo-cache.outcome == 'failure'
        run: rm -rf crates/target "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/index" "$HOME/.cargo/git/db"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build (debug)
        if: matrix.variant == 'debug'
        run: pnpm --filter @memry/desktop-tauri exec tauri build --debug --no-bundle --target ${{ matrix.triple }}

      - name: Build (e2e)
        if: matrix.variant == 'e2e'
        env:
          VITE_MEMRY_E2E: '1'
        run: pnpm --filter @memry/desktop-tauri exec tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json --target ${{ matrix.triple }}

      - name: Locate binary
        id: binary
        run: |
          # The platform overlays (tauri.<os>.conf.json) set mainBinaryName, which renames the binary.
          case "${{ runner.os }}" in
            Windows) name=Memrynote.exe ;;
            macOS) name=MemryNote ;;
            *) name=memrynote ;;
          esac
          bin="crates/target/${{ matrix.triple }}/debug/$name"
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Launch smoke
        timeout-minutes: 5
        if: matrix.variant == 'debug' && matrix.platform != 'linux-arm64'
        run: node apps/desktop-tauri/scripts/smoke-launch.mjs "${{ steps.binary.outputs.path }}"

      # A build without the `e2e` cargo feature, as a release is, started the way a test starts
      # the app (`MEMRY_E2E=1`, a driver port), must not listen, must not log a driver and must
      # carry no `e2e_` command.
      - name: No e2e command in the binary
        if: matrix.variant == 'debug' && contains(fromJSON('["macos-arm64","windows-x64","linux-x64"]'), matrix.platform)
        run: |
          if grep -c e2e_request_quit "${{ steps.binary.outputs.path }}" | grep -qv '^0$'; then
            echo "the binary carries e2e_request_quit"
            exit 1
          fi

      - name: Launch smoke (carries no driver)
        timeout-minutes: 5
        if: matrix.variant == 'debug' && contains(fromJSON('["macos-arm64","windows-x64","linux-x64"]'), matrix.platform)
        run: node apps/desktop-tauri/scripts/smoke-launch.mjs "${{ steps.binary.outputs.path }}" --expect-no-driver

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: memry-tauri-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ steps.binary.outputs.path }}
          retention-days: 14

      - name: Harness unit tests
        if: matrix.variant == 'e2e' && matrix.platform != 'linux-arm64'
        run: pnpm --filter @memry/desktop-tauri test:e2e:harness

      # `dbus-run-session` gives libsecret a session bus; the keyring is unlocked with an empty
      # password. Every other OS has its keychain already.
      - name: E2E specs
        if: matrix.variant == 'e2e' && matrix.platform != 'linux-arm64' && runner.os != 'Linux'
        env:
          MEMRY_E2E_BINARY: ${{ github.workspace }}/${{ steps.binary.outputs.path }}
        run: |
          pnpm --filter @memry/desktop-tauri test:e2e
          pnpm --filter @memry/desktop-tauri test:e2e:multi

      - name: E2E specs (Linux)
        if: matrix.variant == 'e2e' && matrix.platform == 'linux-x64'
        env:
          MEMRY_E2E_BINARY: ${{ github.workspace }}/${{ steps.binary.outputs.path }}
        run: |
          dbus-run-session -- bash -c "
            echo '' | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a -s '-screen 0 1920x1080x24' bash -c 'pnpm --filter @memry/desktop-tauri test:e2e && pnpm --filter @memry/desktop-tauri test:e2e:multi'
          "

      - name: Purge leaked e2e keychain items
        if: always() && matrix.variant == 'e2e' && matrix.platform != 'linux-arm64'
        run: pnpm --filter @memry/desktop-tauri keychain:purge-e2e || true

      - name: Upload e2e results
        if: always() && matrix.variant == 'e2e' && matrix.platform != 'linux-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.platform }}
          path: apps/desktop-tauri/test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

  # The one check name a ruleset requires for this workflow (merge queue, #3517). Matrix legs and
  # fast/full tiers change which jobs exist; this name does not. A skipped job counts as passed.
  # Runs only for feat/tauri-v2 and the merge queue, so main and its PRs see no new check.
  gate:
    name: Desktop Tauri CI gate
    needs: [plan, static, renderer-tests, build]
    # Skipped (not red) in noop runs: the merge queue is the authoritative gate.
    if: ${{ always() && !((github.event.action == 'labeled' && !(github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) || (github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/tauri-v2' || github.ref == 'refs/heads/feat/tauri-v2') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DETECT_RESULT: ${{ needs.plan.result }}
        run: |
          echo "needed job results: $RESULTS"
          # A skipped detection job (a noop `labeled` or `opened` run) must not read as a pass.
          if [ "$DETECT_RESULT" != success ]; then echo "::error::plan job result was $DETECT_RESULT"; exit 1; fi
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
