# CPU-only static ONNX Runtime libraries for the targets ort-sys has no usable prebuilt archive for
# (crates/AGENTS.md, ONNX Runtime): macOS x64 (none), Windows x64 and ARM64 (DirectML builds) and
# Linux x64 (built against glibc 2.38; the app supports glibc 2.35, so this one builds on Ubuntu 22.04).
# Built once per ONNX Runtime version and attached to the release `ort-static-<version>`, which is
# not an app release: a prerelease that is never marked latest, holding these archives only.
# rust-ci.yml and the release builds fetch an archive through .github/actions/ort-static, which
# sets ORT_LIB_LOCATION.
#
# A run builds only the archives the release does not hold yet, so a dispatch after a partial
# failure finishes the set and a complete set builds nothing. A published archive is never
# replaced: a changed build (a new ONNX Runtime version, new build flags) gets a new release tag,
# and the action pins each archive's sha256.
#
# Dispatch only, and `publish` runs in the `ort-static` environment, whose deployment branch
# policy admits main and feat/tauri-v2: a branch nobody reviewed builds but publishes nothing.
name: Build ONNX Runtime static libraries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ort-static
  cancel-in-progress: false

env:
  # The version ort-sys 2.0.0-rc.15 (crates/Cargo.toml) binds to; a bump changes both.
  ORT_VERSION: 1.31.0
  # The commit of the tag v1.31.0, so a moved tag cannot change what builds.
  ORT_COMMIT: 402979ac1bef89dcd55add41eaa7277c407599eb
  # r2: Windows archives built with the static VC runtime (/MT). ort-static-1.31.0 holds the
  # first set (Windows /MD) and stays published, unused.
  RELEASE_TAG: ort-static-1.31.0-r2

jobs:
  plan:
    name: Archives to build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.missing.outputs.targets }}
    steps:
      - name: List the archives the release lacks
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing release means nothing is built yet; any other error stops the run, since an
          # empty listing would rebuild archives the release already holds.
          if ! assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>"$RUNNER_TEMP/error.txt"); then
            cat "$RUNNER_TEMP/error.txt"
            grep -qx 'release not found' "$RUNNER_TEMP/error.txt"
            assets=
          fi
          targets=$(jq -cn --arg assets "$assets" --arg tag "$RELEASE_TAG" '
            [ {triple: "x86_64-apple-darwin", os: "macos-15"},
              {triple: "x86_64-pc-windows-msvc", os: "windows-2022"},
              {triple: "aarch64-pc-windows-msvc", os: "windows-11-arm"},
              {triple: "x86_64-unknown-linux-gnu", os: "ubuntu-22.04"} ]
            | map(select("\($tag)-\(.triple).tar.zst" as $name | ($assets | split("\n") | index($name)) == null))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "To build: $targets"

  build:
    name: ONNX Runtime ${{ matrix.triple }}
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    # A cold ONNX Runtime build takes about an hour on a hosted runner.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ONNX Runtime
        uses: actions/checkout@v6
        with:
          repository: microsoft/onnxruntime
          ref: ${{ env.ORT_COMMIT }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CPU execution provider only (no --use_dml, no other provider), telemetry compiled out, no
      # unit tests. macOS x64 is cross-built on the Apple Silicon runner for macOS 13 and later.
      # Windows links the VC runtime statically (/MT), as the app does (tauri-build's
      # staticVCRuntime, memry-ml/build.rs), so no binary needs MSVCP140.dll.
      - name: Build
        run: |
          args=(--build_dir build --config Release --parallel --skip_tests --compile_no_warning_as_error
            --no_telemetry --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF)
          if [ "$RUNNER_OS" = Windows ]; then
            # The images differ: windows-2022 has Visual Studio 2022, windows-11-arm Visual Studio 2026.
            vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationVersion | cut -d. -f1)
            case "$vs" in
              17) args+=(--cmake_generator "Visual Studio 17 2022") ;;
              18) args+=(--cmake_generator "Visual Studio 18 2026") ;;
              *) echo "::error::unknown Visual Studio version $vs"; exit 1 ;;
            esac
            args+=(--enable_msvc_static_runtime)
          fi
          case "${{ matrix.triple }}" in
            x86_64-apple-darwin) args+=(--osx_arch x86_64 --apple_deploy_target 13.0) ;;
            aarch64-pc-windows-msvc) args+=(--arm64) ;;
          esac
          python tools/ci_build/build.py "${args[@]}"
          # re2 is EXCLUDE_FROM_ALL and a static-only build links nothing, so it is never built, yet
          # the ONNX Runtime libraries call it and ort-sys links it. The Visual Studio solution
          # leaves out EXCLUDE_FROM_ALL targets, so Windows builds re2's own solution.
          if [ "$RUNNER_OS" = Windows ]; then
            cmake --build build/Release/_deps/re2-build --config Release --parallel
          else
            cmake --build build/Release --config Release --target re2 --parallel
          fi

      # A library of the wrong architecture would link nowhere, and a published archive is final.
      - name: Check the target architecture
        working-directory: build/Release
        run: |
          case "${{ matrix.triple }}" in
            x86_64-apple-darwin)
              lipo -archs libonnxruntime_common.a | tee "$RUNNER_TEMP/arch.txt"
              [ "$(cat "$RUNNER_TEMP/arch.txt")" = x86_64 ] ;;
            x86_64-unknown-linux-gnu)
              # Reads the whole listing: `grep -m1` would end readelf with SIGPIPE under pipefail.
              readelf -h libonnxruntime_common.a | grep 'Machine:' | sort -u | tee "$RUNNER_TEMP/arch.txt"
              [ "$(wc -l < "$RUNNER_TEMP/arch.txt")" -eq 1 ] && grep -q 'X86-64' "$RUNNER_TEMP/arch.txt" ;;
            *)
              # The COFF machine of every object in the archive, read directly (no dumpbin lookup).
              want=$([ "${{ matrix.triple }}" = aarch64-pc-windows-msvc ] && echo aa64 || echo 8664)
              python - Release/onnxruntime_common.lib "$want" <<'EOF'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == b"!<arch>\n", "not an archive"
          machines, pos = set(), 8
          while pos + 60 <= len(data):
              name, size = data[pos:pos + 16].rstrip(), int(data[pos + 48:pos + 58])
              body = data[pos + 60:pos + 60 + size]
              if name not in (b"/", b"//") and not name.startswith(b"/<"):
                  # Import and bigobj headers start 00 00 FF FF and hold the machine at offset 6.
                  at = 6 if body[:4] == b"\0\0\xff\xff" else 0
                  machines.add("%04x" % struct.unpack_from("<H", body, at)[0])
              pos += 60 + size + (size & 1)
          print("COFF machines:", sorted(machines))
          sys.exit(0 if machines == {sys.argv[2]} else 1)
          EOF
              ;;
          esac

      # A /MD object anywhere in the tree (ONNX Runtime or a `_deps` library) would bring back the
      # VC++ redistributable DLLs. Its linker directives name the DLL runtime's import libraries.
      - name: Check the static VC runtime
        if: runner.os == 'Windows'
        working-directory: build/Release
        run: |
          find . -name '*.lib' -type f > "$RUNNER_TEMP/windows-libs.txt"
          python - "$RUNNER_TEMP/windows-libs.txt" <<'EOF'
          import re, sys
          dynamic = re.compile(rb'(?i)RuntimeLibrary=MD_Dynamic|/DEFAULTLIB:"?(msvcrtd?|msvcprtd?)(\.lib)?\b')
          static = re.compile(rb'RuntimeLibrary=MT_StaticRelease')
          paths = open(sys.argv[1]).read().split()
          bad = [p for p in paths if dynamic.search(open(p, "rb").read())]
          mt = sum(1 for p in paths if static.search(open(p, "rb").read()))
          print(f"{len(paths)} libraries, {mt} built /MT")
          if bad or mt == 0:
              print("built against the DLL runtime:", *bad, sep="\n  ")
              sys.exit(1)
          EOF

      # Every static library of the build tree, at its path under build/Release: ort-sys finds the
      # ONNX Runtime libraries and their `_deps` from ORT_LIB_LOCATION by that layout.
      - name: Package
        working-directory: build/Release
        run: |
          find . \( -name '*.a' -o -name '*.lib' \) -type f | sed 's|^\./||' | sort > "$RUNNER_TEMP/libs.txt"
          wc -l < "$RUNNER_TEMP/libs.txt"
          grep -E '(^|/)(lib)?re2\.(a|lib)$' "$RUNNER_TEMP/libs.txt"
          archive="$RUNNER_TEMP/$RELEASE_TAG-${{ matrix.triple }}.tar.zst"
          cmake -E tar cf "$archive" --zstd --files-from="$RUNNER_TEMP/libs.txt"
          ls -l "$archive"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-${{ matrix.triple }}
          path: ${{ runner.temp }}/${{ env.RELEASE_TAG }}-${{ matrix.triple }}.tar.zst
          retention-days: 7
          if-no-files-found: error

  # Attaches whatever built, so one failed target does not discard the others; the next run builds
  # only the one still missing.
  publish:
    name: Attach to the release
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: ort-static
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The hashes .github/actions/ort-static pins.
          sha256sum archives/*.tar.zst
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$RUNNER_TEMP/error.txt"; then
            cat "$RUNNER_TEMP/error.txt"
            grep -qx 'release not found' "$RUNNER_TEMP/error.txt"
            # No --target: the tag goes on the default branch. GITHUB_TOKEN may not create a tag on a
            # commit that changes a workflow the default branch lacks (HTTP 403).
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --title "ONNX Runtime $ORT_VERSION static libraries, $RELEASE_TAG (build input)" \
              --notes "CPU-only static ONNX Runtime $ORT_VERSION libraries (commit $ORT_COMMIT; Windows with the static VC runtime), built by .github/workflows/build-ort-static.yml and linked into the desktop app through ORT_LIB_LOCATION. Not an app release."
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" archives/*.tar.zst
