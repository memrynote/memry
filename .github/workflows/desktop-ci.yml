name: Desktop CI

on:
  pull_request:
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  ELECTRON_DISABLE_SANDBOX: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck workspace packages
        run: |
          for package in \
            @memry/app-core \
            @memry/cli \
            @memry/contracts \
            @memry/db-schema \
            @memry/domain-inbox \
            @memry/domain-notes \
            @memry/domain-tasks \
            @memry/i18n \
            @memry/rpc \
            @memry/shared \
            @memry/storage-data \
            @memry/storage-vault \
            @memry/sync-core
          do
            pnpm --filter "$package" run typecheck
          done

      - name: Typecheck desktop main process
        run: pnpm --filter @memry/desktop exec tsc --noEmit -p tsconfig.node.json --composite false

      - name: Typecheck desktop renderer
        run: pnpm --filter @memry/desktop exec tsc --noEmit -p tsconfig.web.json --composite false

      - name: Check IPC generated files
        run: pnpm --filter @memry/desktop run ipc:check

      - name: Lint desktop
        run: pnpm --filter @memry/desktop exec eslint --cache .

      - name: Check desktop i18n
        run: node apps/desktop/scripts/i18n/check.mjs --max-todo 0

  unit:
    name: Unit, integration, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Node
        run: bash apps/desktop/scripts/ensure-native.sh node

      - name: Verify Electron module import fallback
        run: ELECTRON_OVERRIDE_DIST_PATH=/usr/bin node -e "require('electron')"

      - name: Run CLI tests
        run: pnpm test:cli

      - name: Run desktop tests with coverage
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /usr/bin
        run: pnpm --filter @memry/desktop exec vitest run --coverage --config config/vitest.config.ts

      - name: Upload desktop coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/coverage/lcov.info
          flags: desktop
          name: desktop
          fail_ci_if_error: true

  e2e-smoke:
    name: Electron E2E smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11 xvfb

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: pnpm --filter @memry/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron smoke tests
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            xvfb-run -a pnpm --filter @memry/desktop exec playwright test \
              --config config/playwright.config.ts \
              tests/e2e/vault.e2e.ts \
              tests/e2e/notes.e2e.ts \
              tests/e2e/tasks.e2e.ts
          '

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  e2e-full:
    name: Electron E2E full (${{ matrix.shard }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11 xvfb

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: pnpm --filter @memry/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron E2E shard
        env:
          GOOGLE_CALENDAR_E2E: 1
          GOOGLE_CALENDAR_E2E_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_E2E_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_E2E_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_E2E_CLIENT_ID }}
          GOOGLE_CALENDAR_E2E_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_E2E_CLIENT_SECRET }}
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            xvfb-run -a pnpm --filter @memry/desktop exec playwright test \
              --config config/playwright.config.ts \
              --shard=${{ matrix.shard }}
          '

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-results-${{ strategy.job-index }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  package-smoke:
    name: Packaged runtime smoke
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Create production runtime environment
        run: printf 'SYNC_SERVER_URL=https://sync.memrynote.com\n' > apps/desktop/.env.production

      - name: Build unpacked macOS app
        run: |
          pnpm --filter @memry/desktop exec electron-vite build
          node apps/desktop/scripts/build-packaged-app.js --dir

      - name: Check packaged runtime dependencies
        run: node apps/desktop/scripts/check-packaged-runtime-deps.js
