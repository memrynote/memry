name: Desktop CI

on:
  pull_request:
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  ELECTRON_DISABLE_SANDBOX: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck workspace packages
        run: |
          for package in \
            @memry/app-core \
            @memry/cli \
            @memry/contracts \
            @memry/db-schema \
            @memry/domain-inbox \
            @memry/domain-notes \
            @memry/domain-tasks \
            @memry/i18n \
            @memry/rpc \
            @memry/shared \
            @memry/storage-data \
            @memry/storage-vault \
            @memry/sync-core
          do
            pnpm --filter "$package" run typecheck
          done

      - name: Typecheck desktop main process
        run: pnpm --filter @memry/desktop exec tsc --noEmit -p tsconfig.node.json --composite false

      - name: Typecheck desktop renderer
        run: pnpm --filter @memry/desktop exec tsc --noEmit -p tsconfig.web.json --composite false

      - name: Check IPC generated files
        run: pnpm --filter @memry/desktop run ipc:check

      - name: Lint desktop
        run: pnpm --filter @memry/desktop exec eslint --cache .

      - name: Check desktop i18n
        run: node apps/desktop/scripts/i18n/check.mjs --max-todo 0

      - name: Test macOS update-manifest validator
        run: node --test scripts/validate-mac-update-manifest.test.mjs

      # Guards the account matcher that decides which keychain items the purge
      # deletes. Pure functions only, so it runs on any platform.
      - name: Test e2e keychain cleanup tooling
        run: node --test apps/desktop/scripts/purge-e2e-keychain.test.mjs

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          # GitHub runners ship Microsoft/Azure apt repos that intermittently 403
          # ("no longer signed") and break apt-get update. We don't need them.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Node
        run: bash apps/desktop/scripts/ensure-native.sh node

      - name: Verify Electron module import fallback
        run: ELECTRON_OVERRIDE_DIST_PATH=/usr/bin node -e "require('electron')"

      - name: Run CLI tests
        run: pnpm test:cli

      - name: Run desktop tests with coverage
        # Threshold enforcement is deferred to the separate "Coverage thresholds"
        # job so a red badge here always means a real test failure, never a
        # coverage regression. Coverage is still collected and reported.
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /usr/bin
          MEMRY_SKIP_COVERAGE_THRESHOLDS: '1'
        run: pnpm --filter @memry/desktop exec vitest run --coverage --config config/vitest.config.ts

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage-summary
          path: apps/desktop/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Upload desktop coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/coverage/lcov.info
          flags: desktop
          name: desktop
          fail_ci_if_error: true

  coverage:
    name: Coverage thresholds
    # Gates the coverage ratchet floors (apps/desktop/config/coverage-thresholds.json)
    # against the summary produced by the unit job — a distinct check so coverage
    # regressions never read as failing tests. Just reads JSON, so no install.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download coverage summary
        uses: actions/download-artifact@v4
        with:
          name: desktop-coverage-summary
          path: apps/desktop/coverage

      - name: Check coverage thresholds
        run: node apps/desktop/scripts/check-coverage-thresholds.mjs

  e2e-smoke:
    name: Electron E2E smoke
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          # GitHub runners ship Microsoft/Azure apt repos that intermittently 403
          # ("no longer signed") and break apt-get update. We don't need them.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11 xvfb

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: pnpm --filter @memry/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron smoke tests
        run: |
          bash apps/desktop/scripts/ensure-native.sh electron
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            xvfb-run -a pnpm --filter @memry/desktop exec playwright test \
              --config config/playwright.config.ts \
              tests/e2e/vault.e2e.ts \
              tests/e2e/notes.e2e.ts \
              tests/e2e/tasks.e2e.ts
          '

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  e2e-smoke-macos:
    name: Electron E2E smoke (macOS)
    # Push-to-main only, matching the ubuntu and Windows e2e jobs: a macOS
    # runner is the most expensive minute GitHub bills (10x ubuntu), and PRs
    # already run lint + typecheck + unit + ubuntu coverage, plus the attachment
    # client/server integration spec in sync-server-ci.
    # No xvfb: macOS runners have a window server. ensure-native.sh is used
    # directly (it is bash-native and works here — the Windows job hand-rolls the
    # rebuild + stamp only because ensure-native.sh breaks under MSYS).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron smoke tests
        run: |
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec playwright test \
            --config config/playwright.config.ts \
            tests/e2e/startup-recovery.e2e.ts \
            tests/e2e/vault.e2e.ts \
            tests/e2e/notes.e2e.ts \
            tests/e2e/tasks.e2e.ts \
            tests/e2e/file-attachments-viewer.e2e.ts \
            tests/e2e/crdt-preflight-crash.e2e.ts \
            tests/e2e/i18n.e2e.ts

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-macos-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  e2e-smoke-windows:
    name: Electron E2E smoke (Windows)
    # Push-to-main only, matching the ubuntu e2e-smoke/e2e-full jobs: Windows
    # Electron E2E is ~15-25 min, too slow to run on every PR, and PRs already
    # run lint + typecheck + unit + ubuntu coverage. (Ran ungated while the
    # initial Windows-only failures were diagnosed and fixed; now stable.)
    # windows-2022 is pinned — windows-latest ships VS 2026, which node-gyp
    # cannot detect, breaking the native electron-rebuild (same reason the
    # release build-windows job pins it).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        env:
          # Skip the postinstall electron-rebuild; it does not reliably produce the
          # Electron-ABI binary on Windows. We run an explicit force rebuild below.
          SKIP_ELECTRON_REBUILD: 1
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::pnpm install (attempt $attempt/$attempts)"
            if pnpm install --frozen-lockfile; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::pnpm install failed (attempt $attempt/$attempts); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::pnpm install failed after $attempts attempts"
          exit 1

      - name: Rebuild native modules for Electron
        # Run @electron/rebuild's CLI directly via node with a RELATIVE path: it
        # works under git-bash on Windows (an absolute MSYS path gets mangled when
        # handed to node.exe) and avoids `pnpm exec`, whose pre-exec check can prune
        # devDependencies. Then write the stamp file that ensure-native.sh normally
        # writes — the E2E globalSetup precondition reads it to confirm the Electron
        # ABI (node_modules/.native-build-target must say "electron").
        shell: bash
        working-directory: apps/desktop
        run: |
          node node_modules/@electron/rebuild/lib/cli.js -f -o better-sqlite3,classic-level,keytar
          echo electron > node_modules/.native-build-target

      - name: Build desktop app
        shell: bash
        run: pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron smoke tests
        # No xvfb/dbus/gnome-keyring: Windows runners have an interactive desktop
        # session, and keytar uses the Windows Credential Manager directly.
        shell: bash
        run: |
          pnpm --filter @memry/desktop exec playwright test \
            --config config/playwright.config.ts \
            tests/e2e/startup-recovery.e2e.ts \
            tests/e2e/vault.e2e.ts \
            tests/e2e/notes.e2e.ts \
            tests/e2e/tasks.e2e.ts \
            tests/e2e/file-attachments-viewer.e2e.ts \
            tests/e2e/crdt-preflight-crash.e2e.ts \
            tests/e2e/i18n.e2e.ts

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-windows-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  e2e-full:
    name: Electron E2E full (${{ matrix.shard }})
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/16
          - 2/16
          - 3/16
          - 4/16
          - 5/16
          - 6/16
          - 7/16
          - 8/16
          - 9/16
          - 10/16
          - 11/16
          - 12/16
          - 13/16
          - 14/16
          - 15/16
          - 16/16

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          # GitHub runners ship Microsoft/Azure apt repos that intermittently 403
          # ("no longer signed") and break apt-get update. We don't need them.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11 xvfb

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Install Playwright system dependencies
        run: pnpm --filter @memry/desktop exec playwright install-deps chromium

      - name: Build desktop app
        run: |
          bash apps/desktop/scripts/check-cert-hashes.sh
          bash apps/desktop/scripts/ensure-native.sh electron
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Run Electron E2E shard
        env:
          GOOGLE_CALENDAR_E2E: 1
          GOOGLE_CALENDAR_E2E_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_E2E_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_E2E_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_E2E_CLIENT_ID }}
          GOOGLE_CALENDAR_E2E_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_E2E_CLIENT_SECRET }}
        run: |
          bash apps/desktop/scripts/ensure-native.sh electron
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            xvfb-run -a pnpm --filter @memry/desktop exec playwright test \
              --config config/playwright.config.ts \
              --shard=${{ matrix.shard }}
          '

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-results-${{ strategy.job-index }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  package-smoke:
    name: Packaged runtime smoke
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: pnpm install --frozen-lockfile

      - name: Create production runtime environment
        run: printf 'SYNC_SERVER_URL=https://sync.memrynote.com\n' > apps/desktop/.env.production

      - name: Build unpacked macOS app
        run: |
          pnpm --filter @memry/desktop exec electron-vite build
          node apps/desktop/scripts/build-packaged-app.js --dir

      - name: Check packaged runtime dependencies
        run: node apps/desktop/scripts/check-packaged-runtime-deps.js
