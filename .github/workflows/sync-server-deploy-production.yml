name: Deploy sync-server (production)

on:
  workflow_dispatch:

concurrency:
  group: sync-server-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Typecheck, test, and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://sync.memrynote.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for the runner's Node ABI
        run: pnpm --filter @memry/sync-server rebuild better-sqlite3

      - name: Typecheck sync-server
        run: pnpm typecheck:sync-server

      - name: Test sync-server
        run: pnpm test:sync-server

      - name: Apply D1 migrations (production)
        run: pnpm --filter @memry/sync-server exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The PACK_QUEUE producer binding requires a pre-existing queue, or the
      # deploy below fails. Creation is guarded (`|| true`): on every deploy
      # after the first the queue already exists and wrangler errors — that
      # expected failure must not fail the workflow.
      - name: Ensure pack compaction queue exists (production)
        run: pnpm --filter @memry/sync-server exec wrangler queues create memry-pack-compaction-production || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production
        run: pnpm --filter @memry/sync-server exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
