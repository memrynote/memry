name: Security CI

on:
  pull_request:
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  secret-scan:
    name: Secret scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test secret scanner rules
        run: node --test scripts/check-staged-secrets.test.mjs

      - name: Scan changed files for secrets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-staged-secrets.mjs --changed "$BASE_REF"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # extract-zip 2.0.1 has no patched release. It is a dev-only transitive dependency of
          # @wdio/utils (@puppeteer/browsers), which only uses it to unpack browser downloads
          # the Tauri e2e harness never makes (#3520). Remove these when extract-zip is fixed.
          #
          # Electron 43.1.1 in scripts/electron-fixtures is the exact version users run, pinned so
          # the capture tool writes the profile format they have. It opens only its own local
          # fixture page and never loads remote content or a webview. The directory is an
          # Electron-only tool that Step 43 (#3560) deletes; remove these GHSAs with it.
          allow-ghsas: GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3, GHSA-qmv3-fv6v-rmhq, GHSA-9qh4-3jw8-366w, GHSA-j84w-jfhq-vhvj, GHSA-gr2m-v5gq-v685, GHSA-jr5w-w6x2-84p9

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
