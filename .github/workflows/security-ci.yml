name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
  schedule:
    - cron: '23 4 * * 1'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Applies the path filter that used to sit on `pull_request`, in a job, so the workflow always runs
  # and the gate always reports. Pushes keep their own `paths`; every other event outputs true.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '.'
          exclude: '^apps/(docs|landing)/'

  secret-scan:
    name: Secret scan
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test secret scanner rules
        run: node --test scripts/check-staged-secrets.test.mjs

      - name: Scan changed files for secrets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/check-staged-secrets.mjs --changed "$BASE_REF"

  dependency-review:
    name: Dependency review
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # extract-zip 2.0.1 has no patched release. It is a dev-only transitive dependency of
          # @wdio/utils (@puppeteer/browsers), which only uses it to unpack browser downloads
          # the Tauri e2e harness never makes (#3520). Remove these when extract-zip is fixed.
          allow-ghsas: GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # The one check name a ruleset requires for this workflow (merge queue, #3517). Matrix legs and
  # fast/full tiers change which jobs exist; this name does not. A skipped job counts as passed.
  # Runs only for feat/tauri-v2 and the merge queue, so main and its PRs see no new check.
  gate:
    name: Security CI gate
    needs: [changes, secret-scan, dependency-review]
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/tauri-v2' || github.ref == 'refs/heads/feat/tauri-v2') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DETECT_RESULT: ${{ needs.changes.result }}
        run: |
          echo "needed job results: $RESULTS"
          # A skipped detection job (a noop `labeled` or `opened` run) must not read as a pass.
          if [ "$DETECT_RESULT" != success ]; then echo "::error::changes job result was $DETECT_RESULT"; exit 1; fi
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
