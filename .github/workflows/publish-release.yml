name: Publish Desktop Release

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Draft release tag to publish. Leave empty to use the newest draft.
        required: false
      dry_run:
        description: Build artifacts without uploading or publishing the release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-desktop-release
  cancel-in-progress: false

env:
  CI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TIME_ZONE: Europe/Istanbul
  TURBO_TELEMETRY_DISABLED: 1
  # Native modules are rebuilt once in the staged copy by build-packaged-app.js.
  # Skip the throwaway rebuild that pnpm's deps-status preflight triggers via the
  # desktop `postinstall` before each build step.
  SKIP_ELECTRON_REBUILD: 1

jobs:
  setup-release:
    name: Validate draft and resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      draft_tag: ${{ steps.draft.outputs.draft_tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_url: ${{ steps.draft.outputs.release_url }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate draft release
        id: draft
        env:
          DRAFT_TAG: ${{ inputs.draft_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DRAFT_TAG:-}" ]; then
            gh release view "$DRAFT_TAG" --json databaseId,tagName,name,isDraft,targetCommitish,assets,url > "$RUNNER_TEMP/draft-release.json"
          else
            draft_tag="$(
              gh release list --limit 100 --json tagName,isDraft,createdAt \
                --jq '[.[] | select(.isDraft)] | sort_by(.createdAt // "") | reverse | .[0].tagName // ""'
            )"
            if [ -z "$draft_tag" ]; then
              echo "::error::No draft release found"
              exit 1
            fi
            gh release view "$draft_tag" --json databaseId,tagName,name,isDraft,targetCommitish,assets,url > "$RUNNER_TEMP/draft-release.json"
          fi
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs')

          const draft = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/draft-release.json`, 'utf8'))
          if (!draft) {
            throw new Error('No draft release found')
          }

          const target = draft.targetCommitish || ''
          const allowedTargets = new Set([process.env.GITHUB_SHA, 'main', 'refs/heads/main'])

          if (!draft.isDraft) {
            throw new Error(`Release ${draft.tagName} is not a draft`)
          }

          if (draft.assets.length > 0) {
            throw new Error(`Draft release ${draft.tagName} already has assets`)
          }

          if (target && !allowedTargets.has(target)) {
            throw new Error(
              `Draft release target ${target} does not match current main SHA ${process.env.GITHUB_SHA}`
            )
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `draft_tag=${draft.tagName}`,
              `release_id=${draft.databaseId}`,
              `release_url=${draft.url}`
            ].join('\n') + '\n'
          )
          NODE

      - name: Resolve publish-day version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName > "$RUNNER_TEMP/releases.json"
          node scripts/resolve-release-version.mjs \
            --releases-file "$RUNNER_TEMP/releases.json" \
            --ignore-tag "${{ steps.draft.outputs.draft_tag }}"

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: setup-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            builder_arch_flag: --x64
          - arch: arm64
            runner: macos-15
            builder_arch_flag: --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        env:
          SKIP_ELECTRON_REBUILD: 1
        # Retry to survive transient registry/CDN network flakes during a cold
        # pnpm store download (e.g. ETIMEDOUT on npmjs, ENOTFOUND github.com in
        # electron postinstall) that would otherwise kill the whole release.
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::pnpm install (attempt $attempt/$attempts)"
            if pnpm install --frozen-lockfile; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::pnpm install failed (attempt $attempt/$attempts); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::pnpm install failed after $attempts attempts"
          exit 1

      - name: Apply release app version
        env:
          APP_VERSION: ${{ needs.setup-release.outputs.app_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const packagePath = 'apps/desktop/package.json'
          const packageJson = JSON.parse(readFileSync(packagePath, 'utf8'))
          packageJson.version = process.env.APP_VERSION
          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Create runtime environment
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          ONENOTE_CLIENT_ID: ${{ secrets.ONENOTE_CLIENT_ID }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_SERVER_URL:-}" ]; then
            echo "::error::Set SYNC_SERVER_URL as a repository secret before publishing."
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_ID:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_ID as a repository secret before publishing."
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_SECRET:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_SECRET as a repository secret before publishing."
            exit 1
          fi
          {
            printf 'SYNC_SERVER_URL=%s\n' "$SYNC_SERVER_URL"
            printf 'GOOGLE_CALENDAR_CLIENT_ID=%s\n' "$GOOGLE_CALENDAR_CLIENT_ID"
            printf 'GOOGLE_CALENDAR_CLIENT_SECRET=%s\n' "$GOOGLE_CALENDAR_CLIENT_SECRET"
            # Unguarded on purpose: OneNote import is optional, so an unset
            # secret hides the importer instead of failing the release.
            printf 'ONENOTE_CLIENT_ID=%s\n' "$ONENOTE_CLIENT_ID"
          } > apps/desktop/.env.production

      - name: Build signed macOS artifacts
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          set -euo pipefail

          release_requirements=(
            'CSC_LINK|MACOS_CERTIFICATE_P12'
            'CSC_KEY_PASSWORD|MACOS_CERTIFICATE_PASSWORD'
            'APPLE_ID|APPLE_ID'
            'APPLE_APP_SPECIFIC_PASSWORD|APPLE_APP_SPECIFIC_PASSWORD'
            'APPLE_TEAM_ID|APPLE_TEAM_ID'
          )

          for requirement in "${release_requirements[@]}"; do
            env_name="${requirement%%|*}"
            required_name="${requirement#*|}"
            if [ -z "${!env_name:-}" ]; then
              echo "::error::Missing required release secret: $required_name"
              exit 1
            fi
          done

          pnpm --filter @memry/desktop build:release
          node apps/desktop/scripts/build-packaged-app.js \
            --config config/electron-builder.staged-local-mac.yml \
            --mac \
            ${{ matrix.builder_arch_flag }} \
            --publish never

      - name: Check packaged runtime dependencies
        run: node apps/desktop/scripts/check-packaged-runtime-deps.js

      - name: Stage macOS assets
        id: assets
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets-macos"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"

          find apps/desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) \
            -exec cp {} "$asset_dir" \;

          # Each arch build emits its own latest-mac.yml. Rename per-arch so both
          # survive the merge-multiple artifact download; they are merged into a
          # single latest-mac.yml at publish time so x64 and arm64 both auto-update.
          if [ -f "$asset_dir/latest-mac.yml" ]; then
            mv "$asset_dir/latest-mac.yml" "$asset_dir/latest-mac-${{ matrix.arch }}.yml"
          fi

          ls -la "$asset_dir"

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            if ! ls "$asset_dir"/*-arm64.dmg >/dev/null 2>&1; then
              echo "::error::No macOS arm64 DMG artifact was produced."
              exit 1
            fi
          else
            if ! find "$asset_dir" -maxdepth 1 -type f -name '*.dmg' ! -name '*arm64*' | grep -q .; then
              echo "::error::No macOS x64 DMG artifact was produced."
              exit 1
            fi
          fi

          if ! ls "$asset_dir"/*.zip >/dev/null 2>&1; then
            echo "::error::No macOS ZIP artifact was produced."
            exit 1
          fi

          if [ ! -f "$asset_dir/latest-mac-${{ matrix.arch }}.yml" ]; then
            echo "::error::latest-mac-${{ matrix.arch }}.yml was not produced."
            exit 1
          fi

          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memry-release-macos-${{ matrix.arch }}-${{ needs.setup-release.outputs.app_version }}
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: setup-release
    # Pinned: windows-latest now ships VS 2026, which node-gyp 11.5.0 cannot
    # detect ("Could not find any Visual Studio installation"), so the native
    # electron-rebuild fails. windows-2022 ships VS 2022, which node-gyp finds.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        env:
          SKIP_ELECTRON_REBUILD: 1
        # Retry to survive transient registry/CDN network flakes during a cold
        # pnpm store download (e.g. ETIMEDOUT on npmjs, ENOTFOUND github.com in
        # electron postinstall) that would otherwise kill the whole release.
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::pnpm install (attempt $attempt/$attempts)"
            if pnpm install --frozen-lockfile; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::pnpm install failed (attempt $attempt/$attempts); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::pnpm install failed after $attempts attempts"
          exit 1

      - name: Apply release app version
        env:
          APP_VERSION: ${{ needs.setup-release.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const packagePath = 'apps/desktop/package.json'
          const packageJson = JSON.parse(readFileSync(packagePath, 'utf8'))
          packageJson.version = process.env.APP_VERSION
          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Create runtime environment
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          ONENOTE_CLIENT_ID: ${{ secrets.ONENOTE_CLIENT_ID }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_SERVER_URL:-}" ]; then
            echo "::error::Set SYNC_SERVER_URL as a repository secret before publishing."
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_ID:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_ID as a repository secret before publishing"
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_SECRET:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_SECRET as a repository secret before publishing"
            exit 1
          fi
          {
            printf 'SYNC_SERVER_URL=%s\n' "$SYNC_SERVER_URL"
            printf 'GOOGLE_CALENDAR_CLIENT_ID=%s\n' "$GOOGLE_CALENDAR_CLIENT_ID"
            printf 'GOOGLE_CALENDAR_CLIENT_SECRET=%s\n' "$GOOGLE_CALENDAR_CLIENT_SECRET"
            # Unguarded on purpose: OneNote import is optional, so an unset
            # secret hides the importer instead of failing the release.
            printf 'ONENOTE_CLIENT_ID=%s\n' "$ONENOTE_CLIENT_ID"
          } > apps/desktop/.env.production

      # The runtime env is staged + shipped as resources/app-config, a filename
      # with no .env token (see scripts/build-packaged-app.js, the
      # electron-builder configs, and apps/desktop/src/main/index.ts). app-config
      # is declared once in config/electron-builder.yml; the EBUSY that killed
      # earlier Windows releases was electron-builder copying it twice (a
      # duplicate extraResources entry survived the extends-merge), not Defender.
      - name: Build Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        shell: pwsh
        run: |
          pnpm --filter @memry/desktop build:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/build-packaged-app.js --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 2026.705.1 shipped a classic-level binary whose napi calls failed at
      # runtime — every CRDT persistence op crashed or hung, and nothing in the
      # pipeline load-tested the Windows package. Verify native modules load
      # and actually work under the packaged executable before staging assets.
      - name: Check packaged runtime dependencies
        shell: bash
        run: node apps/desktop/scripts/check-packaged-runtime-deps.js apps/desktop/dist/win-unpacked

      - name: Stage Windows assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets-windows'
          Remove-Item $assetDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $assetDir | Out-Null

          Get-ChildItem apps/desktop/dist -File |
            Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*-win.zip' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } |
            Copy-Item -Destination $assetDir

          Get-ChildItem $assetDir | Format-Table Name, Length

          if (-not (Get-ChildItem $assetDir -Filter '*.exe')) {
            throw 'No Windows installer artifact was produced.'
          }

          if (-not (Test-Path (Join-Path $assetDir 'latest.yml'))) {
            throw 'latest.yml was not produced.'
          }

          "asset_dir=$assetDir" >> $env:GITHUB_OUTPUT

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memry-release-windows-${{ needs.setup-release.outputs.app_version }}
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: setup-release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          # GitHub runners ship Microsoft/Azure apt repos that intermittently 403
          # ("no longer signed") and break apt-get update. We don't need them.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        shell: bash
        env:
          SKIP_ELECTRON_REBUILD: 1
        # Retry to survive transient registry/CDN network flakes during a cold
        # pnpm store download (e.g. ETIMEDOUT on npmjs, ENOTFOUND github.com in
        # electron postinstall) that would otherwise kill the whole release.
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::pnpm install (attempt $attempt/$attempts)"
            if pnpm install --frozen-lockfile; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::pnpm install failed (attempt $attempt/$attempts); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::pnpm install failed after $attempts attempts"
          exit 1

      - name: Apply release app version
        env:
          APP_VERSION: ${{ needs.setup-release.outputs.app_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const packagePath = 'apps/desktop/package.json'
          const packageJson = JSON.parse(readFileSync(packagePath, 'utf8'))
          packageJson.version = process.env.APP_VERSION
          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Create runtime environment
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          ONENOTE_CLIENT_ID: ${{ secrets.ONENOTE_CLIENT_ID }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_SERVER_URL:-}" ]; then
            echo "::error::Set SYNC_SERVER_URL as a repository secret before publishing."
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_ID:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_ID as a repository secret before publishing."
            exit 1
          fi
          if [ -z "${GOOGLE_CALENDAR_CLIENT_SECRET:-}" ]; then
            echo "::error::Set GOOGLE_CALENDAR_CLIENT_SECRET as a repository secret before publishing."
            exit 1
          fi
          {
            printf 'SYNC_SERVER_URL=%s\n' "$SYNC_SERVER_URL"
            printf 'GOOGLE_CALENDAR_CLIENT_ID=%s\n' "$GOOGLE_CALENDAR_CLIENT_ID"
            printf 'GOOGLE_CALENDAR_CLIENT_SECRET=%s\n' "$GOOGLE_CALENDAR_CLIENT_SECRET"
            # Unguarded on purpose: OneNote import is optional, so an unset
            # secret hides the importer instead of failing the release.
            printf 'ONENOTE_CLIENT_ID=%s\n' "$ONENOTE_CLIENT_ID"
          } > apps/desktop/.env.production

      - name: Build Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @memry/desktop build:release
          node apps/desktop/scripts/build-packaged-app.js --linux --x64 --publish never

      - name: Stage Linux assets
        id: assets
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets-linux"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"

          find apps/desktop/dist -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest-linux.yml' \) \
            -exec cp {} "$asset_dir" \;

          ls -la "$asset_dir"

          if ! ls "$asset_dir"/*.AppImage >/dev/null 2>&1; then
            echo "::error::No Linux AppImage artifact was produced."
            exit 1
          fi

          if ! ls "$asset_dir"/*.deb >/dev/null 2>&1; then
            echo "::error::No Linux deb artifact was produced."
            exit 1
          fi

          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memry-release-linux-${{ needs.setup-release.outputs.app_version }}
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error

  publish-release:
    name: Attach assets and publish release
    needs:
      - setup-release
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: memry-release-*-${{ needs.setup-release.outputs.app_version }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Merge macOS update manifests
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/yml-merge"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install js-yaml@4 >/dev/null 2>&1
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const yaml = require('js-yaml')

          const dir = process.env.ASSET_DIR
          const armPath = path.join(dir, 'latest-mac-arm64.yml')
          const x64Path = path.join(dir, 'latest-mac-x64.yml')

          for (const file of [armPath, x64Path]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Missing per-arch manifest: ${path.basename(file)}`)
            }
          }

          const arm = yaml.load(fs.readFileSync(armPath, 'utf8'))
          const x64 = yaml.load(fs.readFileSync(x64Path, 'utf8'))

          if (arm.version !== x64.version) {
            throw new Error(`Manifest version mismatch: arm64=${arm.version} x64=${x64.version}`)
          }

          // electron-updater's MacUpdater picks the .zip whose url's includes('arm64')
          // matches the host arch, so both arch entries must be present in files[].
          const filesByUrl = new Map()
          for (const entry of [...(arm.files || []), ...(x64.files || [])]) {
            filesByUrl.set(entry.url, entry)
          }

          const merged = {
            version: arm.version,
            files: [...filesByUrl.values()],
            path: arm.path,
            sha512: arm.sha512,
            releaseDate: arm.releaseDate || x64.releaseDate
          }

          fs.writeFileSync(
            path.join(dir, 'latest-mac.yml'),
            yaml.dump(merged, { lineWidth: -1, noRefs: true })
          )
          fs.rmSync(armPath)
          fs.rmSync(x64Path)

          console.log('Merged latest-mac.yml entries:')
          for (const entry of merged.files) {
            console.log(`  - ${entry.url}`)
          }
          NODE

      # This job has no checkout of its own; fetch the repo so the standalone
      # validator script is available (assets live in RUNNER_TEMP, untouched).
      - name: Check out repo for manifest validation
        uses: actions/checkout@v6

      - name: Validate merged macOS update manifest
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: node scripts/validate-mac-update-manifest.mjs "$ASSET_DIR/latest-mac.yml"

      - name: Verify release asset set
        id: assets
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          ls -la "$asset_dir"

          require_glob() {
            local pattern="$1"
            local message="$2"
            if ! compgen -G "$asset_dir/$pattern" >/dev/null; then
              echo "::error::$message"
              exit 1
            fi
          }

          require_file() {
            local file="$1"
            local message="$2"
            if [ ! -f "$asset_dir/$file" ]; then
              echo "::error::$message"
              exit 1
            fi
          }

          if ! compgen -G "$asset_dir/*-x64.dmg" >/dev/null &&
            ! find "$asset_dir" -maxdepth 1 -type f -name '*.dmg' ! -name '*arm64*' | grep -q .; then
            echo "::error::Missing macOS x64 DMG."
            exit 1
          fi
          require_glob '*-arm64.dmg' 'Missing macOS arm64 DMG.'
          require_glob '*.zip' 'Missing macOS ZIP.'
          require_file 'latest-mac.yml' 'Missing latest-mac.yml.'
          require_glob '*.exe' 'Missing Windows installer.'
          require_glob '*-win.zip' 'Missing Windows ZIP.'
          require_file 'latest.yml' 'Missing Windows latest.yml.'
          require_glob '*.AppImage' 'Missing Linux AppImage.'
          require_glob '*.deb' 'Missing Linux deb.'

          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Upload assets to draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.setup-release.outputs.draft_tag }}" \
            "${{ steps.assets.outputs.asset_dir }}"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Rename draft to publish-day release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ needs.setup-release.outputs.release_id }}" \
            -f tag_name="${{ needs.setup-release.outputs.tag }}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${{ needs.setup-release.outputs.release_name }}" \
            -F draft=true \
            -F prerelease=false

      - name: Verify uploaded release assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ needs.setup-release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,url \
            > "$RUNNER_TEMP/release.json"
          node <<'NODE'
          const { readFileSync } = require('node:fs')

          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`, 'utf8'))
          const assetNames = release.assets.map((asset) => asset.name)

          const hasAsset = (predicate, message) => {
            if (!assetNames.some(predicate)) {
              throw new Error(message)
            }
          }

          if (!release.isDraft) {
            throw new Error('Release was published before asset verification finished')
          }

          hasAsset(
            (name) => name.endsWith('-x64.dmg') || (name.endsWith('.dmg') && !name.includes('arm64')),
            'Release is missing a macOS x64 DMG asset'
          )
          hasAsset((name) => name.endsWith('-arm64.dmg'), 'Release is missing a macOS arm64 DMG asset')
          hasAsset((name) => name.endsWith('.zip'), 'Release is missing a macOS ZIP asset')
          hasAsset((name) => name === 'latest-mac.yml', 'Release is missing latest-mac.yml')
          hasAsset((name) => name.endsWith('.exe'), 'Release is missing a Windows installer asset')
          hasAsset((name) => name === 'latest.yml', 'Release is missing Windows latest.yml')
          hasAsset((name) => name.endsWith('.AppImage'), 'Release is missing a Linux AppImage asset')
          hasAsset((name) => name.endsWith('.deb'), 'Release is missing a Linux deb asset')
          NODE

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ needs.setup-release.outputs.release_id }}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true

      - name: Final release check
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ needs.setup-release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,isDraft,isPrerelease,assets,url \
            > "$RUNNER_TEMP/published-release.json"
          node <<'NODE'
          const { readFileSync } = require('node:fs')

          const release = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/published-release.json`, 'utf8')
          )

          if (release.isDraft) {
            throw new Error('Release is still marked as draft after publish')
          }

          if (release.isPrerelease) {
            throw new Error('Release is marked as prerelease')
          }

          if (release.assets.length === 0) {
            throw new Error('Published release has no assets')
          }

          console.log(`Published ${release.name}: ${release.url}`)
          console.log(`Assets: ${release.assets.length}`)
          NODE

  update-homebrew-tap:
    name: Bump Homebrew cask
    needs:
      - setup-release
      - publish-release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate and push cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on memrynote/homebrew-tap; GITHUB_TOKEN cannot
          # write to a different repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.setup-release.outputs.tag }}
          APP_VERSION: ${{ needs.setup-release.outputs.app_version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN (PAT with contents:write on memrynote/homebrew-tap) to auto-bump the cask."
            exit 1
          fi

          work="$RUNNER_TEMP/cask"
          mkdir -p "$work"

          # Names the cask url will resolve to; if electron-builder ever renames
          # the DMG, gh release download fails loudly here instead of shipping a
          # 404 cask.
          arm_dmg="MemryNote-${APP_VERSION}-arm64.dmg"
          x64_dmg="MemryNote-${APP_VERSION}-x64.dmg"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$arm_dmg" --pattern "$x64_dmg" --dir "$work" --clobber

          sha_arm="$(sha256sum "$work/$arm_dmg" | cut -d' ' -f1)"
          sha_x64="$(sha256sum "$work/$x64_dmg" | cut -d' ' -f1)"

          node scripts/generate-homebrew-cask.mjs \
            --tag "$TAG" \
            --app-version "$APP_VERSION" \
            --sha-arm "$sha_arm" \
            --sha-x64 "$sha_x64" \
            > "$work/memry.rb"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/memrynote/homebrew-tap.git" \
            "$work/tap"
          cp "$work/memry.rb" "$work/tap/Casks/memry.rb"

          cd "$work/tap"
          git config user.name "memry-release-bot"
          git config user.email "release-bot@memrynote.com"
          git add Casks/memry.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date for ${TAG}."
          else
            git commit -m "chore: bump memry cask to ${TAG}"
            git push
          fi
