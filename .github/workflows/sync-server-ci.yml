name: Sync Server CI

on:
  pull_request:
  push:
    # Branch filter keeps `push` off gh-readonly-queue/* refs, where it would share a concurrency
    # group with the merge_group run and cancel it, ejecting the PR from the queue.
    branches:
      - main
      - feat/tauri-v2
    paths:
      - 'apps/sync-server/**'
      - 'packages/contracts/**'
      - 'packages/rpc/**'
      - 'packages/shared/**'
      - 'packages/sync-core/**'
      - 'tests/sync-harness/**'
      # The attachment client is exercised against the real Worker by the
      # integration spec below, so a client-side change must re-run this job.
      # http-client.ts owns binaryFetch and AttachmentTooLargeError, which the
      # spec exercises just as directly as attachments.ts itself.
      - 'apps/desktop/src/main/sync/attachments.ts'
      - 'apps/desktop/src/main/sync/attachments.integration.test.ts'
      - 'apps/desktop/src/main/sync/http-client.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/sync-server-ci.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  SKIP_ELECTRON_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Applies the path filter that used to sit on `pull_request`, in a job, so the workflow always runs
  # and the gate always reports. Pushes keep their own `paths`; every other event outputs true.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(apps/sync-server/|packages/(contracts|rpc|shared|sync-core)/|tests/sync-harness/|apps/desktop/src/main/sync/(attachments\.ts|attachments\.integration\.test\.ts|http-client\.ts)$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/sync-server-ci\.yml$)'

  sync-server:
    name: Typecheck, test, and Worker bundle
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.run == 'true' || needs.changes.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: &lean-checkout
          # Bounded checkout: one commit, blobless, and without the ~1.6 GB of marketing media that
          # no job reads (the full-tree checkout took 2 to 22 minutes in a busy hour and consumed the
          # job timeout). Text under marketing/ stays, so lint and format still see it. Other media
          # stay: builds need them. `/*` first, then the exclusions.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**/*.gif
            !/marketing/**/*.jpeg
            !/marketing/**/*.jpg
            !/marketing/**/*.mov
            !/marketing/**/*.mp3
            !/marketing/**/*.mp4
            !/marketing/**/*.png
            !/marketing/**/*.wav
            !/marketing/**/*.webm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared packages
        run: pnpm typecheck:packages

      - name: Typecheck sync-server
        run: pnpm typecheck:sync-server

      - name: Test sync-server
        run: pnpm test:sync-server

      - name: Build sync-harness worker
        run: pnpm --filter @memry/sync-harness build:worker

      - name: Run sync protocol harness
        run: pnpm --filter @memry/sync-harness test

      # Real client against the real Worker (miniflare + real D1 + real R2).
      # Both sides' unit suites mock this seam and stayed green through a 58-day
      # attachment upload outage, so this is the job that actually covers it.
      # Needs no Electron binary and no display server (the spec injects fetchFn
      # and stubs the electron import), and runs in seconds.
      - name: Run attachment client/server integration spec
        run: |
          pnpm --filter @memry/desktop exec vitest run \
            --config config/vitest.config.ts \
            --project main-integration

      - name: Validate Worker bundle
        run: pnpm --filter @memry/sync-server exec wrangler deploy --dry-run --outdir .wrangler/ci --env staging

  # The one check name a ruleset requires for this workflow (merge queue, #3517). Matrix legs and
  # fast/full tiers change which jobs exist; this name does not. A skipped job counts as passed.
  # Runs only for feat/tauri-v2 and the merge queue, so main and its PRs see no new check.
  gate:
    name: Sync Server CI gate
    needs: [changes, sync-server]
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/tauri-v2' || github.ref == 'refs/heads/feat/tauri-v2') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DETECT_RESULT: ${{ needs.changes.result }}
        run: |
          echo "needed job results: $RESULTS"
          # A skipped detection job (a noop `labeled` or `opened` run) must not read as a pass.
          if [ "$DETECT_RESULT" != success ]; then echo "::error::changes job result was $DETECT_RESULT"; exit 1; fi
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
