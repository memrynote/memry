name: Sync Server CI

on:
  pull_request:
  push:
    # Branch filter keeps `push` off gh-readonly-queue/* refs, where it would share a concurrency
    # group with the merge_group run and cancel it, ejecting the PR from the queue.
    branches:
      - main
      - feat/tauri-v2
    paths:
      - 'apps/sync-server/**'
      - 'packages/contracts/**'
      - 'packages/rpc/**'
      - 'packages/shared/**'
      - 'packages/sync-core/**'
      - 'tests/sync-harness/**'
      # The harness runs the core device (`memry`) against the Worker (#5232).
      - 'crates/memry-core/**'
      - 'crates/memry-cli/**'
      - 'crates/Cargo.*'
      - 'crates/rust-toolchain.toml'
      # The attachment client is exercised against the real Worker by the
      # integration spec below, so a client-side change must re-run this job.
      # http-client.ts owns binaryFetch and AttachmentTooLargeError, which the
      # spec exercises just as directly as attachments.ts itself.
      - 'apps/desktop/src/main/sync/attachments.ts'
      - 'apps/desktop/src/main/sync/attachments.integration.test.ts'
      - 'apps/desktop/src/main/sync/http-client.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/sync-server-ci.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  SKIP_ELECTRON_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The one check name a ruleset requires for this workflow (merge queue, #3517). It is the only
  # job: it detects changed paths, then runs the work or skips it. A job with no work steps run
  # still passes, so a PR that touches no protected path reports green. Every trigger runs it, so
  # PRs into main and pushes also see this name; main requires no checks.
  gate:
    name: Sync Server CI gate
    runs-on: ubuntu-latest
    # 40: the job builds the core device (memry-cli) for the harness.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The paths action lives in the repo, so a minimal checkout comes first. The full checkout
      # below runs only when the pull request touches a protected path.
      - name: Checkout the paths action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      # Replaces the `pull_request` path filter: a filtered workflow never runs, so a required
      # gate would never report. Every event other than `pull_request` outputs true.
      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(apps/sync-server/|packages/(contracts|rpc|shared|sync-core)/|tests/sync-harness/|crates/(memry-core|memry-cli)/|crates/Cargo\.[^/]+$|crates/rust-toolchain\.toml$|apps/desktop/src/main/sync/(attachments\.ts|attachments\.integration\.test\.ts|http-client\.ts)$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/sync-server-ci\.yml$)'

      - name: Checkout
        if: steps.paths.outputs.changed == 'true'
        uses: actions/checkout@v6
        with:
          # Bounded checkout: a blob filter plus sparse patterns, no history. Of the ~2 GB of blobs,
          # ~1.6 GB is marketing/ media that no job reads; a full-tree checkout took 2 to 22 minutes
          # in a busy hour and consumed the job timeout. marketing/ keeps only the file types
          # lint and format cover (the later patterns win); a new text type there that a job
          # must read goes in this list. Media elsewhere stays: builds need it. The secret scan in
          # security-ci.yml deliberately keeps its own list (every media extension, repo-wide).
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**
            /marketing/**/*.js
            /marketing/**/*.jsx
            /marketing/**/*.mjs
            /marketing/**/*.cjs
            /marketing/**/*.ts
            /marketing/**/*.tsx
            /marketing/**/*.mts
            /marketing/**/*.cts
            /marketing/**/*.json
            /marketing/**/*.jsonc
            /marketing/**/*.md
            /marketing/**/*.mdx
            /marketing/**/*.yml
            /marketing/**/*.yaml
            /marketing/**/*.css
            /marketing/**/*.html

      - name: Setup pnpm
        if: steps.paths.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.paths.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        if: steps.paths.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared packages
        if: steps.paths.outputs.changed == 'true'
        # Turbo remote cache (tools/turbo-cache), read-only: a hit replays a typecheck the push-to-feat
        # writer ran on the same inputs. No remote cache when TURBO_API or the signature key is unset,
        # and none for a fork's pull request.
        env:
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ vars.TURBO_API != '' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.TURBO_READ_TOKEN || '' }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: local:rw,remote:r
        run: pnpm typecheck:packages

      - name: Typecheck sync-server
        if: steps.paths.outputs.changed == 'true'
        run: pnpm typecheck:sync-server

      - name: Test sync-server
        if: steps.paths.outputs.changed == 'true'
        run: pnpm test:sync-server

      - name: Build sync-harness worker
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @memry/sync-harness build:worker

      # The core device the harness drives (`crates/memry-cli`, #5232). Same
      # toolchain pin as rust-ci.yml; the cache key names the runner image (#3846).
      - name: Setup Rust
        if: steps.paths.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - name: Runner image
        if: steps.paths.outputs.changed == 'true'
        id: image
        run: echo "os=${ImageOS:?ImageOS is unset, so the cargo cache key cannot name the image}" >> "$GITHUB_OUTPUT"

      # Saves only on refs/heads/feat/tauri-v2, like rust-ci.yml: every other ref restores what it saved
      # and writes nothing (per-ref saves filled the repo's 10 GB cache cap).
      - name: Cache cargo
        if: steps.paths.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: harness-${{ steps.image.outputs.os }}
          save-if: ${{ github.ref == 'refs/heads/feat/tauri-v2' }}

      - name: Build the core device
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @memry/sync-harness build:core

      - name: Run sync protocol harness
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @memry/sync-harness test

      # Real client against the real Worker (miniflare + real D1 + real R2).
      # Both sides' unit suites mock this seam and stayed green through a 58-day
      # attachment upload outage, so this is the job that actually covers it.
      # Needs no Electron binary and no display server (the spec injects fetchFn
      # and stubs the electron import), and runs in seconds.
      - name: Run attachment client/server integration spec
        if: steps.paths.outputs.changed == 'true'
        run: |
          pnpm --filter @memry/desktop exec vitest run \
            --config config/vitest.config.ts \
            --project main-integration

      - name: Validate Worker bundle
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @memry/sync-server exec wrangler deploy --dry-run --outdir .wrangler/ci --env staging
