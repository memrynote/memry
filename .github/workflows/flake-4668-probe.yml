name: flake-4668-probe
on:
  push:
    branches: [fix/4668-windows-trash-flake]
    paths: ['.github/workflows/flake-4668-probe.yml', '.github/probe-4668/**']
  workflow_dispatch:
jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    defaults:
      run:
        shell: bash
        working-directory: .github/probe-4668
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/probe-4668
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Build
        run: cargo build --release
      - name: Probe under CPU load
        run: |
          pids=""
          for k in 1 2 3 4 5 6; do yes >/dev/null & pids="$pids $!"; done
          ./target/release/probe4668.exe 240 2>&1 | grep -E "PROBE4668" | head -300
          kill $pids
