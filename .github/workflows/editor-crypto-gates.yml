# Editor & crypto gates.
#
# This workflow owns the gates that used to live in the deleted mobile CI
# workflow (and later in the retired iOS CI workflow), because none of them
# were ever platform-specific:
#   - crypto vector parity (the desktop proof suite the Rust core is measured against)
#   - the architecture boundary walk (non-Node client reachability)
#   - line ceilings
# The editor asset gates left with packages/editor-web. The workflow and job
# names stay as they were, so required status checks keep matching.
# If these paths stop triggering this workflow, the gates stop running
# anywhere — there is no second home for them.
name: Editor & crypto gates

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'apps/extension/src/**'
      - 'apps/landing/src/**'
      - 'packages/article-extract/**'
      - 'packages/contracts/**'
      - 'packages/editor-schema/**'
      - 'crates/**'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/check-line-ceilings.mjs'
      - '.github/workflows/editor-crypto-gates.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-crypto-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  SKIP_ELECTRON_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Applies the path filter that used to sit on `pull_request`, in a job, so the workflow always runs
  # and the gate always reports. Pushes keep their own `paths`; every other event outputs true.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(apps/extension/src/|apps/landing/src/|packages/(article-extract|contracts|editor-schema)/|crates/|scripts/check-architecture-boundaries\.js$|scripts/check-line-ceilings\.mjs$|\.github/workflows/editor-crypto-gates\.yml$)'

  inherited-gates:
    name: Editor and crypto gates
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.run == 'true' || needs.changes.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: &lean-checkout
          # Bounded checkout: a blob filter plus sparse patterns, no history. Of the ~2 GB of blobs,
          # ~1.6 GB is marketing/ media that no job reads; a full-tree checkout took 2 to 22 minutes
          # in a busy hour and consumed the job timeout. marketing/ keeps only the file types
          # lint and format cover (the later patterns win); a new text type there that a job
          # must read goes in this list. Media elsewhere stays: builds need it. The Secret scan job
          # in security-ci.yml deliberately keeps its own list (every media extension, repo-wide).
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**
            /marketing/**/*.js
            /marketing/**/*.jsx
            /marketing/**/*.mjs
            /marketing/**/*.cjs
            /marketing/**/*.ts
            /marketing/**/*.tsx
            /marketing/**/*.mts
            /marketing/**/*.cts
            /marketing/**/*.json
            /marketing/**/*.jsonc
            /marketing/**/*.md
            /marketing/**/*.mdx
            /marketing/**/*.yml
            /marketing/**/*.yaml
            /marketing/**/*.css
            /marketing/**/*.html

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vectors the Rust core must reproduce byte for byte.
      - name: Crypto parity vectors (desktop proof suite)
        run: pnpm --filter @memry/contracts test -- src/__tests__/crypto-vectors.test.ts

      # This is the ONLY place this gate runs in CI — no husky hook, no other
      # workflow. It keeps node builtins out of the non-Node client graph
      # (the extension, the landing site, and the packages they pull in), and it
      # deliberately outlived the mobile shell and the WebView editor; do not
      # drop it with a platform CI again.
      - name: Architecture boundaries (non-Node client reachability)
        run: pnpm check:architecture

      - name: Line ceilings
        run: node scripts/check-line-ceilings.mjs

  # The one check name a ruleset requires for this workflow (merge queue, #3517). Matrix legs and
  # fast/full tiers change which jobs exist; this name does not. A skipped job counts as passed.
  # Runs only for feat/tauri-v2 and the merge queue, so main and its PRs see no new check.
  gate:
    name: Editor crypto CI gate
    needs: [changes, inherited-gates]
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/tauri-v2' || github.ref == 'refs/heads/feat/tauri-v2') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DETECT_RESULT: ${{ needs.changes.result }}
        run: |
          echo "needed job results: $RESULTS"
          # A skipped detection job (a noop `labeled` or `opened` run) must not read as a pass.
          if [ "$DETECT_RESULT" != success ]; then echo "::error::changes job result was $DETECT_RESULT"; exit 1; fi
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
