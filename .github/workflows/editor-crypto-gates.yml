# Editor & crypto gates.
#
# This workflow owns the gates that used to live in the deleted mobile CI
# workflow (and later in the retired iOS CI workflow), because none of them
# were ever platform-specific:
#   - crypto vector parity (the desktop proof suite the Rust core is measured against)
#   - the architecture boundary walk (non-Node client reachability)
#   - line ceilings
# The editor asset gates left with packages/editor-web. The required check name
# `Editor crypto CI gate` stays, so required status checks keep matching.
# If these paths stop triggering this workflow, the gates stop running
# anywhere — there is no second home for them.
name: Editor & crypto gates

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'apps/extension/src/**'
      - 'apps/landing/src/**'
      - 'packages/article-extract/**'
      - 'packages/contracts/**'
      - 'packages/editor-schema/**'
      - 'crates/**'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/check-line-ceilings.mjs'
      - '.github/workflows/editor-crypto-gates.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-crypto-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  SKIP_ELECTRON_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The one check name a ruleset requires for this workflow (merge queue, #3517). It is the only
  # job: it detects changed paths, then runs the work or skips it. A job with no work steps run
  # still passes, so a PR that touches no protected path reports green. Every trigger runs it, so
  # PRs into main and pushes also see this name; main requires no checks.
  gate:
    name: Editor crypto CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The paths action lives in the repo, so a minimal checkout comes first. The full checkout
      # below runs only when the pull request touches a protected path.
      - name: Checkout the paths action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      # Replaces the `pull_request` path filter: a filtered workflow never runs, so a required
      # gate would never report. Every event other than `pull_request` outputs true.
      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(apps/extension/src/|apps/landing/src/|packages/(article-extract|contracts|editor-schema)/|crates/|scripts/check-architecture-boundaries\.js$|scripts/check-line-ceilings\.mjs$|\.github/workflows/editor-crypto-gates\.yml$)'

      - name: Checkout
        if: steps.paths.outputs.changed == 'true'
        uses: actions/checkout@v6
        with:
          # Bounded checkout: a blob filter plus sparse patterns, no history. Of the ~2 GB of blobs,
          # ~1.6 GB is marketing/ media that no job reads; a full-tree checkout took 2 to 22 minutes
          # in a busy hour and consumed the job timeout. marketing/ keeps only the file types
          # lint and format cover (the later patterns win); a new text type there that a job
          # must read goes in this list. Media elsewhere stays: builds need it. The secret scan in
          # security-ci.yml deliberately keeps its own list (every media extension, repo-wide).
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**
            /marketing/**/*.js
            /marketing/**/*.jsx
            /marketing/**/*.mjs
            /marketing/**/*.cjs
            /marketing/**/*.ts
            /marketing/**/*.tsx
            /marketing/**/*.mts
            /marketing/**/*.cts
            /marketing/**/*.json
            /marketing/**/*.jsonc
            /marketing/**/*.md
            /marketing/**/*.mdx
            /marketing/**/*.yml
            /marketing/**/*.yaml
            /marketing/**/*.css
            /marketing/**/*.html

      - name: Setup pnpm
        if: steps.paths.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.paths.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        if: steps.paths.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # The vectors the Rust core must reproduce byte for byte.
      - name: Crypto parity vectors (desktop proof suite)
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @memry/contracts test -- src/__tests__/crypto-vectors.test.ts

      # This is the ONLY place this gate runs in CI — no husky hook, no other
      # workflow. It keeps node builtins out of the non-Node client graph
      # (the extension, the landing site, and the packages they pull in), and it
      # deliberately outlived the mobile shell and the WebView editor; do not
      # drop it with a platform CI again.
      - name: Architecture boundaries (non-Node client reachability)
        if: steps.paths.outputs.changed == 'true'
        run: pnpm check:architecture

      - name: Line ceilings
        if: steps.paths.outputs.changed == 'true'
        run: node scripts/check-line-ceilings.mjs
