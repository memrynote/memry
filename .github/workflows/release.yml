name: Release (Stable)

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-stable-main
  cancel-in-progress: false

jobs:
  version:
    name: Compute stable version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      display_version: ${{ steps.metadata.outputs.display_version }}
      release_asset_version: ${{ steps.metadata.outputs.release_asset_version }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve release metadata
        id: metadata
        run: |
          git fetch --tags --force
          git tag --list > existing-tags.txt
          git tag --points-at HEAD > current-tags.txt

          node scripts/desktop-release-metadata.mjs \
            --resolve \
            --date "$(date -u +%F)" \
            --existing-tags-file existing-tags.txt \
            --current-tags-file current-tags.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or reuse release tag
        run: |
          tag="${{ steps.metadata.outputs.release_tag }}"
          head_sha="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "::error::Release tag $tag already exists at $tag_sha, not HEAD $head_sha"
              exit 1
            fi

            echo "Reusing release tag $tag at HEAD"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Summary
        run: |
          echo "### Stable version: \`${{ steps.metadata.outputs.display_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "App version: \`${{ steps.metadata.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release asset version: \`${{ steps.metadata.outputs.release_asset_version }}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: mac x64
            platform: mac
            arch: x64
            os: macos-15-intel
            artifact_name: release-mac-x64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --x64 --publish never
          - label: mac arm64
            platform: mac
            arch: arm64
            os: macos-15
            artifact_name: release-mac-arm64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --arm64 --publish never
          - label: win x64
            platform: win
            arch: x64
            os: windows-latest
            artifact_name: release-win
            build_command: node apps/desktop/scripts/build-packaged-app.js --win --x64 --publish never
          - label: linux x64
            platform: linux
            arch: x64
            os: ubuntu-latest
            artifact_name: release-linux
            build_command: node apps/desktop/scripts/build-packaged-app.js --linux AppImage deb --x64 --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Verify mac signing certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${CSC_LINK:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 secret is empty"
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD secret is empty"
            exit 1
          fi

          echo "CSC_LINK base64 length: ${#CSC_LINK}"

          tmp_p12="$(mktemp).p12"
          tmp_pem="$(mktemp).pem"
          err_log="$(mktemp).log"

          if ! printf '%s' "$CSC_LINK" | base64 -d > "$tmp_p12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64. Re-encode the .p12 with: base64 -i Cert.p12 | pbcopy"
            exit 1
          fi

          decoded_size="$(wc -c < "$tmp_p12" | tr -d ' ')"
          echo "Decoded P12 size: ${decoded_size} bytes"
          if [ "$decoded_size" -lt 100 ]; then
            echo "::error::Decoded P12 is suspiciously small. Likely corrupt base64."
            exit 1
          fi

          if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes \
              -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>"$err_log"; then
            if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes -legacy \
                -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>>"$err_log"; then
              echo "::error::Failed to decrypt P12 with CSC_KEY_PASSWORD. Likely wrong password or corrupt P12."
              cat "$err_log"
              exit 1
            fi
            echo "::notice::P12 decrypted via -legacy provider (RC2-40 PBE). Modern Keychain re-export recommended."
          fi

          subject="$(openssl x509 -in "$tmp_pem" -noout -subject)"
          echo "Cert subject: $subject"
          openssl x509 -in "$tmp_pem" -noout -dates
          openssl x509 -in "$tmp_pem" -noout -issuer

          if echo "$subject" | grep -q "Developer ID Application"; then
            echo "::notice::Cert is Developer ID Application. Correct for DMG distribution + notarization."
          else
            echo "::error::Cert is NOT Developer ID Application."
            echo "::error::Found: $subject"
            echo "::error::Notarization will reject. Re-export 'Developer ID Application' from Keychain Access (right-click -> Export -> .p12)."
            exit 1
          fi

          rm -f "$tmp_p12" "$tmp_pem" "$err_log"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set release version
        run: node scripts/set-desktop-version.mjs "${{ needs.version.outputs.app_version }}"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: |
          pnpm --filter @memry/desktop repair:links
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Package desktop artifacts
        run: ${{ matrix.build_command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          DEBUG: ${{ matrix.platform == 'mac' && 'electron-builder,electron-builder:*,electron-osx-sign*,electron-notarize*' || '' }}

      - name: Check packaged runtime
        if: matrix.platform == 'mac'
        run: pnpm --filter @memry/desktop check:packaged-runtime

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/dist/**
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release (stable)
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge mac updater metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'pathname'

          root = Pathname.new('artifacts')
          metadata_files = Dir[root.join('**', 'latest-mac.yml').to_s]

          exit 0 if metadata_files.length <= 1

          payloads = metadata_files.map { |file| [file, YAML.load_file(file) || {}] }
          merged_files = payloads.flat_map do |_, data|
            files = data['files']
            next files if files.is_a?(Array) && !files.empty?

            if data['path'] && data['sha512']
              [{ 'url' => data['path'], 'sha512' => data['sha512'] }]
            else
              []
            end
          end

          merged_files.uniq! { |entry| [entry['url'], entry['sha512']] }
          raise 'No mac update files found to merge' if merged_files.empty?

          base = payloads.first.last
          preferred = merged_files.find { |entry| entry['url'].include?('x64') && entry['url'].end_with?('.zip') } ||
            merged_files.find { |entry| entry['url'].end_with?('.zip') } ||
            merged_files.first

          base['files'] = merged_files
          base['path'] = preferred['url']
          base['sha512'] = preferred['sha512']

          metadata_files.each { |file| File.delete(file) }
          File.write(root.join('latest-mac.yml'), YAML.dump(base))
          RUBY

      - name: Collect release assets
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          RELEASE_ASSET_VERSION: ${{ needs.version.outputs.release_asset_version }}
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            -not -path '*/win-unpacked/*' \
            -not -path '*/linux-unpacked/*' \
            -not -path '*.app/*' \
            \( \
              -iname 'memry-*.dmg' \
              -o -iname 'memry-*.dmg.blockmap' \
              -o -iname 'memry-*.zip' \
              -o -iname 'memry-*.zip.blockmap' \
              -o -iname 'memry-*-setup.exe' \
              -o -iname 'memry-*-setup.exe.blockmap' \
              -o -iname 'memry-*.AppImage' \
              -o -iname 'memry-*.deb' \
              -o -name 'latest*.yml' \
            \) \
            -print0 | while IFS= read -r -d '' file; do
              filename="$(basename "$file")"
              filename="${filename//$APP_VERSION/$RELEASE_ASSET_VERSION}"

              cp "$file" "release-assets/$filename"
            done

          ruby <<'RUBY'
          require 'yaml'

          app_version = ENV.fetch('APP_VERSION')
          asset_version = ENV.fetch('RELEASE_ASSET_VERSION')

          Dir['release-assets/latest*.yml'].each do |path|
            data = YAML.load_file(path) || {}
            rewrite = ->(value) { value.is_a?(String) ? value.gsub(app_version, asset_version) : value }

            data['path'] = rewrite.call(data['path'])
            if data['files'].is_a?(Array)
              data['files'].each do |entry|
                next unless entry.is_a?(Hash)

                entry['url'] = rewrite.call(entry['url'])
              end
            end

            File.write(path, YAML.dump(data))
          end
          RUBY

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" -eq 0 ]; then
            echo "No release assets collected"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -print | sort

      - name: Build stable-latest.json
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 <<'PY'
          import glob
          import json
          import os
          import sys
          from datetime import datetime, timezone

          app_version = os.environ['APP_VERSION']
          display_version = os.environ['DISPLAY_VERSION']
          tag = os.environ['TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, repo_name = repo.split('/', 1)
          release_base_url = f'https://github.com/{repo}/releases/download/{tag}'
          pages_url = f'https://{owner}.github.io/{repo_name}/'

          def pick(label, patterns):
              matches = []
              for pattern in patterns:
                  matches.extend(glob.glob(os.path.join('release-assets', pattern)))
              matches = sorted(set(matches))
              if not matches:
                  print(f'::error::Missing required {label}: {", ".join(patterns)}', file=sys.stderr)
                  raise SystemExit(1)
              return os.path.basename(matches[0])

          def asset_url(filename):
              return f'{release_base_url}/{filename}'

          latest_mac = pick('mac updater metadata', ['latest-mac.yml'])
          latest_win = pick('windows updater metadata', ['latest.yml'])
          latest_linux = pick('linux updater metadata', ['latest-linux.yml'])
          arm_dmg = pick('mac arm64 dmg', ['*arm64*.dmg'])
          arm_zip = pick('mac arm64 updater zip', ['*arm64*.zip'])
          x64_dmg = pick('mac x64 dmg', ['*x64*.dmg'])
          x64_zip = pick('mac x64 updater zip', ['*x64*.zip'])
          win_installer = pick('windows installer', ['*-setup.exe'])
          linux_appimage = pick('linux appimage', ['*.AppImage'])
          linux_deb = pick('linux deb', ['*.deb'])

          payload = {
              'version': display_version,
              'app_version': app_version,
              'notes': f'Stable release. See {pages_url} for full release notes.',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'darwin-aarch64': {
                      'url': asset_url(arm_zip),
                      'download_url': asset_url(arm_dmg),
                      'metadata_url': asset_url(latest_mac),
                  },
                  'darwin-x86_64': {
                      'url': asset_url(x64_zip),
                      'download_url': asset_url(x64_dmg),
                      'metadata_url': asset_url(latest_mac),
                  },
                  'linux-x86_64': {
                      'url': asset_url(linux_appimage),
                      'download_url': asset_url(linux_deb),
                      'metadata_url': asset_url(latest_linux),
                  },
                  'windows-x86_64': {
                      'url': asset_url(win_installer),
                      'download_url': asset_url(win_installer),
                      'metadata_url': asset_url(latest_win),
                  },
              },
          }

          with open('release-assets/stable-latest.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')

          print(json.dumps(payload, indent=2))
          PY

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" > release_notes.md
          else
            PREV_TAG=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags/v20* refs/tags/stable-v* | grep -vx "$TAG" | head -n 1 || echo "")
            if [ -z "$PREV_TAG" ]; then
              NOTES=$(git log --oneline --no-merges -20)
            else
              NOTES=$(git log --oneline --no-merges "${PREV_TAG}..${TAG}")
            fi
            {
              echo "## What's Changed"
              echo ""
              echo "$NOTES" | while IFS= read -r line; do echo "- $line"; done
            } > release_notes.md
          fi
          {
            echo ""
            echo "---"
            echo "**Stable release - published from \`main\`**"
            echo ""
            echo "**Includes macOS (Apple Silicon and Intel), Windows x64, and Linux x64 bundles**"
            echo ""
            echo "*Built from \`$(git rev-parse --short "$TAG")\` on $(date -u +%Y-%m-%d)*"
          } >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.release_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release-assets/*

  pages:
    name: Update release history page
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release history page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p _site/stable/download _site/release-notes
          if [ -d release-notes ]; then cp release-notes/*.md _site/release-notes/ 2>/dev/null || true; fi
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name,publishedAt > _site/releases.json
          gh release download --repo ${{ github.repository }} "$TAG" --pattern "stable-latest.json" --output _site/stable/latest.json
          cp _site/stable/latest.json _site/latest.json

          python3 <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          site = Path('_site')
          repo = os.environ['GITHUB_REPOSITORY']
          releases = json.loads((site / 'releases.json').read_text(encoding='utf-8'))
          latest = json.loads((site / 'stable/latest.json').read_text(encoding='utf-8'))

          def page(title, body):
              return f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{html.escape(title)}</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #18181b; background: #fafafa; }}
              main {{ max-width: 920px; margin: 0 auto; padding: 48px 20px; }}
              h1 {{ font-size: 40px; line-height: 1.1; margin: 0 0 12px; }}
              h2 {{ margin-top: 36px; }}
              a {{ color: #155dfc; text-decoration: none; }}
              a:hover {{ text-decoration: underline; }}
              .muted {{ color: #71717a; }}
              .grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 24px; }}
              .card {{ border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; padding: 16px; }}
              .release {{ border-top: 1px solid #e4e4e7; padding: 18px 0; }}
              code {{ background: #f4f4f5; border-radius: 4px; padding: 2px 5px; }}
            </style>
          </head>
          <body>
            <main>{body}</main>
          </body>
          </html>
          '''

          platforms = latest.get('platforms', {})
          cards = []
          labels = {
              'darwin-aarch64': 'macOS Apple Silicon',
              'darwin-x86_64': 'macOS Intel',
              'windows-x86_64': 'Windows x64',
              'linux-x86_64': 'Linux x64',
          }
          for key, label in labels.items():
              info = platforms.get(key, {})
              primary = info.get('download_url') or info.get('url')
              updater = info.get('metadata_url')
              if not primary:
                  continue
              updater_link = f'<p><a href="{html.escape(updater)}">Updater metadata</a></p>' if updater else ''
              cards.append(f'''<section class="card">
                <h2>{html.escape(label)}</h2>
                <p><a href="{html.escape(primary)}">Download</a></p>
                {updater_link}
              </section>''')

          download_body = f'''<h1>Memry {html.escape(latest.get('version', ''))}</h1>
          <p class="muted">Stable desktop release</p>
          <div class="grid">{''.join(cards)}</div>
          <p><a href="../../latest.json">Latest JSON</a></p>'''
          (site / 'stable/download/index.html').write_text(page('Memry Download', download_body), encoding='utf-8')
          (site / 'download').mkdir(exist_ok=True)
          (site / 'download/index.html').write_text(page('Memry Download', download_body), encoding='utf-8')

          release_items = []
          for release in releases[:50]:
              tag_name = release.get('tagName') or release.get('tag_name') or ''
              name = html.escape(release.get('name') or tag_name or 'Release')
              url = html.escape(f'https://github.com/{repo}/releases/tag/{tag_name}' if tag_name else '#')
              published = html.escape(release.get('published_at') or release.get('publishedAt') or '')
              release_items.append(f'''<article class="release">
                <h2><a href="{url}">{name}</a></h2>
                <p class="muted">{published}</p>
              </article>''')

          history_body = f'''<h1>Memry Releases</h1>
          <p><a href="./download/">Download latest stable release</a></p>
          {''.join(release_items)}'''
          (site / 'index.html').write_text(page('Memry Releases', history_body), encoding='utf-8')
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          commit_message: 'Update release history for ${{ needs.version.outputs.tag }}'
