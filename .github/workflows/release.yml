name: Desktop Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach assets for, e.g. v2026.4.28.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-assets-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  prepare:
    name: Prepare published release metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      checkout_ref: ${{ steps.refs.outputs.checkout_ref }}
      release_date: ${{ steps.metadata.outputs.release_date }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.release.tag_name }}

      - name: Resolve checkout ref
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve release metadata
        id: metadata
        run: |
          node scripts/desktop-release-metadata.mjs \
            --from-tag \
            --tag "${{ github.event.release.tag_name || inputs.release_tag }}" \
            --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac x64
            platform: mac
            arch: x64
            os: macos-15-intel
            artifact_name: release-mac-x64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --x64 --publish never
          - label: mac arm64
            platform: mac
            arch: arm64
            os: macos-15
            artifact_name: release-mac-arm64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --arm64 --publish never
          - label: win x64
            platform: win
            arch: x64
            os: windows-latest
            artifact_name: release-win
            build_command: node apps/desktop/scripts/build-packaged-app.js --win --x64 --publish never
          - label: linux x64
            platform: linux
            arch: x64
            os: ubuntu-latest
            artifact_name: release-linux
            build_command: node apps/desktop/scripts/build-packaged-app.js --linux AppImage deb --x64 --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Verify mac signing certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${CSC_LINK:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 secret is empty"
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD secret is empty"
            exit 1
          fi

          echo "CSC_LINK base64 length: ${#CSC_LINK}"

          tmp_p12="$(mktemp).p12"
          tmp_pem="$(mktemp).pem"
          err_log="$(mktemp).log"

          if ! printf '%s' "$CSC_LINK" | base64 -d > "$tmp_p12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64. Re-encode the .p12 with: base64 -i Cert.p12 | pbcopy"
            exit 1
          fi

          decoded_size="$(wc -c < "$tmp_p12" | tr -d ' ')"
          echo "Decoded P12 size: ${decoded_size} bytes"
          if [ "$decoded_size" -lt 100 ]; then
            echo "::error::Decoded P12 is suspiciously small. Likely corrupt base64."
            exit 1
          fi

          if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes \
              -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>"$err_log"; then
            if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes -legacy \
                -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>>"$err_log"; then
              echo "::error::Failed to decrypt P12 with CSC_KEY_PASSWORD. Likely wrong password or corrupt P12."
              cat "$err_log"
              exit 1
            fi
            echo "::notice::P12 decrypted via -legacy provider (RC2-40 PBE). Modern Keychain re-export recommended."
          fi

          subject="$(openssl x509 -in "$tmp_pem" -noout -subject)"
          echo "Cert subject: $subject"
          openssl x509 -in "$tmp_pem" -noout -dates
          openssl x509 -in "$tmp_pem" -noout -issuer

          if echo "$subject" | grep -q "Developer ID Application"; then
            echo "::notice::Cert is Developer ID Application. Correct for DMG distribution + notarization."
          else
            echo "::error::Cert is NOT Developer ID Application."
            echo "::error::Found: $subject"
            echo "::error::Notarization will reject. Re-export 'Developer ID Application' from Keychain Access (right-click → Export → .p12)."
            exit 1
          fi

          rm -f "$tmp_p12" "$tmp_pem" "$err_log"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set release version
        run: node scripts/set-desktop-version.mjs "${{ needs.prepare.outputs.app_version }}"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: |
          pnpm --filter @memry/desktop repair:links
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Package desktop artifacts
        run: ${{ matrix.build_command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          DEBUG: ${{ matrix.platform == 'mac' && 'electron-builder,electron-builder:*,electron-osx-sign*,electron-notarize*' || '' }}

      - name: Check packaged runtime
        if: matrix.platform == 'mac'
        run: pnpm --filter @memry/desktop check:packaged-runtime

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/dist/**
          if-no-files-found: error

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge mac updater metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'pathname'

          root = Pathname.new('artifacts')
          metadata_files = Dir[root.join('**', 'latest-mac.yml').to_s]

          exit 0 if metadata_files.length <= 1

          payloads = metadata_files.map { |file| [file, YAML.load_file(file) || {}] }
          merged_files = payloads.flat_map do |_, data|
            files = data['files']
            next files if files.is_a?(Array) && !files.empty?

            if data['path'] && data['sha512']
              [{ 'url' => data['path'], 'sha512' => data['sha512'] }]
            else
              []
            end
          end

          merged_files.uniq! { |entry| [entry['url'], entry['sha512']] }
          raise 'No mac update files found to merge' if merged_files.empty?

          base = payloads.first.last
          preferred = merged_files.find { |entry| entry['url'].include?('x64') && entry['url'].end_with?('.zip') } ||
            merged_files.find { |entry| entry['url'].end_with?('.zip') } ||
            merged_files.first

          base['files'] = merged_files
          base['path'] = preferred['url']
          base['sha512'] = preferred['sha512']

          metadata_files.each { |file| File.delete(file) }
          File.write(root.join('latest-mac.yml'), YAML.dump(base))
          RUBY

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( \
              -name '*.AppImage' \
              -o -name '*.blockmap' \
              -o -name '*.deb' \
              -o -name '*.dmg' \
              -o -name '*.exe' \
              -o -name '*.yml' \
              -o -name '*.zip' \
            \) \
            -print0 | while IFS= read -r -d '' file; do
              cp "$file" "release-assets/$(basename "$file")"
            done

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" -eq 0 ]; then
            echo "No release assets collected"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.prepare.outputs.release_tag }}" release-assets/* --clobber
