name: Release

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: 'Draft release tag to publish. Leave blank to publish the latest date draft.'
        required: false
        type: string

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-stable-main
  cancel-in-progress: false

jobs:
  version:
    name: Resolve draft release
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      display_version: ${{ steps.metadata.outputs.display_version }}
      release_asset_version: ${{ steps.metadata.outputs.release_asset_version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          if [ -n "$INPUT_DRAFT_TAG" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_DRAFT_TAG" > draft-release.json
          else
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const releases = JSON.parse(readFileSync('releases.json', 'utf8'))
          const tagPattern = /^v20\d{2}-\d{2}-\d{2}(?:\.[2-9]\d*)?$/
          const draft = releases.find(
            (release) => release.draft && tagPattern.test(release.tag_name || '')
          )

          if (!draft) {
            throw new Error('No date draft release found. Merge to main first.')
          }

          writeFileSync('draft-release.json', JSON.stringify(draft, null, 2))
          NODE
          fi

          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs')

          const release = JSON.parse(readFileSync('draft-release.json', 'utf8'))
          const tagPattern = /^v20\d{2}-\d{2}-\d{2}(?:\.[2-9]\d*)?$/

          if (!release.draft) {
            throw new Error(`Release ${release.tag_name} is not a draft release`)
          }
          if (!tagPattern.test(release.tag_name || '')) {
            throw new Error(`Release ${release.tag_name} is not a Memry date draft`)
          }

          const outputs = {
            release_id: release.id,
            release_tag: release.tag_name,
            target_commitish: release.target_commitish || 'main'
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs)
              .map(([key, value]) => `${key}=${value}`)
              .join('\n') + '\n'
          )
          NODE

      - name: Resolve release commit
        id: commit
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force

          target="${{ steps.draft.outputs.target_commitish }}"
          if git rev-parse -q --verify "${target}^{commit}" >/dev/null; then
            release_sha="$(git rev-parse "${target}^{commit}")"
          elif git rev-parse -q --verify "origin/${target}^{commit}" >/dev/null; then
            release_sha="$(git rev-parse "origin/${target}^{commit}")"
          else
            git fetch origin "$target"
            release_sha="$(git rev-parse FETCH_HEAD)"
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $release_sha"

      - name: Resolve release metadata
        id: metadata
        run: |
          node scripts/desktop-release-metadata.mjs \
            --from-tag \
            --tag "${{ steps.draft.outputs.release_tag }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or reuse release tag
        run: |
          tag="${{ steps.metadata.outputs.release_tag }}"
          release_sha="${{ steps.commit.outputs.release_sha }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tag_sha" != "$release_sha" ]; then
              echo "::error::Release tag $tag already exists at $tag_sha, not release commit $release_sha"
              exit 1
            fi

            echo "Reusing release tag $tag at $release_sha"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$release_sha"
          git push origin "refs/tags/$tag"

      - name: Summary
        run: |
          echo "### Release: \`${{ steps.metadata.outputs.display_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "App version: \`${{ steps.metadata.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: mac x64
            platform: mac
            os: macos-15-intel
            artifact_name: release-mac-x64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --x64 --publish never
          - label: mac arm64
            platform: mac
            os: macos-15
            artifact_name: release-mac-arm64
            build_command: node apps/desktop/scripts/build-packaged-app.js --mac --arm64 --publish never
          - label: win x64
            platform: win
            os: windows-latest
            artifact_name: release-win
            build_command: node apps/desktop/scripts/build-packaged-app.js --win --x64 --publish never
          - label: linux x64
            platform: linux
            os: ubuntu-latest
            artifact_name: release-linux
            build_command: node apps/desktop/scripts/build-packaged-app.js --linux AppImage deb --x64 --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Verify mac signing certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${CSC_LINK:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 secret is empty"
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD secret is empty"
            exit 1
          fi

          tmp_p12="$(mktemp).p12"
          tmp_pem="$(mktemp).pem"
          err_log="$(mktemp).log"

          if ! printf '%s' "$CSC_LINK" | base64 -d > "$tmp_p12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64."
            exit 1
          fi

          if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes \
              -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>"$err_log"; then
            if ! openssl pkcs12 -in "$tmp_p12" -clcerts -nokeys -nodes -legacy \
                -passin "env:CSC_KEY_PASSWORD" -out "$tmp_pem" 2>>"$err_log"; then
              echo "::error::Failed to decrypt P12 with CSC_KEY_PASSWORD."
              cat "$err_log"
              exit 1
            fi
          fi

          subject="$(openssl x509 -in "$tmp_pem" -noout -subject)"
          echo "Cert subject: $subject"
          if ! echo "$subject" | grep -q "Developer ID Application"; then
            echo "::error::Cert is NOT Developer ID Application."
            exit 1
          fi

          rm -f "$tmp_p12" "$tmp_pem" "$err_log"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set release version
        run: node scripts/set-desktop-version.mjs "${{ needs.version.outputs.app_version }}"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: |
          pnpm --filter @memry/desktop repair:links
          pnpm --filter @memry/desktop exec electron-vite build

      - name: Package desktop artifacts
        run: ${{ matrix.build_command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          DEBUG: ${{ matrix.platform == 'mac' && 'electron-builder,electron-builder:*,electron-osx-sign*,electron-notarize*' || '' }}

      - name: Check packaged runtime
        if: matrix.platform == 'mac'
        run: pnpm --filter @memry/desktop check:packaged-runtime

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/dist/**
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge mac updater metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'pathname'

          root = Pathname.new('artifacts')
          metadata_files = Dir[root.join('**', 'latest-mac.yml').to_s]

          exit 0 if metadata_files.length <= 1

          payloads = metadata_files.map { |file| [file, YAML.load_file(file) || {}] }
          merged_files = payloads.flat_map do |_, data|
            files = data['files']
            next files if files.is_a?(Array) && !files.empty?

            if data['path'] && data['sha512']
              [{ 'url' => data['path'], 'sha512' => data['sha512'] }]
            else
              []
            end
          end

          merged_files.uniq! { |entry| [entry['url'], entry['sha512']] }
          raise 'No mac update files found to merge' if merged_files.empty?

          base = payloads.first.last
          preferred = merged_files.find { |entry| entry['url'].include?('x64') && entry['url'].end_with?('.zip') } ||
            merged_files.find { |entry| entry['url'].end_with?('.zip') } ||
            merged_files.first

          base['files'] = merged_files
          base['path'] = preferred['url']
          base['sha512'] = preferred['sha512']

          metadata_files.each { |file| File.delete(file) }
          File.write(root.join('latest-mac.yml'), YAML.dump(base))
          RUBY

      - name: Collect release assets
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          RELEASE_ASSET_VERSION: ${{ needs.version.outputs.release_asset_version }}
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            -not -path '*/win-unpacked/*' \
            -not -path '*/linux-unpacked/*' \
            -not -path '*.app/*' \
            \( \
              -iname 'memry-*.dmg' \
              -o -iname 'memry-*.dmg.blockmap' \
              -o -iname 'memry-*.zip' \
              -o -iname 'memry-*.zip.blockmap' \
              -o -iname 'memry-*-setup.exe' \
              -o -iname 'memry-*-setup.exe.blockmap' \
              -o -iname 'memry-*.AppImage' \
              -o -iname 'memry-*.deb' \
              -o -name 'latest*.yml' \
            \) \
            -print0 | while IFS= read -r -d '' file; do
              filename="$(basename "$file")"
              filename="${filename//$APP_VERSION/$RELEASE_ASSET_VERSION}"

              cp "$file" "release-assets/$filename"
            done

          ruby <<'RUBY'
          require 'yaml'

          app_version = ENV.fetch('APP_VERSION')
          asset_version = ENV.fetch('RELEASE_ASSET_VERSION')

          Dir['release-assets/latest*.yml'].each do |path|
            data = YAML.load_file(path) || {}
            rewrite = ->(value) { value.is_a?(String) ? value.gsub(app_version, asset_version) : value }

            data['path'] = rewrite.call(data['path'])
            if data['files'].is_a?(Array)
              data['files'].each do |entry|
                next unless entry.is_a?(Hash)

                entry['url'] = rewrite.call(entry['url'])
              end
            end

            File.write(path, YAML.dump(data))
          end
          RUBY

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" -eq 0 ]; then
            echo "No release assets collected"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.version.outputs.release_name }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F name="$RELEASE_NAME" \
            -F draft=false \
            -F prerelease=false \
            -F make_latest=true
