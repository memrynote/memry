name: Windows wiki-link repro

# Temporary. Runs the wiki-link revisit E2E on Windows against the build with
# the fix and the build with it switched off, side by side. Delete once the
# result is read.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  HUSKY: 0
  ELECTRON_DISABLE_SANDBOX: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  repro:
    name: wiki-link revisit (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [broken, fixed]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        shell: bash
        env:
          SKIP_ELECTRON_REBUILD: 1
        run: |
          for _ in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            sleep 20
          done
          exit 1

      - name: Rebuild native modules for Electron
        shell: bash
        working-directory: apps/desktop
        run: |
          node node_modules/@electron/rebuild/lib/cli.js -f \
            -o better-sqlite3,classic-level,keytar
          echo electron > node_modules/.native-build-target

      - name: Switch the fix off
        if: matrix.variant == 'broken'
        shell: bash
        run: |
          dir=apps/desktop/src/renderer/src/components/note/content-area
          file="$dir/hooks/use-editor-sync.ts"
          from='if (isYSyncRender(editor))'
          to='if (false \&\& isYSyncRender(editor))'
          sed -i "s/$from/$to/" "$file"
          if ! grep -q 'false && isYSyncRender(editor)' "$file"; then
            echo "::error::fix was not switched off"
            exit 1
          fi

      - name: Build desktop app
        shell: bash
        run: pnpm --filter @memry/desktop exec electron-vite build

      - name: Run wiki-link revisit E2E
        shell: bash
        run: |
          pnpm --filter @memry/desktop exec playwright test \
            --config config/playwright.config.ts \
            --retries=0 \
            tests/e2e/wiki-link-revisit.e2e.ts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-link-revisit-${{ matrix.variant }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
