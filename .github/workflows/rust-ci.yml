# Rust CI (spec 002-native-foundation-ios, train A0 / gate G2b).
#
# The regenerate-and-diff step over the generated Swift is this boundary's
# `pnpm ipc:check`: a change to the UniFFI surface that ships without rerunning
# build-xcframework.sh leaves Swift calling yesterday's ABI, which fails at
# runtime rather than at review.
name: Rust CI

on:
  # No `paths` filter on pull requests: a filtered workflow never runs, so `Rust CI gate`, which
  # main's ruleset requires, would never report and the PR could never merge. The `paths` job
  # decides whether the Rust jobs run; its include regex lists the same files as the push filter.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'packages/swift/**'
      - 'scripts/check-line-ceilings.mjs'
      - '.github/workflows/rust-ci.yml'
      - '.github/actions/paths-changed/**'
  # Main has no merge queue today. If it gets one, the gate reports there too, after every job ran.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  paths:
    name: Rust CI paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/paths-changed

      # true for every event but pull_request, and when the PR's file list cannot be read.
      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(crates/|packages/swift/|scripts/check-line-ceilings\.mjs$|\.github/workflows/rust-ci\.yml$|\.github/actions/paths-changed/)'

  lint-and-test:
    name: fmt, clippy, test
    needs: paths
    if: needs.paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      # rust-cache keys on job id + OS + arch, not the image. A cache built on a newer
      # `ubuntu-latest` (glibc 2.39+) was restored on ubuntu-22.04 and its build scripts failed
      # with `GLIBC_2.39 not found` (#3846). ImageOS (`ubuntu24`, `ubuntu26`) names the release.
      - name: Runner image
        id: image
        run: echo "os=${ImageOS:?ImageOS is unset, so the cargo cache key cannot name the image}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: ${{ steps.image.outputs.os }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Type-checks the ONNX Runtime binding, which host builds leave out.
      # A check never links, so no ONNX Runtime library is needed here.
      - name: Clippy (semantic feature)
        run: cargo clippy -p memry-core --all-targets --features semantic -- -D warnings

      - name: Test
        run: cargo test -p memry-core

      - name: Line ceilings
        working-directory: .
        run: node scripts/check-line-ceilings.mjs

  swift-bindings-fresh:
    name: Generated Swift bindings are current
    # Bindgen reads the UniFFI metadata out of the iOS device library, the same
    # slice build-xcframework.sh reads. The library is built without the
    # `semantic` feature: no UniFFI export sits behind it, and leaving it off
    # means this check needs no ONNX Runtime download (#5531), so a download
    # outage cannot hide drift. The XCFramework itself is built by
    # `xcframework` below.
    needs: paths
    if: needs.paths.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '26.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Select Xcode 26
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No Xcode 26 on this runner. Found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      # Run from crates/: uniffi's bindgen resolves `cargo metadata` from the
      # current directory.
      - name: Regenerate bindings
        working-directory: crates
        run: |
          cargo build -p memry-core --lib --target aarch64-apple-ios
          rm -rf target/bindings-check
          cargo run -p uniffi-bindgen-swift -- \
            generate \
            --library target/aarch64-apple-ios/debug/libmemry_core.a \
            --language swift \
            --out-dir target/bindings-check
          generated=../packages/swift/MemryCore/Sources/MemryCore/Generated
          rm -rf "$generated"
          mkdir -p "$generated"
          mv target/bindings-check/*.swift "$generated/"

      # status, not diff: a file bindgen added or stopped emitting is drift too.
      # --text: .gitattributes marks the Generated Swift `-diff`.
      - name: Fail if the committed bindings drifted
        run: |
          generated=packages/swift/MemryCore/Sources/MemryCore/Generated/
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            git status --short -- "$generated"
            git diff --text -- "$generated"
            echo "::error::Generated Swift bindings are stale. Run crates/memry-core/build-xcframework.sh and commit the result."
            exit 1
          fi

  xcframework:
    name: Build XCFramework
    # macOS: the XCFramework needs the iOS SDK. Built with `semantic`, so it
    # links ONNX Runtime exactly as the app does.
    needs: paths
    if: needs.paths.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # Glob, not a fixed path: the runner image names it Xcode_26.x.app and the
      # patch version moves. Failing loudly with the available list beats a bare
      # "invalid developer directory".
      - name: Select Xcode 26
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No Xcode 26 on this runner. Found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/memry/onnxruntime
          key: onnxruntime-${{ hashFiles('crates/memry-core/onnxruntime.lock') }}

      - name: Build XCFramework
        run: crates/memry-core/build-xcframework.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: MemryCoreFFI-xcframework
          path: packages/swift/MemryCore/MemryCoreFFI.xcframework
          retention-days: 7

  # The one check main's ruleset requires for this workflow (#5221). A skipped job counts as passed
  # for a required check, so the gate runs always() and needs every job: it passes when no Rust CI
  # path changed, and otherwise only when every job succeeded.
  gate:
    name: Rust CI gate
    needs: [paths, lint-and-test, swift-bindings-fresh, xcframework]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Rust job passed or no Rust CI path changed
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          CHANGED: ${{ needs.paths.outputs.changed }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "paths job: $PATHS_RESULT, changed: $CHANGED, needed job results: $RESULTS"
          if [ "$PATHS_RESULT" != success ]; then
            echo "::error::The Rust CI paths job did not succeed ($PATHS_RESULT)."
            exit 1
          fi
          if [ "$CHANGED" = false ]; then
            echo "No Rust CI path changed."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A Rust CI job did not succeed: $RESULTS"
              exit 1
            fi
          done
