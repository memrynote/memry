# Rust CI (spec 002-native-foundation-ios, train A0 / gate G2b).
#
# The regenerate-and-diff step over the generated Swift is this boundary's
# `pnpm ipc:check`: a change to the UniFFI surface that ships without rerunning
# build-xcframework.sh leaves Swift calling yesterday's ABI, which fails at
# runtime rather than at review.
name: Rust CI

on:
  pull_request:
    # `labeled` starts the full matrix for a PR into feat/tauri-v2 once `full-ci` is added; every
    # other labeled event skips all jobs, so PRs into main see no change.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - feat/tauri-v2
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/**'
      - 'tests/sync-harness/scripts/serve.ts'
      - 'tests/sync-harness/src/**'
      - 'apps/sync-server/**'
      - 'pnpm-lock.yaml'
      - 'packages/swift/**'
      - 'packages/contracts/test-vectors/**'
      - 'packages/article-extract/**'
      - 'scripts/check-line-ceilings.mjs'
      - 'scripts/check-test-timing*.mjs'
      - '.github/workflows/rust-ci.yml'
  # The merge queue (feat/tauri-v2) runs the full matrix on the merge-group commit; `paths` do not apply.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per workflow and ref; a PR with `full-ci` and the noop runs keep their own groups. A
  # workflow_dispatch on feat/tauri-v2 gets its own group so a manual Intel run is neither cancelled
  # by a push nor cancels one.
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}${{ ((github.event.action == 'labeled' && !(github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) || (github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && format('-noop-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/tauri-v2' && format('-dispatch-{0}', github.run_id) || (github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci') && '-full' || '')) }}
  # A burst of merges into feat/tauri-v2 checks only the newest head: a push there cancels the run
  # of the previous head. Every other ref behaves as before (main pushes cancelled before this change).
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Fixed proptest seed on PR, merge_group and push runs; the nightly workflow uses a random one.
  PROPTEST_RNG_SEED: '20261027'
  # Line tables keep file:line in panics and backtraces. Full debug info made the 280 test binaries
  # tens of GB (the Ubuntu disk ran out, #3638), slowed every link and doubled the cargo cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Tiering: a PR into feat/tauri-v2 runs the fast tier; `full-ci`, a push to feat/tauri-v2 and
  # workflow_dispatch run everything. Every other trigger gets full = tauri = swift = true.
  plan:
    name: CI tier
    if: (github.event.action != 'labeled' && !(github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) || (github.event.action == 'labeled' && github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.tier.outputs.full }}
      tauri: ${{ steps.tier.outputs.tauri }}
      swift: ${{ steps.tier.outputs.swift }}
      intel: ${{ steps.tier.outputs.intel }}
      macos: ${{ steps.tier.outputs.macos }}
      legs: ${{ steps.matrix.outputs.legs }}
      paths: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Decide tier
        id: tier
        uses: ./.github/actions/ci-tier
        with:
          token: ${{ github.token }}

      # Fast tier: Linux only; Windows runs in the merge queue, where a Windows-only failure ejects the
      # PR. Full adds Windows x64 and ARM, plus Apple Silicon unless the run is a merge-queue run
      # (macos=false) and Intel only where plan.intel is true (main, dispatch).
      - name: Build the OS matrix
        id: matrix
        env:
          FULL: ${{ steps.tier.outputs.full }}
          MACOS: ${{ steps.tier.outputs.macos }}
          INTEL: ${{ steps.tier.outputs.intel }}
        run: |
          os='["ubuntu-22.04"]'
          if [ "$FULL" = true ]; then
            os=$(jq -cn --arg macos "$MACOS" --arg intel "$INTEL" '
              ["ubuntu-22.04"]
              + (if $macos == "true" then ["macos-15"] else [] end)
              + (if $intel == "true" then ["macos-15-intel"] else [] end)
              + ["windows-2022","windows-11-arm"]')
          fi
          # Linux and Windows legs split in three jobs: `checks` (fmt, clippy, doctests, the live OS
          # seams, the release test) and the nextest suite in two hash partitions. The suite alone ran
          # 7 minutes of CPU-bound tests after a 2-minute build in one job. macOS legs stay one `all`
          # job each: that pool is the scarcest, and three jobs would hold three of its runners.
          legs=$(jq -cn --argjson os "$os" '[$os[] as $o
            | if ($o | startswith("macos")) then {os: $o, part: "all"}
              else ({os: $o, part: "checks"}, {os: $o, part: "tests", partition: "1/2"}, {os: $o, part: "tests", partition: "2/2"})
              end]')
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "Legs: $legs"

      # Replaces the `pull_request.paths` filter: a filtered workflow never runs, so its required gate
      # would never report. Pushes keep their own `paths`; every other event outputs true.
      - name: Detect changed paths
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          token: ${{ github.token }}
          include: '^(crates/|apps/desktop-tauri/|tests/sync-harness/scripts/serve\.ts$|tests/sync-harness/src/|apps/sync-server/|pnpm-lock\.yaml$|packages/swift/|packages/contracts/test-vectors/|packages/article-extract/|scripts/check-line-ceilings\.mjs$|scripts/check-test-timing(\.test)?\.mjs$|\.github/workflows/rust-ci\.yml$|\.github/actions/ort-static/)'

  lint-and-test:
    name: Rust ${{ matrix.part }}${{ matrix.partition && format(' {0}', matrix.partition) || '' }} (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Built by the plan job (see "Build the OS matrix"). The fallback is the fast tier, for a plan
        # job that failed. macOS is the scarcest runner pool: no Mac in the merge queue, Apple
        # Silicon from `full-ci` up and on a push to feat/tauri-v2, Intel only on main and dispatch.
        include: ${{ fromJSON(needs.plan.outputs.legs || '[{"os":"ubuntu-22.04","part":"checks"},{"os":"ubuntu-22.04","part":"tests","partition":"1/2"},{"os":"ubuntu-22.04","part":"tests","partition":"2/2"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: crates

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: &lean-checkout
          # Bounded checkout: a blob filter plus sparse patterns, no history. Of the ~2 GB of blobs,
          # ~1.6 GB is marketing/ media that no job reads; a full-tree checkout took 2 to 22 minutes
          # in a busy hour and consumed the job timeout. marketing/ keeps only the file types
          # lint and format cover (the later patterns win); a new text type there that a job
          # must read goes in this list. Media elsewhere stays: builds need it. The Secret scan job
          # in security-ci.yml deliberately keeps its own list (every media extension, repo-wide).
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/**
            /marketing/**/*.js
            /marketing/**/*.jsx
            /marketing/**/*.mjs
            /marketing/**/*.cjs
            /marketing/**/*.ts
            /marketing/**/*.tsx
            /marketing/**/*.mts
            /marketing/**/*.cts
            /marketing/**/*.json
            /marketing/**/*.jsonc
            /marketing/**/*.md
            /marketing/**/*.mdx
            /marketing/**/*.yml
            /marketing/**/*.yaml
            /marketing/**/*.css
            /marketing/**/*.html

      # Before the build, so it fails in seconds: a wall-clock upper bound in a test fails on a
      # loaded runner, not on slow code (two merge-queue ejections on 29 Oct).
      - name: No wall-clock upper bounds in tests
        if: matrix.part != 'tests' && runner.os == 'Linux'
        working-directory: .
        run: |
          node --test scripts/check-test-timing.test.mjs
          node scripts/check-test-timing.mjs

      # Linux linking needs tens of GB; the image ships ~20 GB of toolchains we never use.
      - name: Free disk space
        uses: ./.github/actions/free-disk

      # Tauri's webview and the keyring need these system libraries on Linux.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 12
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libsecret-1-dev libfontconfig1-dev patchelf gnome-keyring libsecret-tools dbus-x11

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        continue-on-error: true
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      # One retry: a stalled rustup download is cut at 5 min and run again.
      - name: Setup Rust (retry)
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      # Saves only on push, dispatch and PRs into main. A PR into feat/tauri-v2 and a merge-queue run
      # restore what the push to feat/tauri-v2 saved and write nothing (a save is 2-4 GB per job).
      - name: Cache cargo
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          workspaces: crates
          # The image in the key: rust-cache keys on job id + OS + arch only, so main's ubuntu-latest
          # (26.04) save restored here and its build scripts needed GLIBC_2.39 (#3846).
          # The two test partitions build the same binaries and share one entry.
          key: ${{ matrix.os }}-${{ matrix.part }}
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref != 'feat/tauri-v2') }}

      # A restore cut off at the step timeout can leave half an archive on disk. Start the
      # build cold rather than from files cargo might trust.
      - name: Drop a partial cargo cache
        if: steps.cargo-cache.outcome == 'failure'
        run: rm -rf target "$HOME/.cargo/registry/cache" "$HOME/.cargo/registry/index" "$HOME/.cargo/git/db"

      # memry-ml links ONNX Runtime statically. macOS x64, Windows and Linux x64 link the archive
      # of build-ort-static.yml (ORT_LIB_LOCATION); macOS arm64 downloads ort-sys's prebuilt one.
      - name: ONNX Runtime static library
        if: matrix.part != 'tests'
        uses: ./.github/actions/ort-static
        with:
          token: ${{ github.token }}

      - name: Format
        if: matrix.part != 'tests' && runner.os == 'Linux'
        run: cargo fmt --all --check

      # macos-15-intel runs tests only: the Apple Silicon runner already lints the same macOS
      # code, and Intel Mac runner slots are the scarcest.
      - name: Clippy
        if: matrix.part != 'tests' && (runner.os != 'Windows' && matrix.os != 'macos-15-intel')
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `crates/memry-cli/src/session.rs` imports `std::os::unix`, so memry-cli never builds on
      # Windows. The exclusion is recorded in crates/AGENTS.md.
      - name: Clippy (Windows, without memry-cli)
        if: matrix.part != 'tests' && runner.os == 'Windows'
        run: cargo clippy --workspace --exclude memry-cli --all-targets -- -D warnings

      # The e2e build (cargo feature `e2e`) is compiled only by Desktop Tauri CI, which does not
      # lint it; an unused import sat in its test commands unseen (#3933).
      - name: Clippy (memry-tauri, e2e feature)
        if: matrix.part != 'tests' && matrix.os != 'macos-15-intel'
        run: cargo clippy -p memry-tauri --features e2e --all-targets -- -D warnings

      # One nextest run over the three crates, with the markdown feature on for memry-core (memry-desktop
      # already turns it on, so the unified build is the same one). nextest skips doctests.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        if: matrix.part != 'checks'
        env:
          PARTITION: ${{ matrix.partition }}
        run: cargo nextest run -p memry-core -p memry-desktop -p memry-tauri -p memry-test-kit --no-fail-fast --features memry-core/markdown ${PARTITION:+--partition "hash:$PARTITION"}

      - name: Doctests
        if: matrix.part != 'tests'
        run: cargo test --doc -p memry-core -p memry-desktop -p memry-tauri --features memry-core/markdown

      # iOS links memry-core with no features; every target must still build that way.
      - name: Check memry-core (iOS feature set)
        if: matrix.part != 'tests'
        run: cargo check -p memry-core --all-targets

      # Electron profile readers against the live OS secret store (#3523). Each test creates its
      # own throw-away item under a test app name and removes it. macOS: a Keychain item named
      # `<test app> Safe Storage`. Windows: a real CryptProtectData round trip through `Local
      # State` and a keytar-style credential. The Windows legs decrypt with a key the test
      # wraps itself, so the result does not depend on the machine.
      # The live steps run under nextest's `live` profile with --no-capture: each test prints START
      # and its result, and a test that hangs is killed after 5 minutes (crates/.config/nextest.toml)
      # and named. Their passing runs take under 3 minutes, so the 10-minute step limit fails a hang
      # long before the job limit (#3907).
      - name: Electron profile readers, live OS secrets (macOS, Windows)
        if: matrix.part != 'tests' && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          MEMRY_LIVE_KEYTAR: '1'
        run: |
          if [ "${{ matrix.os }}" != "macos-15-intel" ]; then
            cargo clippy -p memry-desktop --features live-os-secrets --test electron_secrets_live -- -D warnings
          fi
          cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test electron_secrets_live

      # Linux: gnome-keyring unlocked under a private session bus, then a second run with no
      # session bus at all, where the reader must answer "missing" and create nothing.
      - name: Electron profile readers, live OS secrets (Linux)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cargo clippy -p memry-desktop --features live-os-secrets --test electron_secrets_live --test electron_secrets_locked -- -D warnings
          cargo nextest run -p memry-desktop --features live-os-secrets --test electron_secrets_live --test electron_secrets_locked --no-run
          dbus-run-session -- bash -c 'echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && MEMRY_LIVE_KEYTAR=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test electron_secrets_live'
          # A keyring that holds a keytar item but was never unlocked in this session (login without
          # PAM unlock): a cold gnome-keyring hides the item's attributes, and the listing must say
          # "denied", never "empty". The first session writes the item into an encrypted keyring, the
          # daemon is replaced by one that has no password, and no prompter answers the unlock.
          dbus-run-session -- bash -c '
            set -e
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            echo -n locked-value | secret-tool store --label keytar xdg:schema org.freedesktop.Secret.Generic service com.memry.sync account master-key
            pkill -x gnome-keyring-d
            sleep 1
            gnome-keyring-daemon --start --components=secrets >/dev/null
            MEMRY_LIVE_LOCKED_KEYRING=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test electron_secrets_locked
          '
          # Service stopped, in the SAME session as the keyring check: the reader is pointed at a
          # bus socket that does not exist, must say "missing", and must not have created an item
          # in the live keyring. A probe item first proves the search would show a memry-live item.
          dbus-run-session -- bash -c '
            set -e
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            echo -n probe | secret-tool store --label probe xdg:schema chrome_libsecret_os_crypt_password_v2 application memry-live-probe
            secret-tool search --all xdg:schema chrome_libsecret_os_crypt_password_v2 2>&1 | grep -q memry-live-probe
            secret-tool clear xdg:schema chrome_libsecret_os_crypt_password_v2 application memry-live-probe
            DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent MEMRY_LIVE_NO_SECRET_SERVICE=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test electron_secrets_live
            ! secret-tool search --all xdg:schema chrome_libsecret_os_crypt_password_v2 2>&1 | grep -q memry-live
          '

      # The desktop KeyringStore against the live OS keychain (#3532). The tests use their own
      # `e2e-live-*` device suffix and the `com.memrynote.memry.test` service and remove their items.
      # macOS: a throw-away keychain the next step creates, unlocks and makes the default (never the
      # login keychain). Windows: Credential Manager, including the 2560-byte
      # blob limit.
      - name: Unlocked keychain for the keychain seam (macOS)
        if: matrix.part != 'tests' && runner.os == 'macOS'
        run: |
          KC="$RUNNER_TEMP/memry-ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security default-keychain -d user -s "$KC"
          security list-keychains -d user -s "$KC"

      - name: Keychain seam, live OS secrets (macOS, Windows)
        if: matrix.part != 'tests' && runner.os != 'Linux'
        # A keychain access prompt never answers on a runner: fail fast instead of at the job limit.
        timeout-minutes: 10
        run: |
          if [ "${{ matrix.os }}" != "macos-15-intel" ]; then
            cargo clippy -p memry-desktop --features live-os-secrets --test keyring_live -- -D warnings
          fi
          cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live

      # Linux: an unlocked gnome-keyring under a private session bus; then a bus with no Secret
      # Service at all (every call must answer "locked" and store nothing); then a bus where the
      # daemon starts after the first call, which the next call must find. The two bus-less runs
      # use a bus config with no service directory, so D-Bus never activates gnome-keyring itself.
      - name: Keychain seam, live OS secrets (Linux)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cargo clippy -p memry-desktop --features live-os-secrets --test keyring_live -- -D warnings
          cargo nextest run -p memry-desktop --features live-os-secrets --test keyring_live --no-run
          dbus-run-session -- bash -c 'echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live'
          # The store's item in a keyring that is locked in this session (login without PAM unlock):
          # the item is hidden from every search, so the store must say "locked", never "no key".
          dbus-run-session -- bash -c '
            set -e
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            echo -n AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8= | secret-tool store --label memry-live service com.memrynote.memry username master-key-lockedrun
            pkill -x gnome-keyring-d
            sleep 1
            gnome-keyring-daemon --start --components=secrets >/dev/null
            MEMRY_LIVE_LOCKED_KEYRING=1 MEMRY_LIVE_LOCKED_SUFFIX=lockedrun cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live a_locked_keyring
          '
          # The store's item, its collection locked after it was written: the search shows it as
          # locked, the unlock prompt has no prompter and is dismissed, and get and delete say "locked".
          dbus-run-session -- bash -c '
            set -e
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            echo -n AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8= | secret-tool store --label memry-live service com.memrynote.memry username master-key-lockeditem
            gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.Lock "[objectpath \"/org/freedesktop/secrets/collection/login\"]" >/dev/null
            MEMRY_LIVE_LOCKED_ITEM=1 MEMRY_LIVE_LOCKED_SUFFIX=lockeditem cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live an_item_that_cannot
          '
          # The keyring daemon restarts under a running store: the next locked-collection check reconnects.
          dbus-run-session -- bash -c 'echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && MEMRY_LIVE_RESTART_DAEMON=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live a_keyring_daemon'
          cat > "$RUNNER_TEMP/bare-bus.conf" <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF
          dbus-run-session --config-file="$RUNNER_TEMP/bare-bus.conf" -- bash -c 'MEMRY_LIVE_NO_SECRET_SERVICE=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live'
          dbus-run-session --config-file="$RUNNER_TEMP/bare-bus.conf" -- bash -c 'MEMRY_LIVE_LATE_SERVICE=1 cargo nextest run --profile live --no-capture -p memry-desktop --features live-os-secrets --test keyring_live a_secret_service_that_starts_late'

      # DesktopReachability over the real OS watcher, in a network namespace of its own where the
      # test adds and removes the only usable address. The test binary runs as root under
      # `unshare -n`: the namespace starts with loopback only.
      - name: Reachability seam, live network namespace (Linux)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cargo test -p memry-desktop --test reachability_live --no-run
          binary=$(cargo test -p memry-desktop --test reachability_live --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "reachability_live" and .executable != null) | .executable')
          sudo unshare -n "$binary" --ignored

      # Proves reads through the pool do not wait behind a held write transaction, at the release
      # build's data volume (the test seeds 25x more rows without debug assertions). Optimised but
      # without the shipping profile's fat LTO and single codegen unit: the test asserts liveness,
      # not speed, and that link took 3 to 7 minutes of every run.
      - name: Test (memry-core, read pool contention, release)
        if: matrix.part != 'tests' && matrix.os != 'macos-15-intel'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test -p memry-core --release --test read_pool_contention

      # The editor host's time budgets (#3531): open, apply_update, sync step 1 and the quit's
      # write-back on a 2 KB, a 12 KB and a 5000-block note, release build as above. Linux only:
      # one runner type keeps the factor meaningful, and the macOS pool is the scarcest. The factor
      # covers a shared runner against the M5 Pro the budgets were measured on.
      - name: Editor host budgets (memry-desktop, release)
        if: matrix.part != 'tests' && matrix.os == 'ubuntu-22.04'
        timeout-minutes: 10
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          MEMRY_PERF_ENFORCE: '1'
          MEMRY_PERF_FACTOR: '3'
        run: cargo test -p memry-desktop --release --test editor_perf editor_perf -- --ignored --nocapture

      # The markdown converter (cargo feature `markdown`) is off by default so iOS links none
      # of it. The workspace clippy above only builds it where memry-desktop turns it on, so
      # the core is linted and tested with the feature explicitly.
      - name: Clippy (memry-core, markdown feature)
        if: matrix.part != 'tests' && matrix.os != 'macos-15-intel'
        run: cargo clippy -p memry-core --all-targets --features markdown -- -D warnings

      # Builds the ONNX Runtime environment, so a target whose library is missing or does not link
      # fails here, on every tier.
      - name: Test memry-ml
        if: matrix.part != 'tests'
        run: cargo nextest run -p memry-ml --no-fail-fast

      # The model tests run on the full tier only (#3540 K5): the pinned text files (207 MB) come
      # from a cache shared across OSes and, on a miss, from Hugging Face; the test checks their
      # size and hash before loading.
      - name: Restore the text model (memry-ml smoke)
        id: model-cache
        if: matrix.part != 'tests' && needs.plan.outputs.full == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: embeddinggemma-2-text-daa72c51243991dfcaf9f9137d2c573d8f7790c0
          enableCrossOsArchive: true

      - name: Download the text model (memry-ml smoke)
        if: matrix.part != 'tests' && needs.plan.outputs.full == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-2-ONNX/resolve/daa72c51243991dfcaf9f9137d2c573d8f7790c0
          dir=models/onnx-community/embeddinggemma-2-ONNX
          mkdir -p "$dir/onnx"
          for file in tokenizer.json onnx/model_q4.onnx onnx/model_q4.onnx_data; do
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
          done

      - name: Save the text model (memry-ml smoke)
        if: matrix.part != 'tests' && needs.plan.outputs.full == 'true' && steps.model-cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref != 'feat/tauri-v2')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/models
          key: embeddinggemma-2-text-daa72c51243991dfcaf9f9137d2c573d8f7790c0
          enableCrossOsArchive: true

      # The shipping profile (fat LTO): the smoke test embeds with the downloaded model, then the
      # test binary's size and its shared-library dependencies are printed. No ONNX Runtime or
      # DirectML library may be among them: ONNX Runtime is linked in, CPU only.
      - name: memry-ml smoke test and linked libraries (release)
        if: matrix.part != 'tests' && needs.plan.outputs.full == 'true'
        timeout-minutes: 30
        env:
          MEMRY_ML_MODEL_DIR: ${{ runner.temp }}/models/onnx-community/embeddinggemma-2-ONNX
        run: |
          cargo test -p memry-ml --release --test smoke -- --ignored
          # CARGO_TERM_COLOR=always would wrap the path in escape codes.
          bin=$(cargo test -p memry-ml --release --test smoke --no-run --color never 2>&1 | sed -n 's/.*Executable .*(\(.*\))$/\1/p' | tail -1)
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -u "$bin"); fi
          echo "Smoke test binary: $bin, $(wc -c < "$bin") bytes"
          case "$RUNNER_OS" in
            macOS) otool -L "$bin" ;;
            Linux) ldd "$bin" ;;
            Windows)
              dumpbin=$(ls /c/Program\ Files*/Microsoft\ Visual\ Studio/*/*/VC/Tools/MSVC/*/bin/Host*/*/dumpbin.exe | head -1)
              echo "dumpbin: $dumpbin"
              "$dumpbin" -dependents "$bin" ;; # `/dependents` would be rewritten as an MSYS path
          esac | tee "$RUNNER_TEMP/dependencies.txt"
          # An empty or failed listing would pass the check below.
          grep -qiE 'libc\.so|libSystem|KERNEL32' "$RUNNER_TEMP/dependencies.txt"
          if grep -iE 'onnxruntime|directml' "$RUNNER_TEMP/dependencies.txt"; then
            echo "::error::the memry-ml binary depends on a shared ONNX Runtime or DirectML library"
            exit 1
          fi

      - name: Test memry-cli
        if: matrix.part != 'tests' && runner.os == 'Linux'
        run: cargo nextest run -p memry-cli --no-fail-fast

      # The Rust core against the real Worker (miniflare, the D1 migrations): two desktop vaults
      # sync through the engine (crates/memry-desktop/tests/sync_harness.rs, cargo feature
      # `harness`, served by tests/sync-harness/scripts/serve.ts). The workspace clippy above
      # builds the file without the feature, so it is linted here.
      - name: Setup pnpm (sync harness)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js (sync harness)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the sync harness
        if: matrix.part != 'tests' && runner.os == 'Linux'
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "@memry/sync-harness..." --filter "@memry/sync-server..."

      - name: Sync harness (memry-desktop)
        if: matrix.part != 'tests' && runner.os == 'Linux'
        run: |
          cargo clippy -p memry-desktop --features harness --test sync_harness -- -D warnings
          cargo nextest run -p memry-desktop --features harness --test sync_harness --no-fail-fast

      - name: Line ceilings
        if: matrix.part != 'tests' && runner.os == 'Linux'
        working-directory: .
        run: node scripts/check-line-ceilings.mjs

      # A release build has no web inspector (apps/desktop-tauri/AGENTS.md, Dev tools). Tauri
      # compiles one in when any crate turns on the `devtools` feature of tauri or wry.
      - name: No devtools feature in the desktop build
        if: matrix.part != 'tests' && runner.os == 'Linux'
        run: |
          cargo tree -p memry-tauri -e normal,build,features --target all > "$RUNNER_TEMP/features.txt"
          if grep -E '(tauri|tauri-runtime-wry|wry) feature "devtools"' "$RUNNER_TEMP/features.txt"; then exit 1; fi

  # The article-extraction vectors and the entity table are generated from the TypeScript
  # oracle (linkedom, Defuddle, htmlparser2). A change to the oracle or its pins that ships
  # without regenerating them leaves the Rust port tested against a stale oracle.
  article-extract-oracle-fresh:
    name: Article-extraction vectors are current
    needs: plan
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') && ((github.event.action != 'labeled' && !(github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) || (github.event.action == 'labeled' && github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: *lean-checkout

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Vectors are current
        run: pnpm --filter @memry/article-extract vectors --check

      - name: Entity table is current
        run: pnpm --filter @memry/article-extract entities --check

  swift-bindings-fresh:
    name: Generated Swift bindings are current
    needs: plan
    # Fast tier: only when the UniFFI surface or the iOS app can have changed. Never in the merge queue
    # (macos=false): this is a macOS-only check (the XCFramework needs the iOS SDK), so a UniFFI drift
    # is caught on the PR when the diff touches the surface and on the push that follows the merge.
    if: ${{ !cancelled() && (needs.plan.outputs.paths == 'true' || needs.plan.result == 'failure') && needs.plan.outputs.macos != 'false' && (needs.plan.result == 'failure' || needs.plan.outputs.full == 'true' || needs.plan.outputs.swift == 'true') }}
    # macOS: the XCFramework needs the iOS SDK, and the bindings are generated
    # from the same build. Anything less proves nothing about what ships.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: *lean-checkout

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # Saves only on push, dispatch and PRs into main. A PR into feat/tauri-v2 and a merge-queue run
      # restore what the push to feat/tauri-v2 saved and write nothing (a save is 2-4 GB per job).
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: macos-26
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.base_ref != 'feat/tauri-v2') }}

      # Glob, not a fixed path: the runner image names it Xcode_26.x.app and the
      # patch version moves. Failing loudly with the available list beats a bare
      # "invalid developer directory".
      - name: Select Xcode 26
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No Xcode 26 on this runner. Found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Build XCFramework and regenerate bindings
        run: crates/memry-core/build-xcframework.sh

      # The binary is gitignored; the Swift beside it is committed. Only the
      # Swift is diffed.
      - name: Fail if the committed bindings drifted
        run: |
          if ! git diff --exit-code -- packages/swift/MemryCore/Sources/MemryCore/Generated/; then
            echo "::error::Generated Swift bindings are stale. Run crates/memry-core/build-xcframework.sh and commit the result."
            exit 1
          fi

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: MemryCoreFFI-xcframework
          path: packages/swift/MemryCore/MemryCoreFFI.xcframework
          retention-days: 7

  # The one check name a ruleset requires for this workflow (merge queue, #3517). Matrix legs and
  # fast/full tiers change which jobs exist; this name does not. A skipped job counts as passed.
  # Runs only for feat/tauri-v2 and the merge queue, so main and its PRs see no new check.
  gate:
    name: Rust CI gate
    needs: [plan, lint-and-test, article-extract-oracle-fresh, swift-bindings-fresh]
    # Skipped (not red) in noop runs: the merge queue is the authoritative gate.
    if: ${{ always() && !((github.event.action == 'labeled' && !(github.base_ref == 'feat/tauri-v2' && github.event.label.name == 'full-ci')) || (github.event.action == 'opened' && github.base_ref == 'feat/tauri-v2' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/tauri-v2' || github.ref == 'refs/heads/feat/tauri-v2') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DETECT_RESULT: ${{ needs.plan.result }}
        run: |
          echo "needed job results: $RESULTS"
          # A skipped detection job (a noop `labeled` or `opened` run) must not read as a pass.
          if [ "$DETECT_RESULT" != success ]; then echo "::error::plan job result was $DETECT_RESULT"; exit 1; fi
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
